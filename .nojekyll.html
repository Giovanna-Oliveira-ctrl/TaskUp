/* =========================================================
   TaskUp — style.css
   Design moderno, divertido, responsivo, claro/escuro.
   ========================================================= */

/* ---------- Tokens ---------- */
:root {
  --accent: #7c5cff;
  --accent-2: #b05cff;
  --accent-soft: rgba(124, 92, 255, 0.12);
  --grad: linear-gradient(135deg, var(--accent), var(--accent-2));

  --bg: #f5f4fb;
  --bg-2: #ecebf7;
  --surface: #ffffff;
  --surface-2: #f8f7fd;
  --border: #e6e4f2;
  --text: #1d1b2e;
  --text-2: #4b4867;
  --muted: #8a87a3;

  --success: #10b981;
  --danger: #ef4444;
  --warning: #f59e0b;
  --info: #0ea5e9;

  --radius: 18px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --shadow: 0 1px 2px rgba(30, 20, 80, 0.04), 0 8px 24px rgba(30, 20, 80, 0.06);
  --shadow-lg: 0 20px 60px rgba(30, 20, 80, 0.18);
  --sidebar: 260px;
  --topbar: 64px;
  --font: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'Noto Sans', sans-serif, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji';
  --ease: cubic-bezier(0.2, 0.8, 0.2, 1);
  --bounce: cubic-bezier(0.34, 1.56, 0.64, 1);
  color-scheme: light;
}

[data-theme='dark'] {
  --bg: #0f0f1a;
  --bg-2: #171727;
  --surface: #1a1a2b;
  --surface-2: #222236;
  --border: #2d2d45;
  --text: #f1f0fa;
  --text-2: #c5c3dc;
  --muted: #8d8aa8;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
  --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.55);
  color-scheme: dark;
}

/* ---------- Base ---------- */
*,
*::before,
*::after {
  box-sizing: border-box;
}
html {
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.5;
  color: var(--text);
  background: var(--bg);
  background-image: radial-gradient(1200px 600px at 100% -10%, var(--accent-soft), transparent 60%), radial-gradient(900px 500px at -10% 110%, var(--accent-soft), transparent 60%);
  background-attachment: fixed;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  transition: background-color 0.3s;
}
body.no-scroll {
  overflow: hidden;
}
h1,
h2,
h3,
h4 {
  margin: 0;
  line-height: 1.25;
  letter-spacing: -0.01em;
}
h3 {
  font-size: 1.02rem;
}
p {
  margin: 0;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button {
  cursor: pointer;
}
a {
  color: var(--accent);
}
code,
kbd {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  font-size: 0.85em;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 1px 6px;
}
hr {
  border: 0;
  border-top: 1px dashed var(--border);
  margin: 16px 0;
}
:focus-visible {
  outline: 3px solid var(--accent-soft);
  outline-offset: 2px;
  border-radius: 8px;
}
::selection {
  background: var(--accent-soft);
}
.skip-link {
  position: absolute;
  left: -999px;
  top: 8px;
  z-index: 100;
  background: var(--surface);
  padding: 8px 14px;
  border-radius: 8px;
}
.skip-link:focus {
  left: 8px;
}
[hidden] {
  display: none !important;
}

/* ---------- Utilitários ---------- */
.muted {
  color: var(--muted);
}
.small {
  font-size: 0.82rem;
}
.danger {
  color: var(--danger) !important;
}
.kicker {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--accent);
}
.big {
  font-size: 1.08rem;
}
.row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.row.between {
  justify-content: space-between;
}
.row.gap {
  gap: 10px;
}
.row.wrap {
  flex-wrap: wrap;
}
.grow {
  flex: 1;
  min-width: 0;
}
.mt {
  margin-top: 14px;
}
.mb {
  margin-bottom: 14px;
}
.center {
  text-align: center;
}
.grid {
  display: grid;
  gap: 18px;
}
.grid.two {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}
.grid.tight {
  gap: 12px;
}

/* ---------- Layout ---------- */
.app {
  display: flex;
  min-height: 100vh;
}
.sidebar {
  position: fixed;
  inset: 0 auto 0 0;
  width: var(--sidebar);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 18px 14px;
  gap: 14px;
  z-index: 40;
  overflow-y: auto;
  transition: transform 0.3s var(--ease);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px;
}
.brand-logo {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--grad);
  color: #fff;
  font-weight: 900;
  font-size: 1.2rem;
  box-shadow: 0 6px 16px var(--accent-soft);
  transform: rotate(-6deg);
}
.brand-name {
  font-size: 1.35rem;
  font-weight: 800;
  letter-spacing: -0.02em;
}
.brand-name b {
  background: var(--grad);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.side-profile {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px;
  cursor: pointer;
  display: grid;
  gap: 8px;
  transition: transform 0.2s var(--ease);
}
.side-profile:hover {
  transform: translateY(-2px);
}
.sp-top {
  display: flex;
  gap: 10px;
  align-items: center;
}
.sp-top strong {
  display: block;
  font-size: 0.95rem;
}
.sp-top small {
  color: var(--muted);
}
.sp-mascot {
  font-size: 1.9rem;
  width: 46px;
  height: 46px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border-radius: 50%;
  border: 2px solid var(--accent-soft);
  animation: float 3s ease-in-out infinite;
}
.sp-stats {
  display: flex;
  justify-content: space-between;
  font-size: 0.78rem;
  color: var(--text-2);
}
.side-nav {
  display: grid;
  gap: 4px;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 12px;
  width: 100%;
  padding: 10px 12px;
  border: 0;
  background: transparent;
  border-radius: var(--radius-sm);
  text-align: left;
  color: var(--text-2);
  font-weight: 600;
  transition: background 0.15s, color 0.15s, transform 0.15s;
  position: relative;
}
.nav-item:hover {
  background: var(--surface-2);
  color: var(--text);
}
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
}
.nav-item.active::before {
  content: '';
  position: absolute;
  left: -14px;
  top: 8px;
  bottom: 8px;
  width: 4px;
  border-radius: 0 4px 4px 0;
  background: var(--accent);
}
.nav-icon {
  font-size: 1.15rem;
  width: 24px;
  text-align: center;
}
.nav-label {
  flex: 1;
}
.nav-badge {
  min-width: 20px;
  height: 20px;
  padding: 0 6px;
  border-radius: 10px;
  background: var(--accent);
  color: #fff;
  font-size: 0.72rem;
  font-weight: 700;
  display: inline-grid;
  place-items: center;
}
.nav-badge.danger {
  background: var(--danger);
  color: #fff !important;
}
.side-footer {
  margin-top: auto;
  display: grid;
  gap: 8px;
}
.offline-note {
  text-align: center;
}
.scrim {
  display: none;
}

.main {
  flex: 1;
  margin-left: var(--sidebar);
  min-width: 0;
}
.topbar {
  position: sticky;
  top: 0;
  z-index: 30;
  height: var(--topbar);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 28px;
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid transparent;
}
.menu-btn {
  display: none;
}
.page-title {
  font-size: 1.25rem;
  font-weight: 800;
  flex: 1;
  display: flex;
  align-items: center;
  gap: 8px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}
.pomo-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 0;
  border-radius: 999px;
  padding: 6px 12px;
  background: var(--grad);
  color: #fff;
  font-weight: 700;
  font-variant-numeric: tabular-nums;
  box-shadow: 0 6px 16px var(--accent-soft);
  animation: pulse-soft 2s infinite;
}
.pomo-chip.paused {
  animation: none;
  opacity: 0.75;
}
.xp-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  border-radius: 999px;
  padding: 4px 10px 4px 4px;
}
.xc-level {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--grad);
  color: #fff;
  font-weight: 800;
  font-size: 0.8rem;
}
.xc-bar {
  width: 56px;
  height: 6px;
  border-radius: 6px;
  background: var(--bg-2);
  overflow: hidden;
}
.xc-bar i {
  display: block;
  height: 100%;
  background: linear-gradient(90deg, #facc15, #f59e0b);
  border-radius: 6px;
}

.view {
  padding: 8px 28px 48px;
  max-width: 1280px;
  margin: 0 auto;
  display: grid;
  gap: 18px;
  outline: none;
}
.view-enter {
  animation: view-in 0.35s var(--ease);
}

.bottom-nav,
.fab {
  display: none;
}

/* ---------- Cards ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  box-shadow: var(--shadow);
  min-width: 0;
}
.card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}
.card > h3 {
  margin-bottom: 14px;
}

/* ---------- Botões ---------- */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-weight: 600;
  font-size: 0.92rem;
  white-space: nowrap;
  transition: transform 0.15s var(--ease), box-shadow 0.2s, background 0.2s, border-color 0.2s;
  user-select: none;
}
.btn:hover:not(:disabled) {
  border-color: var(--accent);
  transform: translateY(-1px);
}
.btn:active:not(:disabled) {
  transform: translateY(0) scale(0.97);
}
.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.btn-primary {
  background: var(--grad);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 18px var(--accent-soft);
}
.btn-primary:hover:not(:disabled) {
  box-shadow: 0 10px 24px var(--accent-soft);
  border-color: transparent;
}
.btn-success {
  background: var(--success);
  color: #fff;
  border-color: transparent;
}
.btn-danger {
  background: var(--danger);
  color: #fff;
  border-color: transparent;
}
.btn-ghost {
  background: transparent;
  border-color: transparent;
}
.btn-ghost:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--border);
}
.btn-sm {
  padding: 6px 11px;
  font-size: 0.82rem;
  border-radius: 10px;
}
.btn-xl {
  padding: 13px 26px;
  font-size: 1.05rem;
}
.btn-block {
  width: 100%;
}
.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 36px;
  height: 36px;
  border-radius: 10px;
  border: 1px solid transparent;
  background: transparent;
  font-size: 1.05rem;
  color: var(--text-2);
  transition: background 0.15s, transform 0.15s;
  flex-shrink: 0;
}
.icon-btn:hover:not(:disabled) {
  background: var(--surface-2);
  border-color: var(--border);
}
.icon-btn:active {
  transform: scale(0.92);
}
.icon-btn:disabled {
  opacity: 0.3;
  cursor: default;
}
.icon-btn.lg {
  width: 52px;
  height: 52px;
  font-size: 1.4rem;
  border-radius: 50%;
  border-color: var(--border);
  background: var(--surface);
}
.icon-btn.sm {
  width: 30px;
  height: 30px;
  font-size: 0.9rem;
}
.link-btn {
  background: none;
  border: 0;
  color: var(--accent);
  font-weight: 600;
  font-size: 0.85rem;
  padding: 2px 4px;
}
.link-btn:hover {
  text-decoration: underline;
}
.pulse {
  animation: pulse-soft 1.6s infinite;
}

/* ---------- Pills / chips ---------- */
.pill {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 3px 10px;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 700;
  background: var(--surface-2);
  border: 1px solid var(--border);
  white-space: nowrap;
}
.pill-success {
  background: rgba(16, 185, 129, 0.12);
  color: var(--success);
  border-color: transparent;
}
.pill-danger {
  background: rgba(239, 68, 68, 0.12);
  color: var(--danger);
  border-color: transparent;
}
.pill-warn {
  background: rgba(245, 158, 11, 0.15);
  color: #b45309;
  border-color: transparent;
}
[data-theme='dark'] .pill-warn {
  color: #fbbf24;
}
.pill-live {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  animation: pulse-soft 1.5s infinite;
}
.chip {
  --c: var(--accent);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 9px;
  border-radius: 999px;
  font-size: 0.74rem;
  font-weight: 600;
  background: color-mix(in srgb, var(--c) 14%, transparent);
  color: color-mix(in srgb, var(--c) 80%, var(--text));
  white-space: nowrap;
}
.chip.lg {
  font-size: 0.95rem;
  padding: 6px 14px;
}
.meta {
  font-size: 0.78rem;
  color: var(--muted);
  white-space: nowrap;
}

/* ---------- Progresso ---------- */
.progress {
  height: 10px;
  border-radius: 10px;
  background: var(--bg-2);
  overflow: hidden;
}
.progress > span {
  display: block;
  height: 100%;
  border-radius: inherit;
  background: var(--grad);
  transition: width 0.6s var(--ease);
  position: relative;
  overflow: hidden;
}
.progress > span::after {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.35), transparent);
  transform: translateX(-100%);
  animation: shine 2.6s infinite;
}
.progress.sm {
  height: 6px;
}
.progress.lg {
  height: 14px;
}
.progress.xp > span {
  background: linear-gradient(90deg, #facc15, #f59e0b);
}

/* ---------- Formulários ---------- */
.input {
  width: 100%;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  border: 1.5px solid var(--border);
  background: var(--surface-2);
  color: var(--text);
  transition: border-color 0.15s, box-shadow 0.15s, background 0.15s;
  min-width: 0;
}
.input:focus {
  outline: none;
  border-color: var(--accent);
  box-shadow: 0 0 0 4px var(--accent-soft);
  background: var(--surface);
}
.input::placeholder {
  color: var(--muted);
}
textarea.input {
  resize: vertical;
  min-height: 70px;
}
select.input {
  cursor: pointer;
}
.input-lg {
  font-size: 1.1rem;
  padding: 12px 14px;
  font-weight: 600;
}
.input-sm {
  padding: 6px 10px;
  font-size: 0.88rem;
  width: auto;
}
.input-group {
  display: flex;
  gap: 8px;
}
.form {
  display: grid;
  gap: 16px;
}
.field {
  display: grid;
  gap: 6px;
}
.field > label,
.field > span {
  font-size: 0.82rem;
  font-weight: 700;
  color: var(--text-2);
}
.field-row {
  display: flex;
  gap: 10px;
  align-items: center;
}
.form-actions {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding-top: 6px;
  flex-wrap: wrap;
}
.quick-dates {
  display: flex;
  flex-wrap: wrap;
  gap: 2px 8px;
}
.quick-dates .link-btn {
  font-size: 0.76rem;
}
.segmented {
  display: flex;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 4px;
  gap: 4px;
}
.segmented label {
  flex: 1;
  position: relative;
}
.segmented input {
  position: absolute;
  opacity: 0;
  pointer-events: none;
}
.segmented span {
  display: block;
  text-align: center;
  padding: 7px 8px;
  border-radius: 9px;
  font-size: 0.86rem;
  font-weight: 600;
  cursor: pointer;
  color: var(--text-2);
  transition: background 0.2s, color 0.2s, box-shadow 0.2s;
  white-space: nowrap;
}
.segmented input:checked + span {
  background: var(--surface);
  color: var(--accent);
  box-shadow: var(--shadow);
}
.segmented input:focus-visible + span {
  outline: 2px solid var(--accent);
}

.switch-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  padding: 10px 0;
  cursor: pointer;
  border-bottom: 1px solid var(--border);
}
.switch-row:last-child {
  border-bottom: 0;
}
.switch-row > span:first-child {
  display: grid;
}
.switch-row small {
  font-size: 0.8rem;
}
.switch-row.disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.switch {
  position: relative;
  flex-shrink: 0;
}
.switch input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: inherit;
  z-index: 1;
}
.switch i {
  display: block;
  width: 46px;
  height: 26px;
  border-radius: 26px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  position: relative;
  transition: background 0.2s;
}
.switch i::after {
  content: '';
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  transition: transform 0.25s var(--bounce);
}
.switch input:checked + i {
  background: var(--accent);
  border-color: transparent;
}
.switch input:checked + i::after {
  transform: translateX(20px);
}
.switch input:focus-visible + i {
  outline: 3px solid var(--accent-soft);
}
.sub-settings {
  padding-left: 14px;
  border-left: 3px solid var(--accent-soft);
  margin-left: 4px;
}
.num-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 10px 0;
  border-bottom: 1px solid var(--border);
}
.num-input {
  display: flex;
  align-items: center;
  gap: 6px;
}
.num-input .input {
  width: 80px;
  text-align: center;
}
.range {
  accent-color: var(--accent);
  width: 180px;
}
.mini-check {
  position: relative;
  display: inline-block;
}
.mini-check input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
}
.mini-check span {
  display: block;
  width: 20px;
  height: 20px;
  border-radius: 6px;
  border: 2px solid var(--border);
}
.mini-check input:checked + span {
  background: var(--success);
  border-color: var(--success);
}

/* Emoji / cor */
.emoji-picker {
  position: relative;
}
.emoji-current {
  width: 50px;
  height: 50px;
  border-radius: var(--radius-sm);
  border: 1.5px dashed var(--border);
  background: var(--surface-2);
  font-size: 1.5rem;
  transition: transform 0.2s var(--bounce);
}
.emoji-current:hover {
  transform: scale(1.08) rotate(-4deg);
  border-color: var(--accent);
}
.emoji-grid {
  position: absolute;
  top: 56px;
  left: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(8, 36px);
  gap: 4px;
  padding: 8px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  animation: pop-in 0.2s var(--bounce);
}
.emoji-opt {
  width: 36px;
  height: 36px;
  border: 0;
  background: transparent;
  border-radius: 8px;
  font-size: 1.2rem;
}
.emoji-opt:hover {
  background: var(--accent-soft);
  transform: scale(1.15);
}
.color-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}
.color-opt {
  position: relative;
  cursor: pointer;
}
.color-opt input[type='radio'] {
  position: absolute;
  opacity: 0;
}
.color-opt span {
  display: block;
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--c);
  transition: transform 0.2s var(--bounce);
  border: 3px solid transparent;
}
.color-opt input:checked + span {
  border-color: var(--surface);
  box-shadow: 0 0 0 2px var(--c);
  transform: scale(1.1);
}
.color-custom input {
  width: 30px;
  height: 30px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: none;
  cursor: pointer;
}
.cat-preview {
  min-height: 34px;
}

/* ---------- Estados vazios ---------- */
.empty-state {
  text-align: center;
  padding: 36px 16px;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.empty-state.small {
  padding: 18px 10px;
}
.empty-emoji {
  font-size: 2.8rem;
  animation: float 3s ease-in-out infinite;
}
.empty-state.small .empty-emoji {
  font-size: 2rem;
}

/* ---------- Toasts ---------- */
.toast-root {
  position: fixed;
  right: 20px;
  bottom: 20px;
  z-index: 200;
  display: grid;
  gap: 10px;
  width: min(380px, calc(100vw - 32px));
  pointer-events: none;
}
.toast {
  pointer-events: auto;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 12px 12px 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  transform: translateY(20px) scale(0.95);
  opacity: 0;
  transition: transform 0.35s var(--bounce), opacity 0.25s;
}
.toast.show {
  transform: none;
  opacity: 1;
}
.toast.hide {
  transform: translateX(30px);
  opacity: 0;
}
.toast-icon {
  font-size: 1.3rem;
}
.toast-text {
  flex: 1;
  font-size: 0.9rem;
  font-weight: 500;
}
.toast-action {
  border: 0;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 700;
  padding: 6px 10px;
  border-radius: 8px;
  font-size: 0.82rem;
}
.toast-close {
  border: 0;
  background: none;
  color: var(--muted);
  font-size: 1.2rem;
  padding: 0 4px;
}
.toast-xp {
  border-color: #facc15;
  background: linear-gradient(135deg, color-mix(in srgb, #facc15 14%, var(--surface)), var(--surface));
}
.toast-achievement {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface));
}
.toast-error {
  border-color: var(--danger);
}
.toast-success {
  border-color: var(--success);
}

/* ---------- Modais ---------- */
.modal-backdrop {
  position: fixed;
  inset: 0;
  z-index: 100;
  background: rgba(15, 12, 35, 0.45);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: grid;
  place-items: center;
  padding: 16px;
  opacity: 0;
  transition: opacity 0.2s;
  overflow-y: auto;
}
.modal-backdrop.show {
  opacity: 1;
}
.modal {
  width: 100%;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 22px;
  box-shadow: var(--shadow-lg);
  transform: translateY(16px) scale(0.97);
  transition: transform 0.3s var(--bounce);
}
.modal-backdrop.show .modal {
  transform: none;
}
.modal-sm {
  max-width: 420px;
}
.modal-md {
  max-width: 620px;
}
.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 22px 0;
}
.modal-header h2 {
  font-size: 1.2rem;
}
.modal-body {
  padding: 18px 22px 22px;
}
.modal-confirm .modal-body {
  text-align: center;
  display: grid;
  gap: 10px;
}
.confirm-icon {
  font-size: 2.6rem;
  animation: pop-in 0.4s var(--bounce);
}
.confirm-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
  margin-top: 8px;
}
.confirm-actions .btn {
  flex: 1;
}
.levelup {
  text-align: center;
  display: grid;
  gap: 8px;
  justify-items: center;
}
.levelup-badge {
  font-size: 3.6rem;
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--grad);
  box-shadow: 0 0 0 10px var(--accent-soft), 0 20px 40px var(--accent-soft);
  animation: levelup 0.9s var(--bounce);
}
.levelup-kicker {
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.1em;
  margin-top: 10px;
  font-size: 0.8rem;
}
.levelup h2 {
  font-size: 2.2rem;
}
.levelup .btn {
  margin-top: 10px;
}
.onb {
  text-align: center;
  display: grid;
  gap: 10px;
}
.onb-hero {
  font-size: 3rem;
  animation: float 3s ease-in-out infinite;
}
.onb .form {
  text-align: left;
  margin-top: 10px;
}

/* Popover */
.popover {
  position: fixed;
  z-index: 90;
  width: 210px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow-lg);
  padding: 6px;
  display: grid;
  animation: pop-in 0.18s var(--ease);
}
.popover button {
  border: 0;
  background: none;
  text-align: left;
  padding: 9px 10px;
  border-radius: 8px;
  font-size: 0.88rem;
}
.popover button:hover {
  background: var(--surface-2);
}

/* ---------- Tarefas ---------- */
.task-list {
  display: grid;
  gap: 8px;
}
.task-item {
  --cat: var(--accent);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 10px 12px 14px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-left: 4px solid var(--cat);
  border-radius: var(--radius-sm);
  transition: transform 0.2s var(--ease), box-shadow 0.2s, opacity 0.3s, background 0.2s;
  animation: item-in 0.3s var(--ease) both;
}
.task-item:hover {
  transform: translateX(3px);
  box-shadow: var(--shadow);
}
.task-item.done {
  opacity: 0.6;
  background: var(--surface-2);
}
.task-item.done .task-title span:not(.task-emoji):not(.prio-dot) {
  text-decoration: line-through;
  text-decoration-thickness: 2px;
  color: var(--muted);
}
.task-item.overdue {
  background: linear-gradient(90deg, rgba(239, 68, 68, 0.06), var(--surface) 40%);
}
.task-item.just-toggled {
  animation: bump 0.4s var(--bounce);
}
.task-item.compact {
  padding: 9px 8px 9px 12px;
}
.check {
  flex-shrink: 0;
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid color-mix(in srgb, var(--cat, var(--accent)) 60%, var(--border));
  background: transparent;
  display: grid;
  place-items: center;
  padding: 0;
  transition: background 0.2s, border-color 0.2s, transform 0.2s var(--bounce);
}
.check svg {
  width: 16px;
  height: 16px;
  fill: none;
  stroke: #fff;
  stroke-width: 3;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 24;
  stroke-dashoffset: 24;
  transition: stroke-dashoffset 0.3s var(--ease) 0.05s;
}
.check:hover {
  transform: scale(1.12);
  background: color-mix(in srgb, var(--cat, var(--accent)) 15%, transparent);
}
.done > .check,
.done .check {
  background: var(--success);
  border-color: var(--success);
}
.done > .check svg,
.done .check svg {
  stroke-dashoffset: 0;
}
.check.sm {
  width: 22px;
  height: 22px;
}
.check.sm svg {
  width: 13px;
  height: 13px;
}
.task-body {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  display: grid;
  gap: 4px;
}
.task-title {
  font-weight: 600;
  display: flex;
  align-items: center;
  gap: 6px;
  min-width: 0;
}
.task-title > span:nth-last-child(2) {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.task-emoji {
  flex-shrink: 0;
}
.prio-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.prio-high .prio-dot {
  background: var(--danger);
  box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.18);
}
.prio-medium .prio-dot {
  background: var(--warning);
}
.prio-low .prio-dot {
  background: var(--success);
}
.task-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 4px 10px;
  align-items: center;
}
.task-actions {
  display: flex;
  gap: 2px;
  opacity: 0.55;
  transition: opacity 0.2s;
}
.task-item:hover .task-actions,
.task-actions:focus-within {
  opacity: 1;
}
.task-group {
  display: grid;
  gap: 10px;
}
.group-title .link-btn {
  margin-left: auto;
  font-size: 0.78rem;
}
.group-title {
  font-size: 0.9rem;
  color: var(--text-2);
  display: flex;
  align-items: center;
  gap: 8px;
}
.count {
  font-size: 0.72rem;
  background: var(--bg-2);
  color: var(--text-2);
  padding: 1px 8px;
  border-radius: 999px;
}
.tasks-wrap {
  display: grid;
  gap: 22px;
}

.quick-add-card {
  padding: 14px;
}
.quick-add {
  display: flex;
  gap: 8px;
  align-items: center;
}
.qa-icon {
  font-size: 1.3rem;
  padding: 0 4px;
}
.quick-add .input {
  flex: 1;
}
.qa-hint {
  margin-top: 8px;
  padding-left: 4px;
}
.quick-add.mini {
  margin-top: 12px;
}

.filters {
  display: grid;
  gap: 12px;
}
.chips-scroll {
  display: flex;
  gap: 8px;
  overflow-x: auto;
  padding-bottom: 4px;
  scrollbar-width: none;
}
.chips-scroll::-webkit-scrollbar {
  display: none;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 14px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: var(--surface);
  font-weight: 600;
  font-size: 0.85rem;
  white-space: nowrap;
  color: var(--text-2);
  transition: all 0.2s;
}
.filter-chip span {
  font-size: 0.72rem;
  background: var(--bg-2);
  padding: 0 7px;
  border-radius: 999px;
}
.filter-chip.active {
  background: var(--accent);
  color: #fff;
  border-color: transparent;
  box-shadow: 0 6px 16px var(--accent-soft);
}
.filter-chip.active span {
  background: rgba(255, 255, 255, 0.25);
}
.filters-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.filters-row select {
  width: auto;
  flex: 0 1 200px;
}
.search {
  flex: 1 1 220px;
  display: flex;
  align-items: center;
  gap: 4px;
  position: relative;
}
.search > span {
  position: absolute;
  left: 12px;
  pointer-events: none;
}
.search .input {
  padding-left: 36px;
}

.subtask-editor {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 6px;
}
.subtask-editor li {
  display: flex;
  align-items: center;
  gap: 8px;
}
.subtask-editor .input {
  flex: 1;
  width: auto;
}

/* ---------- Dashboard ---------- */
.hero {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  align-items: center;
  position: relative;
  overflow: hidden;
  background: linear-gradient(135deg, var(--accent-soft), transparent 60%), var(--surface);
  padding: 26px 28px;
}
.hero::after {
  content: '';
  position: absolute;
  right: -60px;
  top: -60px;
  width: 220px;
  height: 220px;
  border-radius: 50%;
  background: var(--grad);
  opacity: 0.1;
}
.hero h1 {
  font-size: clamp(1.6rem, 3.2vw, 2.2rem);
  font-weight: 800;
  margin: 4px 0;
}
.hero-sub {
  color: var(--text-2);
  font-size: 1.05rem;
}
.wave {
  display: inline-block;
  animation: wiggle 2.4s ease-in-out infinite;
  transform-origin: 70% 70%;
}
.hero-mascot {
  position: relative;
  display: grid;
  justify-items: center;
  gap: 8px;
  z-index: 1;
}
.mascot {
  font-size: 4rem;
  width: 110px;
  height: 110px;
  display: grid;
  place-items: center;
  background: var(--surface);
  border-radius: 50%;
  box-shadow: 0 0 0 8px var(--accent-soft), var(--shadow);
  animation: float 3.2s ease-in-out infinite;
}
.mascot.happy {
  animation: jump 0.9s var(--bounce) infinite;
}
.speech {
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 6px 12px;
  border-radius: 14px;
  font-size: 0.82rem;
  font-weight: 600;
  box-shadow: var(--shadow);
  white-space: nowrap;
  position: relative;
}
.speech::before {
  content: '';
  position: absolute;
  top: -6px;
  left: 50%;
  width: 10px;
  height: 10px;
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-top: 1px solid var(--border);
  transform: translateX(-50%) rotate(45deg);
}

.stats {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 14px;
}
.stat-card {
  --c: var(--accent);
  display: grid;
  grid-template-columns: auto 1fr;
  grid-template-rows: auto auto;
  column-gap: 12px;
  align-items: center;
  text-align: left;
  padding: 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  transition: transform 0.2s var(--bounce), box-shadow 0.2s;
}
.stat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.stat-card strong {
  font-size: 1.6rem;
  line-height: 1.1;
  font-weight: 800;
}
.stat-card > span:last-child {
  grid-column: 2;
  font-size: 0.8rem;
  color: var(--muted);
}
.stat-icon {
  grid-row: span 2;
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 1.35rem;
  background: color-mix(in srgb, var(--c) 15%, transparent);
}
.stat-card.alert {
  border-color: rgba(239, 68, 68, 0.4);
}
.stat-card.alert strong {
  color: var(--danger);
}
.flame.on {
  animation: flame 1.4s ease-in-out infinite;
}
.dash-grid {
  grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
  align-items: start;
}
.progress-wrap {
  display: flex;
  align-items: center;
  gap: 20px;
}
.progress-wrap > div {
  flex: 1;
  display: grid;
  gap: 8px;
}
.ring {
  width: 110px;
  height: 110px;
  flex-shrink: 0;
  transform: rotate(-90deg);
}
.ring-track {
  fill: none;
  stroke: var(--bg-2);
  stroke-width: 10;
}
.ring-bar {
  fill: none;
  stroke: var(--accent);
  stroke-width: 10;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.8s var(--ease);
}
.ring-text {
  transform: rotate(90deg);
  transform-origin: 50px 50px;
  text-anchor: middle;
  dominant-baseline: central;
  font-size: 20px;
  font-weight: 800;
  fill: var(--text);
}
.level-strip {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
  padding: 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  cursor: pointer;
}
.level-badge {
  font-size: 1.5rem;
}
.bars {
  display: flex;
  align-items: flex-end;
  gap: 8px;
  height: 150px;
}
.bar {
  flex: 1;
  height: 100%;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;
  align-items: center;
  gap: 4px;
}
.bar i {
  display: block;
  width: 100%;
  max-width: 34px;
  min-height: 4px;
  border-radius: 8px 8px 4px 4px;
  background: color-mix(in srgb, var(--accent) 35%, var(--bg-2));
  transition: height 0.6s var(--ease);
}
.bar.today i {
  background: var(--grad);
}
.bar small {
  font-size: 0.72rem;
  color: var(--muted);
}
.bar-n {
  font-size: 0.72rem;
  font-weight: 700;
  color: var(--text-2);
  min-height: 1em;
}
.cat-stats {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 12px;
}
.cat-stats li {
  display: flex;
  align-items: center;
  gap: 12px;
  cursor: pointer;
  border-radius: 10px;
}
.cat-emoji {
  --c: var(--accent);
  width: 46px;
  height: 46px;
  border-radius: 14px;
  display: grid;
  place-items: center;
  font-size: 1.4rem;
  background: color-mix(in srgb, var(--c) 16%, transparent);
  flex-shrink: 0;
}
.cat-emoji.sm {
  width: 36px;
  height: 36px;
  font-size: 1.1rem;
  border-radius: 10px;
}

/* ---------- Rotina ---------- */
.routine-head {
  display: flex;
  align-items: center;
  gap: 20px;
  flex-wrap: wrap;
}
.date-nav {
  display: flex;
  align-items: center;
  gap: 6px;
}
.date-nav-label {
  display: grid;
  text-align: center;
  min-width: 150px;
}
.date-nav-label strong {
  font-size: 1.1rem;
}
.routine-progress {
  flex: 1;
  min-width: 200px;
  display: grid;
  gap: 6px;
  margin-bottom: 4px;
}
.routine-grid {
  grid-template-columns: minmax(0, 1.7fr) minmax(280px, 1fr);
  align-items: start;
}
.routine-side {
  display: grid;
  gap: 18px;
}
.timeline {
  position: relative;
  display: grid;
  gap: 10px;
}
.timeline::before {
  content: '';
  position: absolute;
  left: 107px;
  top: 10px;
  bottom: 10px;
  width: 3px;
  border-radius: 3px;
  background: linear-gradient(var(--accent-soft), var(--border));
}
.tl-item {
  --cat: var(--accent);
  display: grid;
  grid-template-columns: 88px 42px 1fr;
  gap: 4px;
  align-items: start;
  animation: item-in 0.35s var(--ease) both;
}
.tl-time {
  display: grid;
  justify-items: end;
  padding-top: 6px;
}
.time-label {
  border: 1px dashed transparent;
  background: transparent;
  font-weight: 800;
  font-size: 1.05rem;
  padding: 2px 6px;
  border-radius: 8px;
  font-variant-numeric: tabular-nums;
  color: var(--text);
}
.time-label:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.time-input {
  border: 1px solid transparent;
  background: transparent;
  font-weight: 800;
  font-size: 1rem;
  padding: 2px 4px;
  border-radius: 8px;
  width: 88px;
  text-align: right;
  font-variant-numeric: tabular-nums;
  cursor: pointer;
}
.time-input:hover,
.time-input:focus {
  border-color: var(--border);
  background: var(--surface-2);
  outline: none;
}
.time-input.sm {
  width: auto;
  font-size: 0.82rem;
  font-weight: 600;
  border-color: var(--border);
  color: var(--muted);
}
.tl-end {
  font-size: 0.72rem;
  color: var(--muted);
  padding-right: 6px;
}
.tl-dot {
  display: grid;
  place-items: center;
  padding-top: 2px;
  z-index: 1;
}
.tl-dot span {
  width: 38px;
  height: 38px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface);
  border: 3px solid var(--cat);
  font-size: 1.05rem;
  box-shadow: 0 0 0 4px var(--surface);
  transition: transform 0.3s var(--bounce);
}
.tl-item:hover .tl-dot span {
  transform: scale(1.1) rotate(-8deg);
}
.tl-card {
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  padding: 12px 14px;
  display: flex;
  justify-content: space-between;
  gap: 10px;
  align-items: center;
  flex-wrap: wrap;
  transition: box-shadow 0.2s, transform 0.2s;
}
.tl-item:hover .tl-card {
  box-shadow: var(--shadow);
}
.tl-main {
  cursor: pointer;
  display: grid;
  gap: 6px;
  flex: 1;
  min-width: 160px;
}
.tl-title {
  font-weight: 700;
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.tl-meta {
  display: flex;
  gap: 6px 10px;
  flex-wrap: wrap;
  align-items: center;
}
.tl-actions {
  display: flex;
  gap: 6px;
  align-items: center;
}
.tl-item.done .tl-card {
  opacity: 0.6;
}
.tl-item.done .tl-title {
  text-decoration: line-through;
  color: var(--muted);
}
.tl-item.done .tl-dot span {
  background: var(--success);
  border-color: var(--success);
}
.tl-item.current .tl-card {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface));
  box-shadow: 0 8px 24px var(--accent-soft);
}
.tl-item.current .tl-dot span {
  animation: pulse-ring 1.8s infinite;
}
.tl-item.late .tl-card {
  border-color: rgba(239, 68, 68, 0.35);
}
.tl-now {
  display: grid;
  grid-template-columns: 88px 42px 1fr;
  gap: 4px;
  align-items: center;
  color: var(--danger);
  font-weight: 800;
  font-size: 0.8rem;
}
.tl-now span {
  text-align: right;
  padding-right: 6px;
}
.tl-now i {
  justify-self: center;
  width: 14px;
  height: 14px;
  border-radius: 50%;
  background: var(--danger);
  box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.2);
  z-index: 1;
  animation: pulse-soft 1.4s infinite;
}
.tl-now b {
  height: 2px;
  background: linear-gradient(90deg, var(--danger), transparent);
  font-size: 0;
}
.tl-gap {
  margin-left: 134px;
  border: 1.5px dashed var(--border);
  background: transparent;
  border-radius: var(--radius-sm);
  padding: 8px 12px;
  color: var(--muted);
  font-size: 0.82rem;
  text-align: left;
  transition: all 0.2s;
}
.tl-gap:hover {
  border-color: var(--accent);
  color: var(--accent);
  background: var(--accent-soft);
}
.untimed {
  display: grid;
  gap: 8px;
  margin-bottom: 8px;
}
.untimed-item {
  --cat: var(--accent);
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface-2);
  border-left: 3px solid var(--cat);
}
.untimed-item.done .untimed-title {
  text-decoration: line-through;
  color: var(--muted);
}
.untimed-title {
  flex: 1;
  cursor: pointer;
  font-weight: 600;
  font-size: 0.9rem;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.templates {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.template {
  border: 1px solid var(--border);
  background: var(--surface-2);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 0.84rem;
  font-weight: 600;
  transition: all 0.2s var(--bounce);
}
.template span {
  color: var(--muted);
  font-weight: 500;
  font-size: 0.76rem;
}
.template:hover {
  border-color: var(--accent);
  transform: translateY(-2px) scale(1.03);
  background: var(--accent-soft);
}

/* ---------- Calendário ---------- */
.cal-grid {
  grid-template-columns: minmax(0, 1.6fr) minmax(300px, 1fr);
  align-items: start;
}
.cal-head {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 14px;
}
.cal-head h3 {
  flex: 1;
  text-align: center;
  font-size: 1.25rem;
  text-transform: capitalize;
}
.cal-weekdays,
.cal-days {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
}
.cal-weekdays span {
  text-align: center;
  font-size: 0.75rem;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  padding-bottom: 4px;
}
.cal-cell {
  position: relative;
  aspect-ratio: 1 / 0.9;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--surface-2);
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  justify-content: space-between;
  padding: 6px 8px;
  transition: transform 0.15s var(--bounce), border-color 0.15s, background 0.15s;
  min-width: 0;
}
.cal-cell:hover {
  transform: scale(1.04);
  border-color: var(--accent);
  z-index: 1;
}
.cal-cell.other {
  opacity: 0.4;
}
.cal-num {
  font-weight: 700;
  font-size: 0.9rem;
}
.cal-cell.today .cal-num {
  background: var(--grad);
  color: #fff;
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  margin: -2px 0 0 -3px;
}
.cal-cell.selected {
  border-color: var(--accent);
  border-width: 2px;
  background: var(--accent-soft);
}
.cal-cell.has-overdue {
  box-shadow: inset 0 -3px 0 var(--danger);
}
.cal-cell.all-done {
  box-shadow: inset 0 -3px 0 var(--success);
}
.cal-dots {
  display: flex;
  gap: 3px;
  align-items: center;
  flex-wrap: wrap;
}
.cal-dots i {
  width: 7px;
  height: 7px;
  border-radius: 50%;
}
.cal-dots i.faded {
  opacity: 0.35;
}
.cal-dots b {
  font-size: 0.62rem;
  color: var(--muted);
}
.cal-count {
  position: absolute;
  top: 6px;
  right: 7px;
  font-size: 0.68rem;
  font-weight: 800;
  color: var(--accent);
}
.cal-legend {
  display: flex;
  gap: 16px;
  margin-top: 12px;
  flex-wrap: wrap;
}
.cal-legend span {
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.lg {
  width: 12px;
  height: 12px;
  border-radius: 4px;
  display: inline-block;
}
.lg.today {
  background: var(--grad);
  border-radius: 50%;
}
.lg.overdue {
  background: var(--danger);
}
.lg.done {
  background: var(--success);
}
.day-panel {
  position: sticky;
  top: calc(var(--topbar) + 10px);
}
.day-panel .routine-progress {
  margin-bottom: 14px;
}

/* ---------- Pomodoro ---------- */
.pomo-grid {
  grid-template-columns: minmax(0, 1.3fr) minmax(280px, 1fr);
  align-items: start;
}
.pomo-card {
  display: grid;
  justify-items: center;
  gap: 22px;
  padding: 28px 20px;
  background: radial-gradient(circle at 50% 40%, var(--accent-soft), transparent 70%), var(--surface);
}
.pomo-card.mode-short {
  --accent: #10b981;
  --accent-2: #34d399;
  --accent-soft: rgba(16, 185, 129, 0.16);
}
.pomo-card.mode-long {
  --accent: #0ea5e9;
  --accent-2: #38bdf8;
  --accent-soft: rgba(14, 165, 233, 0.16);
}
.pomo-modes {
  width: 100%;
  max-width: 460px;
}
.pomo-ring-wrap {
  position: relative;
  width: min(300px, 78vw);
  aspect-ratio: 1;
}
.pomo-svg {
  width: 100%;
  height: 100%;
  transform: rotate(-90deg);
}
.pomo-track {
  fill: none;
  stroke: var(--bg-2);
  stroke-width: 14;
}
.pomo-progress {
  fill: none;
  stroke: var(--accent);
  stroke-width: 14;
  stroke-linecap: round;
  transition: stroke-dashoffset 0.5s linear, stroke 0.3s;
  filter: drop-shadow(0 0 8px var(--accent-soft));
}
.pomo-ring-wrap.running .pomo-svg {
  animation: breathe 4s ease-in-out infinite;
}
.pomo-center {
  position: absolute;
  inset: 0;
  display: grid;
  place-content: center;
  text-align: center;
  gap: 4px;
  padding: 40px;
}
.pomo-mode-label {
  font-weight: 700;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-size: 0.8rem;
}
.pomo-time {
  font-size: clamp(3rem, 12vw, 4.2rem);
  font-weight: 800;
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.03em;
  line-height: 1;
}
.pomo-task-label {
  font-size: 0.85rem;
  color: var(--muted);
  max-width: 200px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.pomo-controls {
  display: flex;
  align-items: center;
  gap: 18px;
}
.pomo-controls .btn-xl {
  min-width: 160px;
  border-radius: 999px;
}
.pomo-cycle {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  justify-content: center;
}
.pomo-cycle span {
  font-size: 1.3rem;
  filter: grayscale(1);
  opacity: 0.3;
  transition: all 0.3s var(--bounce);
}
.pomo-cycle span.on {
  filter: none;
  opacity: 1;
  transform: scale(1.1);
}
.pomo-side {
  display: grid;
  gap: 18px;
}
.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  text-align: center;
}
.stat-row > div {
  display: grid;
  background: var(--surface-2);
  border-radius: var(--radius-sm);
  padding: 12px 6px;
}
.stat-row strong {
  font-size: 1.3rem;
}
.tips {
  margin: 12px 0 0;
  padding: 0;
  list-style: none;
  display: grid;
  gap: 6px;
  font-size: 0.86rem;
  color: var(--text-2);
}

/* ---------- Conquistas / Gamificação ---------- */
.game-top {
  grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
}
.level-hero {
  grid-column: 1 / -1;
  display: flex;
  align-items: center;
  gap: 22px;
  background: linear-gradient(135deg, var(--accent-soft), transparent 70%), var(--surface);
}
.level-hero-badge {
  font-size: 3rem;
  width: 96px;
  height: 96px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 28px;
  background: var(--grad);
  box-shadow: 0 12px 30px var(--accent-soft);
  transform: rotate(-6deg);
  animation: float 3s ease-in-out infinite;
}
.level-hero-info {
  flex: 1;
  display: grid;
  gap: 8px;
}
.level-hero-info h2 {
  font-size: 1.7rem;
}
.stat-mini {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px;
}
.stat-mini > div {
  display: grid;
}
.stat-mini strong {
  font-size: 1.4rem;
  line-height: 1.1;
}
.stat-mini span:not(.stat-emoji) {
  font-size: 0.78rem;
  color: var(--muted);
}
.stat-emoji {
  font-size: 1.8rem;
}
.missions {
  list-style: none;
  margin: 0;
  padding: 0;
  display: grid;
  gap: 10px;
}
.mission {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 12px;
  border-radius: var(--radius-sm);
  background: var(--surface-2);
  border: 1px solid var(--border);
  transition: all 0.3s;
}
.mission.done:not(.claimed) {
  border-color: var(--accent);
  background: linear-gradient(135deg, var(--accent-soft), var(--surface-2));
}
.mission.claimed {
  opacity: 0.6;
}
.mission-emoji {
  font-size: 1.5rem;
}
.mission-body {
  flex: 1;
  display: grid;
  gap: 4px;
  font-weight: 600;
  font-size: 0.9rem;
  min-width: 0;
}
.mission-body .muted {
  font-weight: 500;
}
.achievements {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
  gap: 12px;
}
.achievement {
  display: grid;
  justify-items: center;
  text-align: center;
  gap: 4px;
  padding: 16px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  position: relative;
  transition: transform 0.2s var(--bounce);
}
.achievement:hover {
  transform: translateY(-3px);
}
.achievement strong {
  font-size: 0.88rem;
}
.achievement.locked {
  filter: grayscale(0.9);
  opacity: 0.55;
}
.achievement.unlocked {
  border-color: color-mix(in srgb, #facc15 60%, var(--border));
  background: linear-gradient(160deg, color-mix(in srgb, #facc15 12%, var(--surface-2)), var(--surface-2));
}
.ach-emoji {
  font-size: 2.2rem;
}
.achievement.unlocked .ach-emoji {
  animation: pop-in 0.5s var(--bounce);
}
.ach-date {
  font-size: 0.7rem;
  color: var(--accent);
  font-weight: 700;
}
.shop-title {
  margin: 18px 0 10px;
  font-size: 0.9rem;
  color: var(--text-2);
}
.shop {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
  gap: 12px;
}
.shop-item {
  display: grid;
  justify-items: center;
  gap: 8px;
  padding: 14px 8px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--surface-2);
  text-align: center;
  font-size: 0.86rem;
}
.shop-item.equipped {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-soft);
}
.swatch {
  width: 48px;
  height: 48px;
  border-radius: 14px;
}
.mascot-big {
  font-size: 2.2rem;
  line-height: 48px;
}

/* ---------- Categorias ---------- */
.cat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
  gap: 16px;
}
.cat-card {
  --c: var(--accent);
  display: grid;
  gap: 12px;
  border-top: 4px solid var(--c);
  transition: transform 0.2s var(--bounce), box-shadow 0.2s;
}
.cat-card:hover {
  transform: translateY(-3px);
  box-shadow: var(--shadow-lg);
}
.cat-card-top {
  display: flex;
  gap: 12px;
  align-items: center;
  cursor: pointer;
}
.cat-card .cat-emoji {
  background: color-mix(in srgb, var(--c) 16%, transparent);
}
.cat-progress > span {
  background: var(--c);
}
.cat-actions {
  display: flex;
  gap: 2px;
}
.cat-new {
  border: 2px dashed var(--border);
  border-top: 2px dashed var(--border);
  background: transparent;
  box-shadow: none;
  display: grid;
  place-items: center;
  align-content: center;
  color: var(--muted);
  font-weight: 700;
  min-height: 140px;
}
.cat-new span {
  font-size: 2rem;
}
.cat-new:hover {
  border-color: var(--accent);
  color: var(--accent);
}

/* ---------- Configurações ---------- */
.settings {
  display: grid;
  gap: 18px;
  max-width: 820px;
  width: 100%;
  margin: 0 auto;
}
.settings .card > h3 {
  margin-bottom: 10px;
}
.settings .field {
  margin: 10px 0;
}
.accent-list {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.accent-opt {
  width: 42px;
  height: 42px;
  border-radius: 12px;
  border: 3px solid transparent;
  color: #fff;
  font-weight: 800;
  transition: transform 0.2s var(--bounce);
}
.accent-opt:hover:not(:disabled) {
  transform: scale(1.1) rotate(-4deg);
}
.accent-opt.active {
  border-color: var(--surface);
  box-shadow: 0 0 0 2px var(--accent);
}
.accent-opt:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  font-size: 0.9rem;
}

/* ---------- Confete ---------- */
.confetti {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 300;
  display: none;
}

/* ---------- Animações ---------- */
@keyframes view-in {
  from {
    opacity: 0;
    transform: translateY(10px);
  }
}
@keyframes item-in {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
}
@keyframes pop-in {
  from {
    opacity: 0;
    transform: scale(0.6);
  }
}
@keyframes float {
  0%,
  100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-6px);
  }
}
@keyframes jump {
  0%,
  100% {
    transform: translateY(0) scale(1);
  }
  40% {
    transform: translateY(-14px) scale(1.05, 0.95);
  }
}
@keyframes wiggle {
  0%,
  60%,
  100% {
    transform: rotate(0);
  }
  10%,
  30% {
    transform: rotate(14deg);
  }
  20%,
  40% {
    transform: rotate(-8deg);
  }
}
@keyframes bump {
  50% {
    transform: scale(1.03);
  }
}
@keyframes pulse-soft {
  0%,
  100% {
    opacity: 1;
  }
  50% {
    opacity: 0.7;
  }
}
@keyframes pulse-ring {
  0% {
    box-shadow: 0 0 0 4px var(--surface), 0 0 0 4px var(--accent-soft);
  }
  70% {
    box-shadow: 0 0 0 4px var(--surface), 0 0 0 14px transparent;
  }
  100% {
    box-shadow: 0 0 0 4px var(--surface), 0 0 0 4px transparent;
  }
}
@keyframes flame {
  0%,
  100% {
    transform: scale(1) rotate(-3deg);
  }
  50% {
    transform: scale(1.12) rotate(3deg);
  }
}
@keyframes shine {
  60%,
  100% {
    transform: translateX(100%);
  }
}
@keyframes breathe {
  0%,
  100% {
    transform: rotate(-90deg) scale(1);
  }
  50% {
    transform: rotate(-90deg) scale(1.015);
  }
}
@keyframes levelup {
  0% {
    transform: scale(0) rotate(-180deg);
  }
  100% {
    transform: scale(1) rotate(0);
  }
}

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.001ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.001ms !important;
    scroll-behavior: auto !important;
  }
}

  <script>
/* =========================================================
   TaskUp — utils.js
   Funções utilitárias, datas, eventos e helpers de DOM.
   ========================================================= */
(function () {
  'use strict';

  const TU = (window.TU = window.TU || {});

  const pad = (n) => String(n).padStart(2, '0');

  const U = {
    pad,

    uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    },

    /* ---------- Datas ---------- */
    dateKey(d = new Date()) {
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    },
    today() {
      return U.dateKey(new Date());
    },
    parseDateKey(key) {
      const [y, m, d] = key.split('-').map(Number);
      return new Date(y, m - 1, d);
    },
    addDays(key, n) {
      const d = U.parseDateKey(key);
      d.setDate(d.getDate() + n);
      return U.dateKey(d);
    },
    /** Soma meses. anchorDay mantém o dia original (ex.: 31) sem "escorregar" mês a mês. */
    addMonths(key, n, anchorDay) {
      const d = U.parseDateKey(key);
      const day = anchorDay || d.getDate();
      d.setDate(1);
      d.setMonth(d.getMonth() + n);
      const last = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
      d.setDate(Math.min(day, last));
      return U.dateKey(d);
    },
    diffDays(a, b) {
      // b - a em dias
      return Math.round((U.parseDateKey(b) - U.parseDateKey(a)) / 86400000);
    },
    weekStart(key) {
      const d = U.parseDateKey(key);
      const dow = (d.getDay() + 6) % 7; // segunda = 0
      d.setDate(d.getDate() - dow);
      return U.dateKey(d);
    },
    timeToMinutes(t) {
      if (!t) return null;
      const [h, m] = t.split(':').map(Number);
      return h * 60 + m;
    },
    minutesToTime(min) {
      min = Math.max(0, Math.min(23 * 60 + 59, Math.round(min)));
      return `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
    },
    nowMinutes() {
      const d = new Date();
      return d.getHours() * 60 + d.getMinutes();
    },
    nowTime() {
      return U.minutesToTime(U.nowMinutes());
    },
    nextRoundHour() {
      const d = new Date();
      return U.minutesToTime(Math.min(23 * 60, (d.getHours() + 1) * 60));
    },
    /** Data/hora de vencimento de uma tarefa (ou null) */
    dueDate(task) {
      if (!task.date) return null;
      const d = U.parseDateKey(task.date);
      if (task.time) {
        const [h, m] = task.time.split(':').map(Number);
        d.setHours(h, m, 0, 0);
      } else {
        d.setHours(23, 59, 59, 999);
      }
      return d;
    },
    WEEKDAYS: ['domingo', 'segunda', 'terça', 'quarta', 'quinta', 'sexta', 'sábado'],
    WEEKDAYS_SHORT: ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'],
    MONTHS: ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'],
    MONTHS_SHORT: ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'],

    formatDateHuman(key) {
      if (!key) return 'Sem data';
      const t = U.today();
      const diff = U.diffDays(t, key);
      if (diff === 0) return 'Hoje';
      if (diff === 1) return 'Amanhã';
      if (diff === -1) return 'Ontem';
      const d = U.parseDateKey(key);
      const base = `${U.WEEKDAYS_SHORT[d.getDay()]}, ${d.getDate()} ${U.MONTHS_SHORT[d.getMonth()]}`;
      return d.getFullYear() !== new Date().getFullYear() ? `${base} ${d.getFullYear()}` : base;
    },
    formatDateLong(key) {
      const d = U.parseDateKey(key);
      return `${U.WEEKDAYS[d.getDay()]}, ${d.getDate()} de ${U.MONTHS[d.getMonth()]}`;
    },
    formatDuration(min) {
      if (!min) return '';
      if (min < 60) return `${min} min`;
      const h = Math.floor(min / 60);
      const m = min % 60;
      return m ? `${h}h${pad(m)}` : `${h}h`;
    },

    greeting(date = new Date()) {
      const h = date.getHours();
      if (h >= 5 && h < 12) return { text: 'Bom dia', emoji: '☀️' };
      if (h >= 12 && h < 18) return { text: 'Boa tarde', emoji: '🌤️' };

/* =========================================================
   TaskUp — crypto.js
   Criptografia local com a Web Crypto API nativa do navegador.
   - Chave: PBKDF2-SHA256 (310.000 iterações, sal aleatório de 16 bytes)
   - Cifra: AES-256-GCM (IV aleatório de 12 bytes a cada gravação;
     o GCM também detecta qualquer alteração nos dados cifrados)
   A senha nunca é armazenada; a chave fica só na memória
   enquanto o app está desbloqueado e não pode ser exportada.
   ========================================================= */
(function () {
  'use strict';

  const subtle = window.crypto && window.crypto.subtle;
  const ITERATIONS = 310000;
  const enc = new TextEncoder();
  const dec = new TextDecoder();

  function toB64(buf) {
    const bytes = new Uint8Array(buf);
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  function fromB64(str) {
    const bin = atob(str);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  const random = (n) => window.crypto.getRandomValues(new Uint8Array(n));

  const Crypto = {
    ITERATIONS,
    /** Disponível apenas em contexto seguro (https, localhost ou arquivo local). */
    available: !!(subtle && window.crypto.getRandomValues),

    isEnvelope(obj) {
      return !!(obj && typeof obj === 'object' && obj.taskup === 'enc' && typeof obj.data === 'string' && typeof obj.iv === 'string' && typeof obj.salt === 'string');
    },

    newSalt() {
      return toB64(random(16));
    },

    /** Deriva a chave AES a partir da senha (lento de propósito: dificulta força bruta). */
    async deriveKey(password, saltB64, iterations = ITERATIONS) {
      const base = await subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return subtle.deriveKey(
        { name: 'PBKDF2', salt: fromB64(saltB64), iterations, hash: 'SHA-256' },
        base,
        { name: 'AES-GCM', length: 256 },
        false, // não exportável
        ['encrypt', 'decrypt']
      );
    },

    /** Cifra um texto com uma chave já derivada. */
    async encrypt(vault, plaintext, kind = 'data') {
      const iv = random(12);
      const data = await subtle.encrypt({ name: 'AES-GCM', iv }, vault.key, enc.encode(plaintext));
      return { taskup: 'enc', v: 1, kind, alg: 'AES-256-GCM', kdf: 'PBKDF2-SHA256', iter: vault.iter, salt: vault.salt, iv: toB64(iv), data: toB64(data) };
    },

    /** Decifra. Lança erro se a chave estiver errada ou os dados tiverem sido alterados. */
    async decrypt(key, envelope) {
      const plain = await subtle.decrypt({ name: 'AES-GCM', iv: fromB64(envelope.iv) }, key, fromB64(envelope.data));
      return dec.decode(plain);
    },

    async encryptWithPassword(password, plaintext, kind = 'backup') {
      const salt = Crypto.newSalt();
      const key = await Crypto.deriveKey(password, salt, ITERATIONS);
      return Crypto.encrypt({ key, salt, iter: ITERATIONS }, plaintext, kind);
    },

    async decryptWithPassword(password, envelope) {
      const iter = Number.isInteger(envelope.iter) && envelope.iter >= 10000 && envelope.iter <= 5000000 ? envelope.iter : ITERATIONS;
      const key = await Crypto.deriveKey(password, envelope.salt, iter);
      return { text: await Crypto.decrypt(key, envelope), vault: { key, salt: envelope.salt, iter } };
    },

    /** Avaliação simples da força da senha (0 a 4). */
    strength(pw) {
      let score = 0;
      if (pw.length >= 8) score++;
      if (pw.length >= 12) score++;
      if (/[a-z]/.test(pw) && /[A-Z]/.test(pw)) score++;
      if (/\d/.test(pw)) score++;
      if (/[^A-Za-z0-9]/.test(pw)) score++;
      if (/^(.)\1+$/.test(pw) || /^(123456|senha|password|qwerty|abcdef)/i.test(pw)) score = 0;
      return Math.min(4, score);
    },
  };

  window.TU = window.TU || {};
  window.TU.Crypto = Crypto;
})();

      long: 15,
      longEvery: 4,
      autoStartBreaks: false,
      autoStartFocus: false,

    lastBackupNag: null,

  function defaultState() {
    return {
      app: 'TaskUp',
      version: VERSION,
      createdAt: new Date().toISOString(),
      settings: JSON.parse(JSON.stringify(DEFAULT_SETTINGS)),
      categories: DEFAULT_CATEGORIES.map((c) => ({ ...c })),
      tasks: [],
      game: {
        xp: 0,
        coins: 0,
        streak: 0,
        bestStreak: 0,
        lastActiveDate: null,
        totalCompleted: 0,
        totalPomodoros: 0,
        focusMinutes: 0,
        xpByDate: {},
        completedByDate: {},
        pomodorosByDate: {},
        focusByDate: {},
        achievements: {},
        missions: { date: null, list: [] },
        weekly: { week: null, claimed: false },
        unlocked: { accents: ['violeta'], mascots: ['🐣'], backgrounds: ['none'], effects: ['classic'], sounds: ['classic'], titles: ['none'] },
        inventory: { freeze: 0 },
        boostUntil: 0,
        frozenDays: {},
      },
      pomodoro: {

        running: false,
        endAt: null,

  /* ---------- Sanitização (dados importados/corrompidos) ---------- */
  const RE_DATE = /^\d{4}-\d{2}-\d{2}$/;

  const RE_ID = /^[\w-]{1,64}$/;

  const RE_COLOR = /^#[0-9a-f]{3,8}$/i;
  const PRIOS = ['low', 'medium', 'high'];

  const str = (v, max = 500) => (typeof v === 'string' ? v : v == null ? '' : String(v)).slice(0, max);
  /** Emoji: texto curto sem caracteres de marcação. */

    if (!RECS.includes(t.recurrence)) t.recurrence = 'none';
    t.date = typeof t.date === 'string' && RE_DATE.test(t.date) ? t.date : null;
    t.time = typeof t.time === 'string' && RE_TIME.test(t.time) ? t.time : null;
    t.duration = num(t.duration, 30, 0, 1440);
    t.reminder = t.reminder === null || t.reminder === undefined || t.reminder === '' ? null : num(t.reminder, null, 0, 10080);

    t.createdAt = isoOrNull(t.createdAt) || new Date().toISOString();

    t.xpAwarded = num(t.xpAwarded, 0, 0, 1e4);

  let state = null;

    load() {

      s.tasks = s.tasks.filter((t) => t && typeof t === 'object').map(normalizeTask);

      s.tasks.forEach((t) => {
        if (seen.has(t.id)) t.id = U.uid();
        seen.add(t.id);

      if (!s.categories.some((c) => c.id === 'cat-outros')) {
        s.categories.push({ ...DEFAULT_CATEGORIES[DEFAULT_CATEGORIES.length - 1] });

      const st = s.settings;
      if (!['auto', 'light', 'dark'].includes(st.theme)) st.theme = 'auto';
      st.name = str(st.name, 40);
      if (!RE_TIME.test(st.dailySummaryTime)) st.dailySummaryTime = '08:00';
      st.volume = num(st.volume, 0.6, 0, 1);
      ['focus', 'short', 'long', 'longEvery'].forEach((k) => (st.pomodoro[k] = num(st.pomodoro[k], DEFAULT_SETTINGS.pomodoro[k], 1, 180)));
      const g = s.game;
      ['xp', 'streak', 'bestStreak', 'totalCompleted', 'totalPomodoros', 'focusMinutes'].forEach((k) => (g[k] = num(g[k], 0, 0, 1e9)));
      g.coins = num(g.coins, 0, -1e6, 1e9);
      if (window.TU.Shop) window.TU.Shop.validate(s);
      if (g.lastActiveDate && !RE_DATE.test(g.lastActiveDate)) g.lastActiveDate = null;
      ['xpByDate', 'completedByDate', 'pomodorosByDate', 'focusByDate', 'achievements', 'notified'].forEach((k) => {
        const o = k === 'notified' ? s : g;
        if (!o[k] || typeof o[k] !== 'object' || Array.isArray(o[k])) o[k] = {};

    get storageOk() {

    saveNow() {

      try {
        const json = JSON.stringify(state);

    replace(newState) {
      state = Store.hydrate(newState);
      Store.saveNow();

    reset() {
      state = defaultState();

  // Salva imediatamente ao sair / esconder a página (só se houver algo pendente,
  // para uma aba antiga não sobrescrever dados mais novos de outra aba)
  window.addEventListener('pagehide', () => state && dirty && Store.saveNow());
  window.addEventListener('beforeunload', () => state && dirty && Store.saveNow());
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && state && dirty) Store.saveNow();
  });
  // Outra aba (ou o app instalado) alterou os dados: recarrega
  window.addEventListener('storage', (e) => {
    if (e.key !== KEY || !e.newValue || !state) return;
    try {
      state = Store.hydrate(JSON.parse(e.newValue));
      dirty = false;
      Bus.emit('change', state);
      Bus.emit('theme');
    } catch (_) {}
  });

  window.TU.Store = Store;
})();

  <script>
/* =========================================================
   TaskUp — ui.js
   Componentes de interface: toasts, modais, confirmação,
   confete e sons sintetizados (Web Audio API — sem arquivos).
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus } = window.TU;

  /* ---------------- Toasts ---------------- */
  function toast(text, opts = {}) {
    const root = document.getElementById('toast-root');
    if (!root) return;
    const { type = 'info', icon, action, duration = 3500 } = opts;
    const icons = { info: '💬', success: '✅', error: '⚠️', xp: '⭐', achievement: '🏆' };
    const el = document.createElement('div');
    el.className = `toast toast-${type}`;
    el.setAttribute('role', 'status');
    el.innerHTML = `
      <span class="toast-icon">${icon || icons[type] || '💬'}</span>
      <span class="toast-text">${U.escape(text)}</span>
      ${action ? `<button class="toast-action">${U.escape(action.label)}</button>` : ''}
      <button class="toast-close" aria-label="Fechar">×</button>`;
    root.appendChild(el);
    requestAnimationFrame(() => el.classList.add('show'));
    let timer;
    const close = () => {
      clearTimeout(timer);
      el.classList.remove('show');
      el.classList.add('hide');
      setTimeout(() => el.remove(), 300);
    };
    timer = setTimeout(close, duration);
    el.querySelector('.toast-close').onclick = close;
    if (action) {
      el.querySelector('.toast-action').onclick = () => {
        action.fn();
        close();
      };
    }
    // limita a quantidade de toasts visíveis
    const all = root.querySelectorAll('.toast:not(.hide)');
    if (all.length > 4) all[0].querySelector('.toast-close').click();
    return close;
  }
  Bus.on('toast', (p) => toast(p.text, p));

  /* ---------------- Modais ---------------- */
  const stack = [];

  function modal({ title = '', body = '', size = 'md', onMount, onClose, footer = '', className = '' } = {}) {
    const root = document.getElementById('modal-root');
    const wrap = document.createElement('div');
    wrap.className = 'modal-backdrop';
    wrap.innerHTML = `
      <div class="modal modal-${size} ${className}" role="dialog" aria-modal="true" aria-label="${U.escape(title)}">
        ${title ? `<header class="modal-header"><h2>${title}</h2><button class="icon-btn modal-x" aria-label="Fechar">✕</button></header>` : ''}
        <div class="modal-body">${body}</div>
        ${footer ? `<footer class="modal-footer">${footer}</footer>` : ''}
      </div>`;
    root.appendChild(wrap);
    document.body.classList.add('no-scroll');
    requestAnimationFrame(() => wrap.classList.add('show'));

    let closed = false;
    const api = {
      el: wrap.querySelector('.modal'),
      close(result) {
        if (closed) return;
        closed = true;
        // bloqueia novos cliques/Enter durante a animação de saída (evita envio duplo)
        wrap.classList.add('closing');
        wrap.inert = true;
        wrap.classList.remove('show');
        const i = stack.indexOf(api);
        if (i >= 0) stack.splice(i, 1);
        if (!stack.length) document.body.classList.remove('no-scroll');
        setTimeout(() => wrap.remove(), 200);
        onClose && onClose(result);
      },
    };
    stack.push(api);
    wrap.addEventListener('mousedown', (e) => {
      if (e.target === wrap) api.close();
    });
    const x = wrap.querySelector('.modal-x');
    if (x) x.onclick = () => api.close();
    onMount && onMount(api.el, api);
    // foco no primeiro campo
    setTimeout(() => {
      const f = api.el.querySelector('[autofocus], input:not([type=hidden]):not([type=checkbox]):not([type=radio]), textarea, select, button.btn-primary');
      f && f.focus({ preventScroll: true });
    }, 50);
    return api;
  }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && stack.length) {
      stack[stack.length - 1].close();
    }
  });

  function confirm({ title = 'Tem certeza?', text = '', okText = 'Confirmar', cancelText = 'Cancelar', danger = false, icon = '🤔' } = {}) {
    return new Promise((resolve) => {
      let answered = false;
      modal({
        size: 'sm',
        className: 'modal-confirm',
        body: `
          <div class="confirm-icon">${icon}</div>
          <h3>${U.escape(title)}</h3>
          ${text ? `<p class="muted">${text}</p>` : ''}
          <div class="confirm-actions">
            <button class="btn btn-ghost" data-r="0">${U.escape(cancelText)}</button>
            <button class="btn ${danger ? 'btn-danger' : 'btn-primary'}" data-r="1">${U.escape(okText)}</button>
          </div>`,
        onMount(el, api) {
          el.querySelectorAll('[data-r]').forEach((b) =>
            b.addEventListener('click', () => {
              answered = true;
              api.close();
              resolve(b.dataset.r === '1');
            })
          );
        },
        onClose() {
          if (!answered) resolve(false);
        },
      });
    });
  }

  /* ---------------- Confete ---------------- */
  let confettiParts = [];
  let confettiRAF = null;

  /** Símbolos de cada efeito de comemoração (loja). "classic" = papel picado. */
  const EFFECTS = {
    classic: null,
    hearts: ['❤️', '💖', '💕', '💗', '💜'],
    stars: ['⭐', '✨', '🌟', '💫'],
    fruits: ['🍓', '🍉', '🍍', '🍒', '🍋', '🥝'],
    snow: ['❄️', '❄️', '☃️', '🌨️'],
    party: ['🎉', '🎊', '🥳', '🎈', '🪅'],
    space: ['🚀', '🪐', '⭐', '👽', '🌙'],
    money: ['💸', '💰', '🪙', '💵'],
  };

  function confetti({ count = 120, origin = null, effect = null } = {}) {
    const st = window.TU.Store && window.TU.Store.state;
    const symbols = EFFECTS[effect || (st && st.settings.effect)] || null;
    if (symbols) count = Math.round(count * 0.6); // emojis são maiores
    const canvas = document.getElementById('confetti');
    if (!canvas) return;
    if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) count = Math.min(count, 25);
    const ctx = canvas.getContext('2d');
    const dpr = window.devicePixelRatio || 1;
    canvas.width = innerWidth * dpr;
    canvas.height = innerHeight * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const colors = ['#7c5cff', '#22d3ee', '#f472b6', '#facc15', '#34d399', '#fb923c'];
    const ox = origin ? origin.x : innerWidth / 2;
    const oy = origin ? origin.y : innerHeight / 3;
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 4 + Math.random() * 8;
      confettiParts.push({
        x: ox,
        y: oy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed - 6,
        size: 5 + Math.random() * 6,
        color: U.pick(colors),
        rot: Math.random() * 360,
        vr: (Math.random() - 0.5) * 20,
        life: 0,
        shape: symbols ? 'emoji' : Math.random() > 0.5 ? 'rect' : 'circle',
        emoji: symbols ? U.pick(symbols) : null,
      });
    }
    canvas.style.display = 'block';
    if (!confettiRAF) loop();

    function loop() {
      ctx.clearRect(0, 0, innerWidth, innerHeight);
      confettiParts.forEach((p) => {
        p.vy += 0.25;
        p.vx *= 0.99;
        p.x += p.vx;
        p.y += p.vy;
        p.rot += p.vr;
        p.life++;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate((p.rot * Math.PI) / 180);
        ctx.globalAlpha = Math.max(0, 1 - p.life / 160);
        ctx.fillStyle = p.color;
        if (p.shape === 'emoji') {
          ctx.font = `${Math.round(p.size * 2.4)}px system-ui, 'Apple Color Emoji', 'Segoe UI Emoji', 'Noto Color Emoji', sans-serif`;
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(p.emoji, 0, 0);
        } else if (p.shape === 'rect') ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
        else {
          ctx.beginPath();
          ctx.arc(0, 0, p.size / 3, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
      confettiParts = confettiParts.filter((p) => p.life < 160 && p.y < innerHeight + 40);
      if (confettiParts.length) confettiRAF = requestAnimationFrame(loop);
      else {
        confettiRAF = null;
        ctx.clearRect(0, 0, innerWidth, innerHeight);
        canvas.style.display = 'none';
      }
    }
  }

  /* ---------------- Sons (Web Audio API) ---------------- */
  let audioCtx = null;
  function ctx() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      audioCtx = new AC();
    }
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  function tone(ac, freq, start, dur, { type = 'sine', vol = 0.3 } = {}) {
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, ac.currentTime + start);
    g.gain.setValueAtTime(0.0001, ac.currentTime + start);
    g.gain.exponentialRampToValueAtTime(vol, ac.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime + start + dur);
    o.connect(g).connect(ac.destination);
    o.start(ac.currentTime + start);
    o.stop(ac.currentTime + start + dur + 0.05);
  }

  const SOUNDS = {
    click: [[880, 0, 0.06, 'triangle']],
    complete: [
      [523.25, 0, 0.12, 'triangle'],
      [783.99, 0.08, 0.2, 'triangle'],
    ],
    undo: [
      [600, 0, 0.1, 'sine'],
      [400, 0.07, 0.15, 'sine'],
    ],
    levelup: [
      [523.25, 0, 0.15, 'square'],
      [659.25, 0.12, 0.15, 'square'],
      [783.99, 0.24, 0.15, 'square'],
      [1046.5, 0.36, 0.4, 'square'],
    ],
    achievement: [
      [659.25, 0, 0.12, 'triangle'],
      [880, 0.1, 0.12, 'triangle'],
      [1318.5, 0.2, 0.35, 'triangle'],
    ],
    pomodoro: [
      [880, 0, 0.25, 'sine'],
      [880, 0.35, 0.25, 'sine'],
      [1174.66, 0.7, 0.5, 'sine'],
    ],
    reminder: [
      [740, 0, 0.18, 'sine'],
      [988, 0.2, 0.3, 'sine'],
    ],
    coin: [
      [987.77, 0, 0.08, 'square'],
      [1318.5, 0.07, 0.25, 'square'],
    ],
  };

  /** Pacotes de som de conclusão (loja): [frequência, início, duração, onda] */
  const PACKS = {
    classic: SOUNDS.complete,
    pop: [
      [880, 0, 0.05, 'sine'],
      [1320, 0.05, 0.08, 'sine'],
    ],
    bell: [
      [1046.5, 0, 0.5, 'sine'],
      [1568, 0, 0.35, 'sine'],
      [2093, 0.02, 0.25, 'sine'],
    ],
    retro: [
      [523.25, 0, 0.07, 'square'],
      [659.25, 0.07, 0.07, 'square'],
      [783.99, 0.14, 0.07, 'square'],
      [1046.5, 0.21, 0.15, 'square'],
    ],
    xylo: [
      [783.99, 0, 0.18, 'triangle'],
      [987.77, 0.09, 0.18, 'triangle'],
      [1174.66, 0.18, 0.3, 'triangle'],
    ],
    harp: [
      [523.25, 0, 0.4, 'sine'],
      [659.25, 0.06, 0.4, 'sine'],
      [783.99, 0.12, 0.4, 'sine'],
      [1046.5, 0.18, 0.4, 'sine'],
      [1318.5, 0.24, 0.5, 'sine'],
    ],
    fanfare: [
      [392, 0, 0.12, 'sawtooth'],
      [392, 0.13, 0.12, 'sawtooth'],
      [392, 0.26, 0.12, 'sawtooth'],
      [523.25, 0.4, 0.45, 'sawtooth'],
    ],
  };

  const Sound = {
    PACKS,
    play(name, force = false, pack = null) {
      const s = window.TU.Store && window.TU.Store.state;
      if (!force && s && !s.settings.sounds) return;
      const ac = ctx();
      if (!ac) return;
      const vol = (s ? s.settings.volume : 0.6) * 0.35;
      let seq = SOUNDS[name] || SOUNDS.click;
      if (name === 'complete') seq = PACKS[pack || (s && s.settings.soundPack)] || SOUNDS.complete;
      const loud = ['levelup', 'coin'].includes(name) || (name === 'complete' && ['retro', 'fanfare'].includes(pack || (s && s.settings.soundPack)));
      const v = loud ? vol * 0.5 : vol;
      seq.forEach(([f, st, d, type]) => tone(ac, f, st, d, { type, vol: Math.max(0.0002, v) }));
    },
  };

  // desbloqueia o AudioContext na primeira interação (políticas de autoplay)
  const unlock = () => {
    ctx();
    window.removeEventListener('pointerdown', unlock);
  };
  window.addEventListener('pointerdown', unlock);

  /* ---------------- Helpers de formulário ---------------- */
  function formData(form) {
    const data = {};
    new FormData(form).forEach((v, k) => (data[k] = typeof v === 'string' ? v.trim() : v));
    return data;
  }

  function emojiPicker(current, name = 'emoji') {
    return `
      <div class="emoji-picker" data-name="${name}">
        <input type="hidden" name="${name}" value="${U.escape(current || '')}">
        <button type="button" class="emoji-current" aria-label="Escolher emoji">${U.escape(current) || '➕'}</button>

      </div>`;
  }

  function bindEmojiPicker(root) {
    root.querySelectorAll('.emoji-picker').forEach((p) => {
      const cur = p.querySelector('.emoji-current');
      const grid = p.querySelector('.emoji-grid');
      const input = p.querySelector('input');
      cur.addEventListener('click', () => (grid.hidden = !grid.hidden));
      grid.addEventListener('click', (e) => {
        const b = e.target.closest('.emoji-opt');
        if (!b) return;
        input.value = b.dataset.emoji;
        cur.textContent = b.dataset.emoji || '➕';
        grid.hidden = true;
      });
    });
  }

  // fecha seletores de emoji abertos ao clicar fora deles
  document.addEventListener('mousedown', (e) => {
    document.querySelectorAll('.emoji-picker .emoji-grid:not([hidden])').forEach((g) => {
      if (!g.parentElement.contains(e.target)) g.hidden = true;
    });
  });

  function colorPicker(current, name = 'color') {
    return `
      <div class="color-picker">
        ${U.COLORS.map(
          (c) => `<label class="color-opt" style="--c:${c}">
            <input type="radio" name="${name}" value="${c}" ${c === current ? 'checked' : ''}><span></span></label>`
        ).join('')}
        <label class="color-opt color-custom" title="Cor personalizada">
          <input type="color" name="${name}-custom" value="${/^#[0-9a-f]{6}$/i.test(current || '') ? current : '#7c5cff'}">
        </label>
      </div>`;
  }

  window.TU.UI = { EFFECTS, toast, modal, confirm, confetti, formData, emojiPicker, bindEmojiPicker, colorPicker };
  window.TU.Sound = Sound;
})();
