    sound: { label: '🔔 Sons', items: SOUNDS, unlock: 'sounds', setting: 'soundPack', def: 'classic' },
    title: { label: '🏷️ Títulos', items: TITLES, unlock: 'titles', setting: 'title', def: 'none' },
  };

  const g = () => Store.state.game;
  const coins = () => Math.max(0, g().coins);

  const Shop = {
    ACCENTS,
    MASCOTS,
    BACKGROUNDS,
    EFFECTS,
    SOUNDS,
    TITLES,
    POWERUPS,
    KINDS,
    tab: 'accent',

    owned(kind, key) {
      return (g().unlocked[KINDS[kind].unlock] || []).includes(key);
    },

    equipped(kind) {
      return Store.state.settings[KINDS[kind].setting];
    },

    /** Quantos cosméticos o usuário possui (sem contar os gratuitos). */
    collectionSize() {
      return Object.values(KINDS).reduce((n, k) => n + Math.max(0, (g().unlocked[k.unlock] || []).length - 1), 0);
    },

    titleText() {
      const t = TITLES[Store.state.settings.title];
      return t && Store.state.settings.title !== 'none' ? t.name : '';
    },

    boostActive() {
      return Date.now() < (g().boostUntil || 0);
    },

    /** Valida itens/configurações (usado ao carregar e importar dados). */
    validate(s) {
      const game = s.game;
      game.unlocked = game.unlocked && typeof game.unlocked === 'object' ? game.unlocked : {};
      Object.values(KINDS).forEach((k) => {
        const list = Array.isArray(game.unlocked[k.unlock]) ? game.unlocked[k.unlock] : [];
        game.unlocked[k.unlock] = [...new Set(list.filter((x) => typeof x === 'string' && k.items[x]))];
        if (!game.unlocked[k.unlock].includes(k.def)) game.unlocked[k.unlock].unshift(k.def);
        if (!k.items[s.settings[k.setting]] || !game.unlocked[k.unlock].includes(s.settings[k.setting])) s.settings[k.setting] = k.def;
      });
      game.inventory = game.inventory && typeof game.inventory === 'object' ? game.inventory : {};
      const f = +game.inventory.freeze;
      game.inventory.freeze = Number.isFinite(f) ? Math.max(0, Math.min(POWERUPS.freeze.max, Math.floor(f))) : 0;
      game.boostUntil = Number.isFinite(+game.boostUntil) ? +game.boostUntil : 0;
      if (!game.frozenDays || typeof game.frozenDays !== 'object' || Array.isArray(game.frozenDays)) game.frozenDays = {};
    },

    canPay(price) {
      if (g().coins >= price) return true;
      UI.toast(`Faltam ${price - coins()} moedas para esse item.`, { type: 'error', icon: '🪙' });
      return false;
    },

    buy(kind, key) {
      const k = KINDS[kind];
      const item = k && k.items[key];
      if (!item || Shop.owned(kind, key) || !Shop.canPay(item.price)) return;
      Store.update((s) => {
        s.game.coins -= item.price;
        s.game.unlocked[k.unlock].push(key);
        s.settings[k.setting] = key;
      });
      Sound.play('coin');
      Game().celebrate({});
      UI.toast(`${item.name} desbloqueado e equipado!`, { type: 'success', icon: kind === 'mascot' ? key : '🛍️' });
      Game().checkAchievements();
      Bus.emit('theme');
    },

    equip(kind, key) {
      const k = KINDS[kind];
      if (!k || !k.items[key] || !Shop.owned(kind, key)) return;
      Store.update((s) => (s.settings[k.setting] = key));
      Bus.emit('theme');
      if (kind === 'sound') Sound.play('complete');
      if (kind === 'effect') Game().celebrate({});
    },

    preview(kind, key) {
      if (kind === 'sound') Sound.play('complete', true, key);
      if (kind === 'effect') UI.confetti({ count: 60, effect: key });
    },

    /* ---------- Poderes ---------- */
    buyPowerup(key) {
      const p = POWERUPS[key];
      if (!p) return;
      if (key === 'freeze' && (g().inventory.freeze || 0) >= p.max) {
        UI.toast(`Você já tem o máximo de ${p.max} congeladores.`, { icon: '🧊' });
        return;
      }
      if (key === 'mystery' && !Shop.mysteryPool().length) {
        UI.toast('Você já tem todos os itens! 🏆 Não há nada novo na caixa.', { icon: '🎁' });
        return;
      }
      if (key === 'reroll' && !g().missions.list.some((m) => !m.claimed)) {
        UI.toast('Todas as missões de hoje já foram resgatadas.', { icon: '🔄' });
        return;
      }
      if (!Shop.canPay(p.price)) return;
      Store.update((s) => (s.game.coins -= p.price));
      Sound.play('coin');
      if (key === 'freeze') {
        Store.update((s) => (s.game.inventory.freeze = (s.game.inventory.freeze || 0) + 1));
        UI.toast(`Congelador guardado! Você tem ${g().inventory.freeze}.`, { type: 'success', icon: '🧊' });
      } else if (key === 'boost') {
        Store.update((s) => (s.game.boostUntil = Math.max(Date.now(), s.game.boostUntil || 0) + 3600000));
        UI.toast(`XP em dobro ativo até ${new Date(g().boostUntil).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}!`, { type: 'xp', icon: '⚡' });
        Game().celebrate({});
      } else if (key === 'mystery') {
        Shop.openMystery();
      } else if (key === 'reroll') {
        Game().rerollMissions();
        UI.toast('Novas missões sorteadas!', { type: 'success', icon: '🔄' });
      }
      Bus.emit('game');
    },

    mysteryPool() {
      const pool = [];
      Object.entries(KINDS).forEach(([kind, k]) =>
        Object.keys(k.items).forEach((key) => {
          if (!Shop.owned(kind, key) && k.items[key].price > 0) pool.push([kind, key]);
        })
      );
      return pool;
    },

    openMystery() {
      const pool = Shop.mysteryPool();
      const [kind, key] = U.pick(pool);
      const k = KINDS[kind];
      const item = k.items[key];
      Store.update((s) => s.game.unlocked[k.unlock].push(key));
      Sound.play('achievement');
      Game().celebrate({ big: true });
      Game().checkAchievements();
      UI.modal({
        size: 'sm',
        className: 'modal-levelup',
        body: `
          <div class="levelup">
            <div class="levelup-badge mystery">${Shop.thumb(kind, key, true)}</div>
            <p class="levelup-kicker">Caixa surpresa!</p>
            <h2>${U.escape(item.name)}</h2>
            <p class="muted">${k.label} · vale 🪙 ${item.price}</p>
            <div class="row gap" style="justify-content:center">
              <button class="btn" data-close>Guardar</button>
              <button class="btn btn-primary" data-equip>Usar agora</button>
            </div>
          </div>`,
        onMount(el, api) {
          el.querySelector('[data-close]').onclick = () => api.close();
          el.querySelector('[data-equip]').onclick = () => {
            api.close();
            Shop.equip(kind, key);
          };
        },
      });
    },

    /** Usa congeladores para cobrir dias perdidos (chamado na abertura e na virada do dia). */
    applyFreezes() {
      const game = g();
      if (!game.lastActiveDate || !game.streak || !Store.state.settings.gamification) return;
      const missed = U.diffDays(game.lastActiveDate, U.today()) - 1;
      const inv = game.inventory.freeze || 0;
      if (missed <= 0 || inv < missed) return;
      Store.update((s) => {
        for (let i = 1; i <= missed; i++) s.game.frozenDays[U.addDays(game.lastActiveDate, i)] = 1;
        s.game.inventory.freeze -= missed;
        s.game.lastActiveDate = U.addDays(U.today(), -1);
      }, { silent: true });
      setTimeout(() => UI.toast(`🧊 ${missed > 1 ? missed + ' congeladores usados' : 'Congelador usado'}: sua sequência de ${game.streak} dias está salva!`, { type: 'success', icon: '🧊', duration: 7000 }), 1200);
    },

    /* ---------- Renderização ---------- */
    thumb(kind, key, big = false) {
      const item = KINDS[kind].items[key];
      switch (kind) {
        case 'accent':
          return `<div class="swatch ${item.rainbow ? 'rainbow' : ''}" style="background:linear-gradient(135deg, ${item.color}, ${item.color2})"></div>`;
        case 'background':
          return `<div class="bg-preview" data-bg="${key}"></div>`;
        case 'mascot':
          return `<div class="mascot-big">${key}</div>`;
        case 'effect':
          return `<div class="effect-preview">${(UI.EFFECTS[key] || ['🎊']).slice(0, 3).join('')}</div>`;
        case 'sound':
          return `<div class="mascot-big">${['🎵', '🫧', '🔔', '👾', '🎹', '🪕', '🎺'][Object.keys(SOUNDS).indexOf(key)] || '🎵'}</div>`;
        case 'title':
          return `<div class="title-preview ${big ? 'big' : ''}">${key === 'none' ? '—' : U.escape(item.name)}</div>`;
        default:
          return '';
      }
    },

    render(view) {
      if (!Store.state.settings.gamification) {
        view.innerHTML = `
          <div class="empty-state card">
            <div class="empty-emoji">🛍️</div>
            <h3>Loja desativada</h3>
            <p class="muted">A loja faz parte da gamificação, que está desligada.</p>
            <button class="btn btn-primary" data-action="enable-game">Ativar gamificação</button>
          </div>`;
        return;
      }
      view.innerHTML = Shop.html();
    },

    html() {
      const s = Store.state;
      const tab = Shop.tab;
      const tabs = [...Object.entries(KINDS).map(([k, v]) => [k, v.label]), ['powerup', '⚡ Poderes']];
      let total = 0;
      let have = 0;
      Object.values(KINDS).forEach((k) => {
        total += Object.keys(k.items).length;
        have += (s.game.unlocked[k.unlock] || []).length;
      });

      let body = '';
      if (tab === 'powerup') {
        body = `<div class="shop powerups">${Object.entries(POWERUPS)
          .map(([key, p]) => {
            const extra =
              key === 'freeze'
                ? `<span class="pill">Você tem ${s.game.inventory.freeze || 0}/${p.max}</span>`
                : key === 'boost' && Shop.boostActive()
                ? `<span class="pill pill-live">Ativo até ${new Date(s.game.boostUntil).toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' })}</span>`
                : '';
            return `<div class="shop-item powerup">
              <div class="mascot-big">${p.emoji}</div>
              <strong>${p.name}</strong>
              <p class="muted small">${p.desc}</p>
              ${extra}
              <button class="btn btn-sm btn-primary" data-action="buy-powerup" data-key="${key}" ${s.game.coins < p.price ? 'disabled' : ''}>🪙 ${p.price}</button>
            </div>`;
          })
          .join('')}</div>`;
      } else {
        const k = KINDS[tab];
        const current = s.settings[k.setting];
        body = `<div class="shop">${Object.entries(k.items)
          .map(([key, item]) => {
            const owned = Shop.owned(tab, key);
            const equipped = current === key;
            const canPreview = tab === 'sound' || tab === 'effect';
            return `<div class="shop-item ${equipped ? 'equipped' : ''} ${owned ? '' : 'locked'}">
              ${Shop.thumb(tab, key)}
              <strong>${U.escape(item.name)}</strong>
              <div class="shop-actions">
                ${canPreview ? `<button class="icon-btn sm" data-action="shop-preview" data-kind="${tab}" data-key="${U.escape(key)}" title="Experimentar">${tab === 'sound' ? '🔊' : '👀'}</button>` : ''}
                ${equipped ? '<span class="pill pill-success">Em uso</span>' : owned ? `<button class="btn btn-sm" data-action="equip" data-kind="${tab}" data-key="${U.escape(key)}">Usar</button>` : `<button class="btn btn-sm btn-primary" data-action="buy" data-kind="${tab}" data-key="${U.escape(key)}" ${s.game.coins < item.price ? 'disabled' : ''}>🪙 ${item.price}</button>`}
              </div>
            </div>`;
          })
          .join('')}</div>`;
      }

      return `
        <div class="card shop-card">
          <div class="card-head"><h3>🛍️ Loja de recompensas</h3><span class="pill">🪙 ${coins()}</span></div>
          <p class="muted small">Ganhe moedas concluindo tarefas, Pomodoros, missões e conquistas. Coleção: <strong>${have}/${total}</strong> itens.${Shop.boostActive() ? ' ⚡ XP em dobro ativo!' : ''}</p>
          <div class="chips-scroll shop-tabs">
            ${tabs.map(([k, label]) => `<button class="filter-chip ${tab === k ? 'active' : ''}" data-action="shop-tab" data-tab="${k}">${label}</button>`).join('')}
          </div>
          ${body}
        </div>`;
    },
  };

  Actions['shop-tab'] = (el) => {
    Shop.tab = el.dataset.tab;
    Bus.emit('rerender');
  };
  Actions['buy'] = (el) => Shop.buy(el.dataset.kind, el.dataset.key);
  Actions['equip'] = (el) => Shop.equip(el.dataset.kind, el.dataset.key);
  Actions['shop-preview'] = (el) => Shop.preview(el.dataset.kind, el.dataset.key);
  Actions['buy-powerup'] = (el) => Shop.buyPowerup(el.dataset.key);

  window.TU.Shop = Shop;
})();

</script>
  <script>
/* =========================================================
   TaskUp — gamification.js
   XP, níveis, sequência, conquistas, missões diárias,
   desafio semanal, moedas e loja de recompensas.
   Tudo opcional (Configurações → Gamificação).
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, UI, Sound } = window.TU;

  /* ---------- Níveis ---------- */
  // XP acumulado necessário para atingir o nível L: 50 * L * (L - 1)
  const xpForLevel = (L) => 50 * L * (L - 1);
  function levelFromXp(xp) {
    let L = 1;
    while (xp >= xpForLevel(L + 1)) L++;
    return L;
  }
  const TITLES = [
    [1, 'Iniciante', '🐣'],
    [3, 'Aprendiz', '🌱'],
    [5, 'Focado', '🎯'],
    [8, 'Produtivo', '⚡'],
    [12, 'Mestre das Tarefas', '🧠'],
    [16, 'Lenda', '🦄'],
    [20, 'Imparável', '🚀'],
    [30, 'Divindade da Produtividade', '👑'],
  ];
  function levelTitle(L) {
    let t = TITLES[0];
    for (const row of TITLES) if (L >= row[0]) t = row;
    return { title: t[1], emoji: t[2] };
  }
  function levelInfo(xp = Store.state.game.xp) {
    const level = levelFromXp(xp);
    const base = xpForLevel(level);
    const next = xpForLevel(level + 1);
    return { level, xp, current: xp - base, needed: next - base, pct: ((xp - base) / (next - base)) * 100, ...levelTitle(level) };
  }

  /* ---------- Recompensas por ação ---------- */
  const XP_TABLE = { low: 10, medium: 20, high: 35 };
  const COIN_TABLE = { low: 2, medium: 4, high: 6 };

  /* ---------- Mensagens motivacionais ---------- */
  const MOTIVATION = [
    'Vamos fazer acontecer hoje?',
    'Um passo de cada vez já é progresso! 🚶',
    'Você é mais capaz do que imagina. 💪',
    'Feito é melhor que perfeito. ✨',
    'Pequenas vitórias constroem grandes conquistas. 🏆',
    'Foco no agora, o resto a gente resolve depois. 🎯',
    'Hoje é um ótimo dia para riscar coisas da lista! ✅',
    'Respira, organiza e vai! 🌬️',
    'Sua versão do futuro vai agradecer. 🙌',
    'Disciplina é lembrar o que você quer. 🧭',
    'Comece pelo mais difícil e o resto fica leve. 🐸',
    'Bora subir de nível na vida real! 🎮',
  ];
  const CELEBRATE = ['Mandou bem! 🎉', 'Uhuul! Mais uma! 🙌', 'Arrasou! ✨', 'Isso aí! 💥', 'Tarefa esmagada! 🔨', 'Que produtividade! 🚀', 'Check! ✅', 'Show de bola! ⚽'];
  const ALL_DONE = ['Dia zerado! Você é incrível! 🏆', 'Todas as tarefas do dia concluídas! 🎊', 'Lista limpa! Hora de descansar 😎'];

  /* ---------- Conquistas ---------- */
  const ACHIEVEMENTS = [
    { id: 'first', emoji: '🌟', name: 'Primeiro passo', desc: 'Conclua sua primeira tarefa', test: (g) => g.totalCompleted >= 1 },
    { id: 'ten', emoji: '🔟', name: 'Dezena', desc: 'Conclua 10 tarefas', test: (g) => g.totalCompleted >= 10 },
    { id: 'fifty', emoji: '🥈', name: 'Meio centenário', desc: 'Conclua 50 tarefas', test: (g) => g.totalCompleted >= 50 },
    { id: 'hundred', emoji: '💯', name: 'Centena', desc: 'Conclua 100 tarefas', test: (g) => g.totalCompleted >= 100 },
    { id: 'fivehundred', emoji: '🏛️', name: 'Monumental', desc: 'Conclua 500 tarefas', test: (g) => g.totalCompleted >= 500 },
    { id: 'streak3', emoji: '🔥', name: 'Esquentando', desc: 'Sequência de 3 dias', test: (g) => g.bestStreak >= 3 },
    { id: 'streak7', emoji: '📆', name: 'Semana perfeita', desc: 'Sequência de 7 dias', test: (g) => g.bestStreak >= 7 },
    { id: 'streak30', emoji: '🌋', name: 'Vulcão', desc: 'Sequência de 30 dias', test: (g) => g.bestStreak >= 30 },
    { id: 'pomo1', emoji: '🍅', name: 'Primeiro tomate', desc: 'Conclua 1 Pomodoro', test: (g) => g.totalPomodoros >= 1 },
    { id: 'pomo25', emoji: '🧃', name: 'Molho de tomate', desc: 'Conclua 25 Pomodoros', test: (g) => g.totalPomodoros >= 25 },
    { id: 'focus10h', emoji: '🧘', name: 'Zen', desc: '10 horas de foco', test: (g) => g.focusMinutes >= 600 },
    { id: 'level5', emoji: '⚡', name: 'Nível 5', desc: 'Alcance o nível 5', test: (g) => levelFromXp(g.xp) >= 5 },
    { id: 'level10', emoji: '🧠', name: 'Nível 10', desc: 'Alcance o nível 10', test: (g) => levelFromXp(g.xp) >= 10 },
    { id: 'bigday', emoji: '💥', name: 'Dia épico', desc: 'Conclua 10 tarefas em um dia', test: (g) => Object.values(g.completedByDate).some((n) => n >= 10) },
    { id: 'early', emoji: '🐓', name: 'Madrugador', desc: 'Conclua uma tarefa antes das 7h', test: (g, ctx) => ctx && ctx.hour < 7 && ctx.hour >= 4 },
    { id: 'night', emoji: '🦉', name: 'Coruja', desc: 'Conclua uma tarefa depois das 23h', test: (g, ctx) => ctx && ctx.hour >= 23 },
    { id: 'high', emoji: '🐸', name: 'Engolindo sapos', desc: 'Conclua 10 tarefas de alta prioridade', test: () => Store.state.tasks.filter((t) => t.done && t.priority === 'high').length >= 10 },
    { id: 'organizer', emoji: '🗂️', name: 'Organizador', desc: 'Crie uma categoria personalizada', test: () => Store.state.categories.some((c) => !c.id.startsWith('cat-')) },
    { id: 'shopper', emoji: '🛍️', name: 'Primeira compra', desc: 'Consiga um item da loja', test: () => Shop.collectionSize() >= 1 },
    { id: 'collector', emoji: '💎', name: 'Colecionador', desc: 'Tenha 10 itens da loja', test: () => Shop.collectionSize() >= 10 },
    { id: 'collector30', emoji: '👑', name: 'Museu particular', desc: 'Tenha 30 itens da loja', test: () => Shop.collectionSize() >= 30 },
    { id: 'allday', emoji: '🏆', name: 'Dia zerado', desc: 'Conclua todas as tarefas de um dia (mín. 3)', test: (g, ctx) => ctx && ctx.allDone },
  ];

  /* ---------- Missões diárias ---------- */
  const MISSION_POOL = [
    { id: 'm-done3', emoji: '✅', text: 'Conclua 3 tarefas', target: 3, metric: 'done', reward: { xp: 30, coins: 10 } },
    { id: 'm-done5', emoji: '🏃', text: 'Conclua 5 tarefas', target: 5, metric: 'done', reward: { xp: 50, coins: 15 } },
    { id: 'm-high1', emoji: '🐸', text: 'Conclua 1 tarefa de alta prioridade', target: 1, metric: 'high', reward: { xp: 25, coins: 8 } },
    { id: 'm-pomo1', emoji: '🍅', text: 'Faça 1 Pomodoro', target: 1, metric: 'pomo', reward: { xp: 25, coins: 8 } },
    { id: 'm-pomo3', emoji: '🧠', text: 'Faça 3 Pomodoros', target: 3, metric: 'pomo', reward: { xp: 45, coins: 14 } },
    { id: 'm-ontime2', emoji: '⏰', text: 'Conclua 2 tarefas no horário', target: 2, metric: 'ontime', reward: { xp: 30, coins: 10 } },
    { id: 'm-create3', emoji: '📝', text: 'Planeje 3 novas tarefas', target: 3, metric: 'create', reward: { xp: 20, coins: 6 } },
    { id: 'm-sub3', emoji: '🧩', text: 'Conclua 3 subtarefas', target: 3, metric: 'subtask', reward: { xp: 20, coins: 6 } },
    { id: 'm-before12', emoji: '🌅', text: 'Conclua 2 tarefas antes do meio-dia', target: 2, metric: 'morning', reward: { xp: 30, coins: 10 } },
  ];

  const WEEKLY_TARGET = 20;
  const WEEKLY_REWARD = { xp: 150, coins: 50 };

  /* ---------- Loja (catálogo em shop.js) ---------- */
  const { ACCENTS, MASCOTS } = window.TU.Shop;
  const Shop = window.TU.Shop;

  /* ---------- Helpers ---------- */
  const enabled = (k) => {
    const s = Store.state.settings;
    return s.gamification && (k ? s[k] !== false : true);
  };
  const game = () => Store.state.game;

  /** XP em dobro (poder da loja) */
  function boosted(xp) {
    return Shop.boostActive() ? xp * 2 : xp;
  }

  function addXp(g, date, xp, coins) {
    g.xp = Math.max(0, g.xp + xp);
    // moedas podem ficar negativas ("dívida") se forem gastas e a tarefa for desfeita;
    // a interface mostra no mínimo 0 e novas recompensas abatem a dívida
    g.coins += coins;
    g.xpByDate[date] = Math.max(0, (g.xpByDate[date] || 0) + xp);
  }

  function computeStreak() {
    const g = game();
    if (!g.lastActiveDate) return 0;
    const diff = U.diffDays(g.lastActiveDate, U.today());
    return diff <= 1 ? g.streak : 0;
  }

  function touchStreak(g, today) {
    if (g.lastActiveDate === today) return false;
    const diff = g.lastActiveDate ? U.diffDays(g.lastActiveDate, today) : null;
    g.streak = diff === 1 ? g.streak + 1 : 1;
    g.lastActiveDate = today;
    g.bestStreak = Math.max(g.bestStreak, g.streak);
    return true;
  }

  /** Recalcula sequência quando um dia fica sem tarefas concluídas (desfazer). */
  function recomputeStreak(g) {
    const active = new Set([
      ...Object.keys(g.completedByDate).filter((d) => g.completedByDate[d] > 0),
      ...Object.keys(g.pomodorosByDate || {}).filter((d) => g.pomodorosByDate[d] > 0),
    ]);
    const frozen = g.frozenDays || {};
    Object.keys(frozen).forEach((d) => active.add(d));
    const days = [...active].sort();
    const lastAny = days[days.length - 1];
    // remove dias congelados no fim (não contam como atividade)
    while (days.length && frozen[days[days.length - 1]]) days.pop();
    if (!days.length) {
      g.streak = 0;
      g.lastActiveDate = null;
      return;
    }
    const last = days[days.length - 1];
    let streak = 1;
    for (let i = days.length - 1; i > 0; i--) {
      if (U.diffDays(days[i - 1], days[i]) !== 1) break;
      if (!frozen[days[i - 1]]) streak++; // dia congelado mantém a sequência, mas não soma
    }
    g.streak = streak;
    // um dia congelado logo depois do último dia ativo mantém a sequência viva
    g.lastActiveDate = lastAny > last && U.diffDays(last, lastAny) === Object.keys(frozen).filter((d) => d > last && d <= lastAny).length ? lastAny : last;
  }

  /* ---------- Missões ---------- */
  function ensureMissions() {
    const g = game();
    const today = U.today();
    if (g.missions.date !== today) {
      const rnd = U.seeded('missions-' + today);
      const pool = MISSION_POOL.slice();
      const list = [];
      while (list.length < 3 && pool.length) {
        const i = Math.floor(rnd() * pool.length);
        list.push({ id: pool[i].id, progress: 0, claimed: false });
        pool.splice(i, 1);
      }
      g.missions = { date: today, list };
    }
    const week = U.weekStart(today);
    if (g.weekly.week !== week) g.weekly = { week, claimed: false };
    return g.missions;
  }

  function missionDef(id) {
    return MISSION_POOL.find((m) => m.id === id);
  }

  function bumpMission(metric, delta = 1) {
    ensureMissions();
    const g = game();
    g.missions.list.forEach((m) => {
      const def = missionDef(m.id);
      if (!def || def.metric !== metric) return;
      const before = m.progress;
      m.progress = Math.max(0, m.progress + delta);
      if (before < def.target && m.progress >= def.target && enabled('missions') && !m.claimed) {
        Bus.emit('toast', { text: `Missão completa: ${def.text}! Resgate sua recompensa.`, type: 'achievement', icon: '🎯' });
      }
    });
  }

  function claimMission(id) {
    const g = game();
    const m = g.missions.list.find((x) => x.id === id);
    const def = missionDef(id);
    if (!m || !def || m.claimed || m.progress < def.target) return;
    const before = levelFromXp(g.xp);
    Store.update((s) => {
      m.claimed = true;
      addXp(s.game, U.today(), boosted(def.reward.xp), def.reward.coins);
    });
    Sound.play('coin');
    UI.toast(`+${boosted(def.reward.xp)} XP e +${def.reward.coins} moedas!`, { type: 'xp', icon: '🪙' });
    afterXp(before);
  }

  function weeklyProgress() {
    const g = game();
    ensureMissions();
    let n = 0;
    for (let i = 0; i < 7; i++) n += g.completedByDate[U.addDays(g.weekly.week, i)] || 0;
    return { done: n, target: WEEKLY_TARGET, claimed: g.weekly.claimed, reward: WEEKLY_REWARD };
  }

  function claimWeekly() {
    const w = weeklyProgress();
    if (w.claimed || w.done < w.target) return;
    const before = levelFromXp(game().xp);
    Store.update((s) => {
      s.game.weekly.claimed = true;
      addXp(s.game, U.today(), boosted(WEEKLY_REWARD.xp), WEEKLY_REWARD.coins);
    });
    Sound.play('coin');
    celebrate({ big: true });
    UI.toast(`Desafio semanal concluído! +${WEEKLY_REWARD.xp} XP`, { type: 'achievement', icon: '🏅' });
    afterXp(before);
  }

  /* ---------- Conquistas ---------- */
  function checkAchievements(ctx) {
    const g = game();
    const newly = [];
    ACHIEVEMENTS.forEach((a) => {
      if (g.achievements[a.id]) return;
      let ok = false;
      try {
        ok = a.test(g, ctx);
      } catch (_) {}
      if (ok) {
        g.achievements[a.id] = new Date().toISOString();
        g.coins += 15;
        newly.push(a);
      }
    });
    if (newly.length) {
      Store.save();
      if (enabled('achievements')) {
        newly.forEach((a, i) =>
          setTimeout(() => {
            Sound.play('achievement');
            UI.toast(`Conquista desbloqueada: ${a.name} (+15 moedas)`, { type: 'achievement', icon: a.emoji, duration: 5000 });
          }, 400 + i * 700)
        );
      }
    }
    return newly;
  }

  /* ---------- Celebrações ---------- */
  function celebrate({ big = false, origin = null } = {}) {
    if (!Store.state.settings.celebrations || !Store.state.settings.gamification) return;
    UI.confetti({ count: big ? 180 : 50, origin });
  }

  function afterXp(levelBefore) {
    const after = levelFromXp(game().xp);
    if (after > levelBefore && enabled('showXP')) {
      setTimeout(() => showLevelUp(after), 350);
    }
    Bus.emit('game');
  }

  function showLevelUp(level) {
    const t = levelTitle(level);
    Sound.play('levelup');
    celebrate({ big: true });
    UI.modal({
      size: 'sm',
      className: 'modal-levelup',
      body: `
        <div class="levelup">
          <div class="levelup-badge">${t.emoji}</div>
          <p class="levelup-kicker">Subiu de nível!</p>
          <h2>Nível ${level}</h2>
          <p class="muted">Agora você é <strong>${t.title}</strong>. Continue assim!</p>
          <button class="btn btn-primary btn-block" data-close>Bora! 🚀</button>
        </div>`,
      onMount(el, api) {
        el.querySelector('[data-close]').onclick = () => api.close();
      },
    });
  }

  /* ---------- API pública chamada pelos outros módulos ---------- */
  const Game = {
    ACHIEVEMENTS,
    MISSION_POOL,
    ACCENTS,
    MASCOTS,
    levelInfo,
    levelFromXp,
    levelTitle,
    computeStreak,
    ensureMissions,
    missionDef,
    claimMission,
    weeklyProgress,
    claimWeekly,
    celebrate,
    checkAchievements,
    enabled,
    afterXp,

    motivation() {
      return U.pick(MOTIVATION);
    },

    /** Chamado ao concluir tarefa. Retorna {xp, coins}. Muta o estado (dentro de Store.update). */
    onTaskCompleted(s, task) {
      const g = s.game;
      const today = U.today();
      const now = new Date();
      let xp = XP_TABLE[task.priority] || 15;
      let coins = COIN_TABLE[task.priority] || 3;
      const due = U.dueDate(task);
      const onTime = due && now <= due;
      if (onTime) xp += 5;
      const streakDay = touchStreak(g, today);
      // bônus por sequência
      if (streakDay && g.streak > 1) xp += Math.min(g.streak, 10) * 2;
      xp = boosted(xp);
      addXp(g, today, xp, coins);
      g.totalCompleted++;
      g.completedByDate[today] = (g.completedByDate[today] || 0) + 1;
      bumpMission('done');
      if (task.priority === 'high') bumpMission('high');
      if (onTime) bumpMission('ontime');
      if (now.getHours() < 12) bumpMission('morning');
      task.wasOnTime = !!onTime;
      task.wasMorning = now.getHours() < 12;
      return { xp, coins };
    },

    /** Reverte recompensas ao desmarcar uma tarefa. */
    onTaskUncompleted(s, task) {
      const g = s.game;
      const day = task.completedAt ? U.dateKey(new Date(task.completedAt)) : U.today();
      g.xp = Math.max(0, g.xp - (task.xpAwarded || 0));
      g.coins -= task.coinsAwarded || 0;
      g.xpByDate[day] = Math.max(0, (g.xpByDate[day] || 0) - (task.xpAwarded || 0));
      g.totalCompleted = Math.max(0, g.totalCompleted - 1);
      g.completedByDate[day] = Math.max(0, (g.completedByDate[day] || 0) - 1);
      if (day === U.today()) {
        bumpMission('done', -1);
        if (task.priority === 'high') bumpMission('high', -1);
        if (task.wasOnTime) bumpMission('ontime', -1);
        if (task.wasMorning) bumpMission('morning', -1);
      }
      task.wasOnTime = task.wasMorning = false;
      if (!g.completedByDate[day]) recomputeStreak(g);
    },

    onSubtaskCompleted(s, delta) {
      const xp = 2 * delta;
      addXp(s.game, U.today(), xp, 0);
      bumpMission('subtask', delta);
    },

    onTaskCreated() {
      bumpMission('create');
    },

    /** Tarefa criada hoje e apagada não conta para "Planeje 3 novas tarefas". */
    onTaskRemoved(task) {
      if (task.createdAt && U.dateKey(new Date(task.createdAt)) === U.today() && !task.spawnedFrom) bumpMission('create', -1);
    },

    onPomodoro(s, minutes) {
      const g = s.game;
      const today = U.today();
      g.totalPomodoros++;
      g.focusMinutes += minutes;
      g.pomodorosByDate[today] = (g.pomodorosByDate[today] || 0) + 1;
      g.focusByDate = g.focusByDate || {};
      g.focusByDate[today] = (g.focusByDate[today] || 0) + minutes;
      const xp = boosted(15);
      addXp(g, today, xp, 3);
      touchStreak(g, today);
      bumpMission('pomo');
      return { xp, coins: 3 };
    },

    /** Feedback visual/sonoro após concluir (fora do Store.update). */
    feedbackComplete({ xp, levelBefore, origin, allDone, undo }) {
      Sound.play('complete');
      const action = undo ? { label: 'Desfazer', fn: undo } : null;
      if (enabled() && enabled('showXP')) UI.toast(`${U.pick(CELEBRATE)} +${xp} XP`, { type: 'xp', icon: '⭐', duration: 4000, action });
      else UI.toast('Tarefa concluída', { type: 'success', duration: 4000, action });
      if (enabled()) {
        celebrate({ origin, big: allDone });
        if (allDone && enabled('motivation')) setTimeout(() => UI.toast(U.pick(ALL_DONE), { type: 'success', icon: '🏆' }), 600);
      }
      checkAchievements({ hour: new Date().getHours(), allDone });
      afterXp(levelBefore);
    },

    buy(kind, key) {
      Shop.buy(kind, key);
    },

    equip(kind, key) {
      Shop.equip(kind, key);
    },

    /** Troca as missões ainda não resgatadas por outras (poder da loja). */
    rerollMissions() {
      ensureMissions();
      Store.update((s) => {
        const list = s.game.missions.list;
        const keep = list.filter((m) => m.claimed);
        const used = new Set(list.map((m) => m.id));
        const pool = MISSION_POOL.filter((m) => !used.has(m.id));
        const fresh = [];
        while (keep.length + fresh.length < 3 && pool.length) {
          const i = Math.floor(Math.random() * pool.length);
          fresh.push({ id: pool[i].id, progress: 0, claimed: false });
          pool.splice(i, 1);
        }
        s.game.missions.list = [...keep, ...fresh];
      });
    },

    /* ---------- Tela de Conquistas ---------- */
    render(view) {
      const s = Store.state;
      const g = s.game;
      if (!s.settings.gamification) {
        view.innerHTML = `
          <div class="empty-state card">
            <div class="empty-emoji">🎮</div>
            <h3>Gamificação desativada</h3>
            <p class="muted">XP, níveis, conquistas e missões estão desligados. Você pode ativá-los quando quiser.</p>
            <button class="btn btn-primary" data-action="enable-game">Ativar gamificação</button>
          </div>`;
        return;
      }
      ensureMissions();
      const li = levelInfo();
      const streak = computeStreak();
      const w = weeklyProgress();
      const unlockedCount = Object.keys(g.achievements).length;

      view.innerHTML = `
        <div class="grid game-top">
          <div class="card level-hero">
            <div class="level-hero-badge">${li.emoji}</div>
            <div class="level-hero-info">
              <span class="kicker">Nível ${li.level}</span>
              <h2>${li.title}</h2>
              <div class="progress lg"><span style="width:${li.pct}%"></span></div>
              <p class="muted small">${li.current} / ${li.needed} XP para o nível ${li.level + 1} · total ${li.xp} XP</p>
            </div>
          </div>
          <div class="card stat-mini"><span class="stat-emoji flame ${streak ? 'on' : ''}">🔥</span><div><strong>${streak}</strong><span>dias de sequência</span></div></div>
          <div class="card stat-mini"><span class="stat-emoji">🏅</span><div><strong>${g.bestStreak}</strong><span>melhor sequência</span></div></div>
          <div class="card stat-mini"><span class="stat-emoji">🪙</span><div><strong>${Math.max(0, g.coins)}</strong><span>moedas</span></div></div>
          <div class="card stat-mini"><span class="stat-emoji">✅</span><div><strong>${g.totalCompleted}</strong><span>tarefas concluídas</span></div></div>
          <div class="card stat-mini"><span class="stat-emoji">🍅</span><div><strong>${g.totalPomodoros}</strong><span>pomodoros · ${U.formatDuration(g.focusMinutes) || '0 min'}</span></div></div>
        </div>

        <div class="grid two">
          ${enabled('missions') ? `<div class="card">
            <div class="card-head"><h3>🎯 Missões de hoje</h3><span class="muted small">renovam à meia-noite</span></div>
            ${Game.missionsHtml()}
          </div>
          <div class="card">
            <div class="card-head"><h3>🏁 Desafio da semana</h3><span class="muted small">seg → dom</span></div>
            <p>Conclua <strong>${w.target} tarefas</strong> nesta semana.</p>
            <div class="progress lg"><span style="width:${Math.min(100, (w.done / w.target) * 100)}%"></span></div>
            <div class="row between mt">
              <span class="muted small">${Math.min(w.done, w.target)} / ${w.target} · recompensa: ${w.reward.xp} XP + ${w.reward.coins} 🪙</span>
              ${w.claimed ? '<span class="pill pill-success">Resgatado ✓</span>' : `<button class="btn btn-sm btn-primary" data-action="claim-weekly" ${w.done < w.target ? 'disabled' : ''}>Resgatar</button>`}
            </div>
          </div>` : ''}
        </div>

        ${enabled('achievements') ? `<div class="card">
          <div class="card-head"><h3>🏆 Conquistas</h3><span class="muted small">${unlockedCount} / ${ACHIEVEMENTS.length}</span></div>
          <div class="achievements">
            ${ACHIEVEMENTS.map((a) => {
              const at = g.achievements[a.id];
              return `<div class="achievement ${at ? 'unlocked' : 'locked'}" title="${U.escape(a.desc)}">
                <div class="ach-emoji">${at ? a.emoji : '🔒'}</div>
                <strong>${a.name}</strong>
                <span class="muted small">${a.desc}</span>
                ${at ? `<span class="ach-date">${U.formatDateHuman(U.dateKey(new Date(at)))}</span>` : ''}
              </div>`;
            }).join('')}
          </div>
        </div>` : ''}

        <div class="card shop-teaser">
          <div><h3>🛍️ Loja de recompensas</h3><p class="muted small">Você tem 🪙 ${Math.max(0, g.coins)} moedas · ${Shop.collectionSize()} itens na coleção. Temas, fundos, mascotes, efeitos, sons, títulos e poderes!</p></div>
          <button class="btn btn-primary" data-action="go" data-view="shop">Abrir a loja</button>
        </div>`;
    },

    missionsHtml() {
      const g = game();
      ensureMissions();
      return `<ul class="missions">
        ${g.missions.list
          .map((m) => {
            const d = missionDef(m.id);
            if (!d) return '';
            const done = m.progress >= d.target;
            return `<li class="mission ${done ? 'done' : ''} ${m.claimed ? 'claimed' : ''}">
              <span class="mission-emoji">${d.emoji}</span>
              <div class="mission-body">
                <span>${d.text}</span>
                <div class="progress sm"><span style="width:${Math.min(100, (m.progress / d.target) * 100)}%"></span></div>
                <span class="muted small">${Math.min(m.progress, d.target)}/${d.target} · ${d.reward.xp} XP + ${d.reward.coins} 🪙</span>
              </div>
              ${m.claimed ? '<span class="pill pill-success">✓</span>' : `<button class="btn btn-sm ${done ? 'btn-primary pulse' : ''}" data-action="claim-mission" data-id="${m.id}" ${done ? '' : 'disabled'}>Resgatar</button>`}
            </li>`;
          })
          .join('')}
      </ul>`;
    },
  };

  window.TU.Game = Game;
})();

</script>
  <script>
/* =========================================================
   TaskUp — tasks.js
   Tarefas: CRUD, recorrência, subtarefas, formulário,
   adição rápida com linguagem natural e tela "Tarefas".
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, UI, Game, Sound } = window.TU;
  const Actions = (window.TU.Actions = window.TU.Actions || {});

  const PRIORITIES = {
    high: { label: 'Alta', emoji: '🔴', order: 0 },
    medium: { label: 'Média', emoji: '🟡', order: 1 },
    low: { label: 'Baixa', emoji: '🟢', order: 2 },
  };
  const RECURRENCE = {
    none: 'Não repete',
    daily: 'Todos os dias',
    weekdays: 'Dias úteis (seg–sex)',
    weekly: 'Toda semana',
    monthly: 'Todo mês',
    yearly: 'Todo ano',
  };
  const REMINDERS = [
    [null, 'Sem lembrete'],
    [0, 'Na hora'],
    [5, '5 min antes'],
    [10, '10 min antes'],
    [15, '15 min antes'],
    [30, '30 min antes'],
    [60, '1 hora antes'],
    [120, '2 horas antes'],
    [1440, '1 dia antes'],
  ];

  /* ---------------- Consultas ---------------- */
  function isOverdue(t, now = new Date()) {
    if (t.done || !t.date) return false;
    const due = U.dueDate(t);
    return due < now;
  }

  function sortTasks(list, by = 'date') {
    const pr = (t) => PRIORITIES[t.priority]?.order ?? 1;
    const dt = (t) => (t.date ? t.date + ' ' + (t.time || '99:99') : '9999');
    return list.slice().sort((a, b) => {
      if (a.done !== b.done) return a.done ? 1 : -1;
      if (by === 'priority') return pr(a) - pr(b) || dt(a).localeCompare(dt(b));
      if (by === 'created') return b.createdAt.localeCompare(a.createdAt);
      if (by === 'title') return a.title.localeCompare(b.title, 'pt-BR');
      return dt(a).localeCompare(dt(b)) || pr(a) - pr(b);
    });
  }

  function forDate(key) {
    return Store.state.tasks.filter((t) => t.date === key);
  }

  function dayStats(key = U.today()) {
    const list = forDate(key);
    const done = list.filter((t) => t.done).length;
    return { total: list.length, done, pct: list.length ? Math.round((done / list.length) * 100) : 0 };
  }

  /* ---------------- Recorrência ---------------- */
  /** Dia do mês que a série repete (evita 31 → 28 → 28...). */
  function recurAnchor(task) {
    return task.recurDay || (task.date ? +task.date.slice(8) : U.parseDateKey(U.today()).getDate());
  }

  /** Próxima ocorrência: sempre depois de hoje (concluir algo atrasado não gera outra atrasada). */
  function nextDate(task) {
    const base = task.date || U.today();
    const anchor = recurAnchor(task);
    const step = (d) => {
      switch (task.recurrence) {
        case 'daily':
          return U.addDays(d, 1);
        case 'weekdays': {
          let x = U.addDays(d, 1);
          while ([0, 6].includes(U.parseDateKey(x).getDay())) x = U.addDays(x, 1);
          return x;
        }
        case 'weekly':
          return U.addDays(d, 7);
        case 'monthly':
          return U.addMonths(d, 1, anchor);
        case 'yearly':
          return U.addMonths(d, 12, anchor);
        default:
          return null;
      }
    };
    let d = step(base);
    const today = U.today();
    for (let guard = 0; d && d <= today && guard < 5000; guard++) d = step(d);
    return d;
  }

  /* ---------------- Mutations ---------------- */
  const Tasks = {
    PRIORITIES,
    RECURRENCE,
    REMINDERS,
    isOverdue,
    sortTasks,
    forDate,
    dayStats,
    filters: { status: 'pending', category: 'all', priority: 'all', q: '', sort: 'date' },
    showDone: false,

    get(id) {
      return Store.state.tasks.find((t) => t.id === id);
    },

    create(data) {
      const task = Store.normalizeTask({ ...data, id: U.uid(), createdAt: new Date().toISOString() });
      Store.update((s) => {
        s.tasks.push(task);
        Game.onTaskCreated();
      });
      return task;
    },

    update(id, patch) {
      Store.update((s) => {
        const t = s.tasks.find((x) => x.id === id);
        if (!t) return;
        // mudou a data: a série recorrente passa a seguir o novo dia
        if (patch.date !== undefined && patch.date !== t.date) patch = { ...patch, recurDay: null };
        // se data/hora mudou, permite notificar de novo
        if ((patch.date !== undefined && patch.date !== t.date) || (patch.time !== undefined && patch.time !== t.time)) {
          Object.keys(s.notified).forEach((k) => k.startsWith(id + '|') && delete s.notified[k]);
        }
        Object.assign(t, patch, { updatedAt: new Date().toISOString() });
      });
    },

    remove(id, { undo = true } = {}) {
      const s = Store.state;
      const idx = s.tasks.findIndex((t) => t.id === id);
      if (idx < 0) return;
      const removed = s.tasks[idx];
      Store.update((st) => {
        st.tasks.splice(idx, 1);
        Game.onTaskRemoved(removed);
      });
      if (Store.state.pomodoro.taskId === id) Store.update((st) => (st.pomodoro.taskId = null), { silent: true });
      if (undo) {
        UI.toast(`"${removed.title}" excluída`, {
          icon: '🗑️',
          action: {
            label: 'Desfazer',
            fn: () =>
              Store.update((st) => {
                if (st.tasks.some((x) => x.id === removed.id)) return;
                st.tasks.splice(Math.min(idx, st.tasks.length), 0, removed);
                if (U.dateKey(new Date(removed.createdAt)) === U.today() && !removed.spawnedFrom) Game.onTaskCreated();
              }),
          },
          duration: 5000,
        });
      }
    },

    toggle(id, origin) {
      const t = Tasks.get(id);
      if (!t) return;
      const levelBefore = Game.levelFromXp(Store.state.game.xp);
      if (!t.done) {
        let reward = { xp: 0, coins: 0 };
        let allDone = false;
        Store.update((s) => {
          const task = s.tasks.find((x) => x.id === id);
          task.done = true;
          task.completedAt = new Date().toISOString();
          reward = Game.onTaskCompleted(s, task);
          task.xpAwarded = reward.xp;
          task.coinsAwarded = reward.coins;
          // marca subtarefas restantes como feitas
          task.subtasks.forEach((st) => (st.done = true));
          // recorrência: cria a próxima ocorrência
          if (task.recurrence && task.recurrence !== 'none' && !task.spawnedNext) {
            const nd = nextDate(task);
            if (nd) {
              const next = Store.normalizeTask({
                ...task,
                id: U.uid(),
                date: nd,
                done: false,
                completedAt: null,
                createdAt: new Date().toISOString(),
                pomodoros: 0,
                xpAwarded: 0,
                coinsAwarded: 0,
                spawnedNext: null,
                snoozeUntil: null,
                updatedAt: null,
                spawnedFrom: task.id,
                recurDay: recurAnchor(task),
                wasOnTime: false,
                wasMorning: false,
                subtasks: task.subtasks.map((st) => ({ ...st, id: U.uid(), done: false })),
              });
              s.tasks.push(next);
              task.spawnedNext = next.id;
            }
          }
          const today = s.tasks.filter((x) => x.date === U.today());
          allDone = task.date === U.today() && today.length >= 3 && today.every((x) => x.done);
        });
        Game.feedbackComplete({ xp: reward.xp, levelBefore, origin, allDone, undo: () => Tasks.get(id)?.done && Tasks.toggle(id) });
      } else {
        Store.update((s) => {
          const task = s.tasks.find((x) => x.id === id);
          Game.onTaskUncompleted(s, task);
          task.done = false;
          task.completedAt = null;
          task.xpAwarded = 0;
          task.coinsAwarded = 0;
          // remove a próxima ocorrência gerada se ainda não foi concluída nem editada;
          // caso contrário mantém o vínculo para não gerar uma duplicata ao concluir de novo
          if (task.spawnedNext) {
            const i = s.tasks.findIndex((x) => x.id === task.spawnedNext);
            if (i < 0) task.spawnedNext = null;
            else if (!s.tasks[i].done && !s.tasks[i].updatedAt) {
              s.tasks.splice(i, 1);
              task.spawnedNext = null;
            }
          }
        });
        Sound.play('undo');
        Bus.emit('game');
      }
    },

    toggleSubtask(taskId, subId) {
      let delta = 0;
      Store.update((s) => {
        const t = s.tasks.find((x) => x.id === taskId);
        const st = t && t.subtasks.find((x) => x.id === subId);
        if (!st) return;
        st.done = !st.done;
        delta = st.done ? 1 : -1;
        Game.onSubtaskCompleted(s, delta);
      });
      Sound.play(delta > 0 ? 'click' : 'undo');
      const t = Tasks.get(taskId);
      if (t && !t.done && t.subtasks.length && t.subtasks.every((x) => x.done)) {
        UI.toast('Todas as subtarefas feitas! Concluir a tarefa?', {
          icon: '🧩',
          action: { label: 'Concluir', fn: () => Tasks.get(taskId) && !Tasks.get(taskId).done && Tasks.toggle(taskId) },
        });
      }
    },

    duplicate(id) {
      const t = Tasks.get(id);
      if (!t) return;
      Tasks.create({ ...t, title: t.title + ' (cópia)', snoozeUntil: null, done: false, completedAt: null, pomodoros: 0, xpAwarded: 0, coinsAwarded: 0, spawnedNext: null, subtasks: t.subtasks.map((s) => ({ ...s, id: U.uid(), done: false })) });
      UI.toast('Tarefa duplicada', { icon: '📄' });
    },

    /* ---------------- Adição rápida ---------------- */
    parseQuick(text) {
      let t = ' ' + text + ' ';
      const out = { date: null, time: null, priority: 'medium', categoryId: null };
      const norm = (x) => U.normalize(x);
      const today = U.today();

      // prioridade
      t = t.replace(/\s!(alta|urgente|high|!!)(?=\s)/gi, () => ((out.priority = 'high'), ' '));
      t = t.replace(/\s!(baixa|low)(?=\s)/gi, () => ((out.priority = 'low'), ' '));
      t = t.replace(/\s!(media|média|medium)(?=\s)/gi, () => ((out.priority = 'medium'), ' '));

      // categoria #nome
      t = t.replace(/\s#([\p{L}\p{N}_-]+)/giu, (m, name) => {
        const cat = Store.state.categories.find((c) => norm(c.name).startsWith(norm(name)));
        if (cat) {
          out.categoryId = cat.id;
          return ' ';
        }
        return m;
      });

      // datas relativas
      const rel = [
        [/\s(depois de amanh[ãa])(?=\s)/i, 2],
        [/\s(amanh[ãa])(?=\s)/i, 1],
        [/\s(hoje)(?=\s)/i, 0],
      ];
      for (const [re, n] of rel) {
        if (re.test(t)) {
          out.date = U.addDays(today, n);
          t = t.replace(re, ' ');
          break;
        }
      }
      // dia da semana
      if (!out.date) {
        const days = ['domingo', 'segunda', 'terca', 'quarta', 'quinta', 'sexta', 'sabado'];
        const re = /\s(?:na |no |n[ao]s? )?(domingo|segunda|ter[çc]a|quarta|quinta|sexta|s[áa]bado)(?:-feira)?(?=\s)/i;
        const m = t.match(re);
        if (m) {
          const target = days.indexOf(norm(m[1]));
          const cur = new Date().getDay();
          let diff = (target - cur + 7) % 7;
          if (diff === 0) diff = 7;
          out.date = U.addDays(today, diff);
          t = t.replace(re, ' ');
        }
      }
      // dd/mm
      if (!out.date) {
        const m = t.match(/\s(\d{1,2})\/(\d{1,2})(?:\/(\d{2,4}))?(?=\s)/);
        if (m) {
          const now = new Date();
          let y = m[3] ? +m[3] : now.getFullYear();
          if (y < 100) y += 2000;
          const d = new Date(y, +m[2] - 1, +m[1]);
          const valid = d.getDate() === +m[1] && d.getMonth() === +m[2] - 1;
          if (valid && !m[3] && U.dateKey(d) < today) d.setFullYear(y + 1);
          if (valid && d.getDate() === +m[1]) {
            out.date = U.dateKey(d);
            t = t.replace(m[0], ' ');
          }
        }
      }
      // horário: 14h, 14:30, 9h30, às 8
      const tm = t.match(/\s(?:[àa]s\s)?(\d{1,2})(?::(\d{2})|h(\d{2})?)(?=\s)/i) || t.match(/\s[àa]s\s(\d{1,2})()()(?=\s)/i);
      if (tm) {
        const h = +tm[1];
        const mi = +(tm[2] || tm[3] || 0);
        if (h < 24 && mi < 60) {
          out.time = `${U.pad(h)}:${U.pad(mi)}`;
          t = t.replace(tm[0], ' ');
        }
      }
      out.title = t.replace(/\s+/g, ' ').trim();
      return out;
    },

    quickAdd(text, defaults = {}) {
      const p = Tasks.parseQuick(text);
      if (!p.title) return null;
      const task = Tasks.create({
        title: p.title,
        priority: p.priority,
        categoryId: p.categoryId || defaults.categoryId || 'cat-outros',
        date: p.date || defaults.date || U.today(),
        time: p.time || defaults.time || null,
        reminder: p.time ? Store.state.settings.defaultReminder : null,
      });
      Sound.play('click');
      UI.toast(`Tarefa criada: ${task.title}`, { type: 'success', icon: '📝', duration: 2200 });
      return task;
    },

            <div class="task-meta">${meta.join('')}</div>
            ${!compact && !t.done && t.subtasks.length ? `<ul class="subtasks-inline">${t.subtasks
              .map(
                (st) => `<li class="${st.done ? 'done' : ''}"><button class="sub-check" data-action="toggle-sub" data-task="${t.id}" data-sub="${st.id}" aria-pressed="${st.done}" aria-label="${st.done ? 'Desmarcar' : 'Concluir'} subtarefa: ${U.escape(st.title)}">${st.done ? '✓' : ''}</button><span>${U.escape(st.title)}</span></li>`
              )
              .join('')}</ul>` : ''}
          </div>
          <div class="task-actions">

            <button class="icon-btn" data-action="task-menu" data-id="${t.id}" title="Mais opções">⋯</button>

            </div>

            ${editing ? `<p class="muted small">Criada em ${new Date(editing.createdAt).toLocaleString('pt-BR')}${editing.completedAt ? ` · concluída em ${new Date(editing.completedAt).toLocaleString('pt-BR')}` : ''}${editing.pomodoros ? ` · ${editing.pomodoros} 🍅` : ''}</p>` : ''}

            <div class="form-actions">
              ${editing ? `<button type="button" class="btn btn-ghost danger" data-del>🗑️ Excluir</button>` : '<span></span>'}

        onMount(el, api) {

          const list = el.querySelector('.subtask-editor');

          const renderSubs = () => {
            list.innerHTML = subtasks
              .map(
                (st, i) => `<li>
                <label class="mini-check"><input type="checkbox" data-sub-done="${i}" ${st.done ? 'checked' : ''}><span></span></label>

                <button type="button" class="icon-btn" data-sub-rm="${i}" aria-label="Remover">✕</button>
              </li>`
              )
              .join('');
          };
          renderSubs();
          const addSub = () => {
            const v = newSub.value.trim();
            if (!v) return;
            subtasks.push({ id: U.uid(), title: v, done: false });
            newSub.value = '';
            renderSubs();
            newSub.focus();
          };
          el.querySelector('[data-add-sub]').onclick = addSub;
          newSub.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
              e.preventDefault();
              addSub();
            }
          });
          list.addEventListener('input', (e) => {
            const i = e.target.dataset.subTitle;
            if (i !== undefined) subtasks[i].title = e.target.value;
          });
          list.addEventListener('change', (e) => {
            const i = e.target.dataset.subDone;
            if (i !== undefined) subtasks[i].done = e.target.checked;
          });
          list.addEventListener('click', (e) => {
            const b = e.target.closest('[data-sub-rm]');
            if (b) {
              subtasks.splice(+b.dataset.subRm, 1);
              renderSubs();
            }
          });

          el.querySelectorAll('[data-qd]').forEach((b) =>
            b.addEventListener('click', () => {
              form.date.value = b.dataset.qd === 'none' ? '' : U.addDays(U.today(), +b.dataset.qd);

          );
          el.querySelector('[data-qt]').onclick = () => (form.time.value = '');
