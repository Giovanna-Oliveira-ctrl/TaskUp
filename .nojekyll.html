(function () {
  'use strict';

  const { U, Bus, Store, UI, Game, Notify, Backup, Sound } = window.TU;
  const Actions = window.TU.Actions;
  const Changes = (window.TU.Changes = window.TU.Changes || {});

  function getPath(obj, path) {
    return path.split('.').reduce((o, k) => (o ? o[k] : undefined), obj);
  }
  function setPath(obj, path, val) {
    const keys = path.split('.');
    const last = keys.pop();
    keys.reduce((o, k) => o[k], obj)[last] = val;
  }

  const toggle = (key, label, desc = '', disabled = false) => `
    <label class="switch-row ${disabled ? 'disabled' : ''}">
      <span><strong>${label}</strong>${desc ? `<small class="muted">${desc}</small>` : ''}</span>
      <span class="switch"><input type="checkbox" data-change="setting" data-key="${key}" ${getPath(Store.state.settings, key) ? 'checked' : ''} ${disabled ? 'disabled' : ''}><i></i></span>
    </label>`;

  const number = (key, label, min, max, suffix = 'min') => `
    <label class="num-row">
      <span>${label}</span>
      <span class="num-input"><input type="number" class="input input-sm" min="${min}" max="${max}" value="${getPath(Store.state.settings, key)}" data-change="setting" data-key="${key}" data-type="number"> <small class="muted">${suffix}</small></span>
    </label>`;

  const Settings = {
    render(view) {
      const s = Store.state;
      const st = s.settings;
      const perm = Notify.permission();
      const permLabel = { granted: '✅ Permitidas', denied: '⛔ Bloqueadas no navegador', default: '❔ Ainda não autorizadas', unsupported: '🚫 Não suportadas neste navegador' }[perm];
      const g = st.gamification;
      const snaps = Backup.listSnapshots();
      const kb = (Store.usageBytes() / 1024).toFixed(1);

      view.innerHTML = `
        <div class="settings">
          <section class="card" id="sec-profile">
            <h3>👤 Perfil</h3>
            <label class="field">
              <span>Seu nome (usado na saudação)</span>
              <input class="input" value="${U.escape(st.name)}" data-change="setting" data-key="name" maxlength="40" placeholder="Como quer ser chamado(a)?">
            </label>
          </section>

          <section class="card" id="sec-appearance">
            <h3>🎨 Aparência</h3>
            <div class="field">
              <span>Tema</span>
              <div class="segmented">
                ${[['auto', '🌗 Automático'], ['light', '☀️ Claro'], ['dark', '🌙 Escuro']].map(([v, l]) => `<label><input type="radio" name="theme" value="${v}" ${st.theme === v ? 'checked' : ''} data-change="setting" data-key="theme"><span>${l}</span></label>`).join('')}
              </div>
            </div>
            <div class="field">
              <span>Cor de destaque ${g ? '<small class="muted">(desbloqueie mais na loja 🛍️)</small>' : ''}</span>
              <div class="accent-list">
                ${Object.entries(Game.ACCENTS)
                  .map(([k, a]) => {
                    const owned = !g || s.game.unlocked.accents.includes(k);
                    return `<button class="accent-opt ${st.accent === k ? 'active' : ''}" ${owned ? `data-action="equip" data-kind="accent" data-key="${k}"` : 'disabled'} title="${a.name}${owned ? '' : ' (bloqueado)'}" style="background:linear-gradient(135deg, ${a.color}, ${a.color2})">${owned ? (st.accent === k ? '✓' : '') : '🔒'}</button>`;
                  })
                  .join('')}
              </div>
            </div>
          </section>

          <section class="card" id="sec-game">
            <h3>🎮 Gamificação</h3>
            ${toggle('gamification', 'Ativar gamificação', 'XP, níveis, moedas, conquistas e missões')}
            <div class="sub-settings ${g ? '' : 'disabled'}">
              ${toggle('showXP', 'XP e níveis', 'Mostrar XP ganho e subir de nível', !g)}
              ${toggle('streaks', 'Sequência de dias', 'Contador de dias seguidos produtivos 🔥', !g)}
              ${toggle('achievements', 'Conquistas', 'Medalhas por marcos alcançados', !g)}
              ${toggle('missions', 'Missões e desafios', 'Missões diárias e desafio semanal', !g)}
              ${toggle('motivation', 'Mensagens motivacionais', 'Frases de incentivo no painel', !g)}
              ${toggle('celebrations', 'Comemorações', 'Confetes ao concluir tarefas 🎉', !g)}
            </div>
          </section>

          <section class="card" id="sec-sound">
            <h3>🔊 Sons</h3>
            ${toggle('sounds', 'Efeitos sonoros', 'Sons ao concluir tarefas, Pomodoro e lembretes')}
            <label class="num-row">
              <span>Volume</span>
              <input type="range" min="0" max="1" step="0.05" value="${st.volume}" data-change="setting" data-key="volume" data-type="number" class="range">
            </label>
            <div class="row gap wrap">
              <button class="btn btn-sm" data-action="test-sound" data-s="complete">▶ Conclusão</button>
              <button class="btn btn-sm" data-action="test-sound" data-s="levelup">▶ Nível</button>
              <button class="btn btn-sm" data-action="test-sound" data-s="pomodoro">▶ Pomodoro</button>
              <button class="btn btn-sm" data-action="test-sound" data-s="reminder">▶ Lembrete</button>
            </div>
          </section>

          <section class="card" id="sec-notif">
            <h3>🔔 Notificações</h3>
            <div class="row between wrap gap">
              <span>Permissão do navegador: <strong>${permLabel}</strong></span>
              ${perm === 'default' ? '<button class="btn btn-sm btn-primary" data-action="notif-request">Permitir notificações</button>' : ''}
              ${perm === 'granted' ? '<button class="btn btn-sm" data-action="notif-test">Testar notificação</button>' : ''}
            </div>
            ${toggle('notifications', 'Lembretes ativos', 'Avisar no horário configurado em cada tarefa')}
            <label class="num-row">
              <span>Lembrete padrão para tarefas com horário</span>
              <select class="input input-sm" data-change="setting" data-key="defaultReminder" data-type="nullable-number">
                ${window.TU.Tasks.REMINDERS.map(([v, l]) => `<option value="${v === null ? '' : v}" ${st.defaultReminder === v ? 'selected' : ''}>${l}</option>`).join('')}
              </select>
            </label>
            ${toggle('dailySummary', 'Resumo diário', 'Uma notificação com as tarefas do dia')}
            <label class="num-row">
              <span>Horário do resumo</span>
              <input type="time" class="input input-sm" value="${st.dailySummaryTime}" data-change="setting" data-key="dailySummaryTime">
            </label>
            <p class="muted small">ℹ️ Como o app funciona 100% offline e sem servidor, os lembretes são disparados enquanto o TaskUp estiver aberto (mesmo em segundo plano/aba minimizada). Instale como app para melhor experiência.${Notify.triggersSupported ? ' Seu navegador também permite agendar lembretes no sistema. ✅' : ''}</p>
          </section>

          <section class="card" id="sec-pomodoro">
            <h3>🍅 Pomodoro</h3>
            ${number('pomodoro.focus', 'Tempo de foco', 1, 120)}
            ${number('pomodoro.short', 'Pausa curta', 1, 60)}
            ${number('pomodoro.long', 'Pausa longa', 1, 90)}
            ${number('pomodoro.longEvery', 'Pausa longa a cada', 1, 12, 'focos')}
            ${toggle('pomodoro.autoStartBreaks', 'Iniciar pausas automaticamente')}
            ${toggle('pomodoro.autoStartFocus', 'Iniciar foco automaticamente após a pausa')}
          </section>

          ${window.TU.Security.settingsHtml()}

          <section class="card" id="sec-data">
            <h3>💾 Seus dados</h3>
            <p class="muted small">Tudo fica salvo somente neste dispositivo (${kb} KB usados). Faça backups para não perder nada ao trocar de navegador ou limpar dados.
            ${st.lastBackup ? `Último backup: <strong>${new Date(st.lastBackup).toLocaleString('pt-BR')}</strong>.` : '<strong>Você ainda não fez nenhum backup.</strong>'}</p>
            <div class="row gap wrap">
              <button class="btn btn-primary" data-action="export-json">💾 Exportar backup (JSON)</button>
              <label class="btn">📂 Importar backup<input type="file" accept="application/json,.json" data-change="import-file" hidden></label>
              <button class="btn" data-action="export-csv">📊 Exportar planilha (CSV)</button>
            </div>
            ${snaps.length ? `<div class="field mt">
              <span>Cópias automáticas locais</span>
              <div class="row gap wrap">${snaps.map((k) => `<button class="btn btn-sm btn-ghost" data-action="restore-snap" data-k="${U.escape(k)}">🕰️ ${U.escape(k)}</button>`).join('')}</div>
            </div>` : ''}
            <hr>
            <div class="row between wrap gap">
              <span class="muted small">Zona de perigo</span>
              <button class="btn btn-danger" data-action="reset-all">💣 Apagar todos os dados</button>
            </div>
          </section>

          <section class="card about">
            <h3>ℹ️ Sobre</h3>
            <p class="muted small">TaskUp · organizador pessoal offline. Sem contas, sem servidores, sem rastreamento. Feito com HTML, CSS e JavaScript puro.</p>
            <p class="muted small">Atalhos: <kbd>N</kbd> nova tarefa · <kbd>/</kbd> buscar · <kbd>1</kbd>–<kbd>9</kbd> navegar · <kbd>P</kbd> play/pause Pomodoro · <kbd>T</kbd> tema · <kbd>?</kbd> ajuda · <kbd>Esc</kbd> fechar</p>
            <div class="row gap wrap"><button class="btn btn-sm btn-ghost" data-action="shortcuts">⌨️ Atalhos de teclado</button><button class="btn btn-sm btn-ghost" data-action="show-onboarding">👋 Rever boas-vindas</button></div>
          </section>
        </div>`;

      if (Settings._anchor) {
        const el = view.querySelector('#sec-' + Settings._anchor);
        Settings._anchor = null;
        el && setTimeout(() => el.scrollIntoView({ behavior: 'smooth', block: 'start' }), 80);
      }
    },
  };

  Changes['setting'] = (el) => {
    const key = el.dataset.key;
    let val;
    if (el.type === 'checkbox') val = el.checked;
    else if (el.dataset.type === 'number') {
      val = parseFloat(el.value);
      if (isNaN(val)) return;
      if (el.min !== '') val = Math.max(+el.min, val);
      if (el.max !== '') val = Math.min(+el.max, val);
    } else if (el.dataset.type === 'nullable-number') val = el.value === '' ? null : +el.value;
    else val = el.value;
    Store.update((s) => setPath(s.settings, key, val), { silent: el.type === 'range' || key === 'name' });
    if (key === 'theme') Bus.emit('theme');
    if (key === 'name') Bus.emit('header');
    if (key === 'volume') Sound.play('click');
    if (key.startsWith('pomodoro.')) {
      const p = Store.state.pomodoro;
      if (!p.running && p.remaining === null) window.TU.Pomodoro.tick();
    }
    if (key === 'notifications' && val && Notify.permission() === 'default') Notify.request().then(() => Bus.emit('rerender'));
  };
  Changes['import-file'] = (el) => {
    Backup.importFile(el.files[0]);
    el.value = '';
  };

  Actions['test-sound'] = (el) => Sound.play(el.dataset.s, true);
  Actions['notif-request'] = async () => {
    await Notify.request();
    Bus.emit('rerender');
  };
  Actions['notif-test'] = () => Notify.show('🔔 Teste do TaskUp', 'As notificações estão funcionando!', { tag: 'test', sound: 'reminder' });
  Actions['export-json'] = () => Backup.exportJSON();
  Actions['export-csv'] = () => Backup.exportCSV();
  Actions['restore-snap'] = (el) => Backup.restoreSnapshot(el.dataset.k);
  Actions['reset-all'] = () => Backup.resetAll();
  Actions['show-onboarding'] = () => window.TU.App.onboarding(true);

  window.TU.Settings = Settings;
})();

</script>
  <script>
/* =========================================================
   TaskUp — dashboard.js
   Painel inicial: saudação, resumo do dia, progresso,
   próximas atividades, missões e visão por categoria.
   ========================================================= */
(function () {
  'use strict';

  const { U, Store, Tasks, Game } = window.TU;

  const Dashboard = {
    _motivation: null,

    render(view) {
      const s = Store.state;
      const st = s.settings;
      const today = U.today();
      const g = U.greeting();
      const name = st.name ? `, ${U.escape(st.name.split(' ')[0])}` : '';
      const gameOn = st.gamification;
      if (!Dashboard._motivation) Dashboard._motivation = Game.motivation();

      const todays = s.tasks.filter((t) => t.date === today);
      const done = todays.filter((t) => t.done).length;
      const overdue = s.tasks.filter((t) => Tasks.isOverdue(t));
      const highPending = s.tasks.filter((t) => !t.done && t.priority === 'high' && (!t.date || t.date <= today));
      const pct = todays.length ? Math.round((done / todays.length) * 100) : 0;
      const streak = Game.computeStreak();
      const xpToday = s.game.xpByDate[today] || 0;
      const li = Game.levelInfo();

      const upcoming = Tasks.sortTasks(
        s.tasks.filter((t) => !t.done && (t.date === today || Tasks.isOverdue(t))),
        'date'
      ).slice(0, 6);

      // últimos 7 dias
      const week = [];
      for (let i = 6; i >= 0; i--) {
        const k = U.addDays(today, -i);
        week.push({ k, n: s.game.completedByDate[k] || 0, label: i === 0 ? 'hoje' : U.WEEKDAYS_SHORT[U.parseDateKey(k).getDay()] });
      }
      const maxW = Math.max(1, ...week.map((w) => w.n));

      // categorias com pendências
      const catStats = s.categories
        .map((c) => {
          const list = s.tasks.filter((t) => t.categoryId === c.id && (t.date === today || (!t.done && (!t.date || t.date < today))));
          return { c, total: list.length, done: list.filter((t) => t.done).length };
        })
        .filter((x) => x.total)
        .sort((a, b) => b.total - a.total)
        .slice(0, 6);

      const ringC = 2 * Math.PI * 42;
      const progressMsg =
        !todays.length ? 'Nenhuma tarefa para hoje ainda. Que tal planejar o dia?' : pct === 100 ? 'Dia concluído! Você arrasou! 🏆' : pct >= 50 ? 'Mais da metade! Continue assim! 💪' : done ? 'Bom começo! Vamos em frente! 🚀' : 'Bora começar com a primeira? 🎯';

      view.innerHTML = `
        <section class="hero card">
          <div class="hero-text">
            <p class="kicker">${U.formatDateLong(today)}${gameOn && window.TU.Shop.titleText() ? ` · <span class="user-title">${U.escape(window.TU.Shop.titleText())}</span>` : ''}${gameOn && window.TU.Shop.boostActive() ? ' · <span class="pill pill-live">⚡ XP em dobro</span>' : ''}</p>
            <h1>${g.text}${name}! <span class="wave">${g.emoji}</span></h1>
            <p class="hero-sub">${gameOn && st.motivation ? Dashboard._motivation : 'Vamos fazer acontecer hoje?'}</p>
            <div class="row gap wrap mt">
              <button class="btn btn-primary" data-action="new-task" data-date="${today}">＋ Nova tarefa</button>
              <button class="btn" data-action="go" data-view="routine">🕒 Minha rotina</button>
              <button class="btn" data-action="go" data-view="pomodoro">🍅 Focar agora</button>
            </div>
          </div>
          <div class="hero-mascot" title="Seu mascote">
            <div class="mascot ${pct === 100 && todays.length ? 'happy' : ''}">${gameOn ? st.mascot : '📋'}</div>
            ${gameOn ? `<div class="speech">${pct === 100 && todays.length ? 'Uhuul! 🎉' : overdue.length ? `${overdue.length} atrasada${overdue.length > 1 ? 's' : ''}… bora? 👀` : streak > 1 ? `${streak} dias seguidos! 🔥` : 'Partiu! ✨'}</div>` : ''}
          </div>
        </section>

        <section class="stats">
          <button class="stat-card" data-action="goto-filter" data-status="today">
            <span class="stat-icon" style="--c:#7c5cff">📋</span>
            <strong>${todays.length}</strong><span>tarefas de hoje</span>
          </button>
          <button class="stat-card" data-action="goto-filter" data-status="done">
            <span class="stat-icon" style="--c:#10b981">✅</span>
            <strong>${done}</strong><span>concluídas hoje</span>
          </button>
          <button class="stat-card ${overdue.length ? 'alert' : ''}" data-action="goto-filter" data-status="overdue">
            <span class="stat-icon" style="--c:#ef4444">⏰</span>
            <strong>${overdue.length}</strong><span>atrasadas</span>
          </button>
          <button class="stat-card" data-action="goto-filter" data-status="pending" data-priority="high">
            <span class="stat-icon" style="--c:#f97316">🔴</span>
            <strong>${highPending.length}</strong><span>alta prioridade</span>
          </button>
          ${gameOn && st.streaks ? `<button class="stat-card" data-action="go" data-view="game">
            <span class="stat-icon flame ${streak ? 'on' : ''}" style="--c:#f59e0b">🔥</span>
            <strong>${streak}</strong><span>dia${streak === 1 ? '' : 's'} de sequência</span>
          </button>` : ''}
          ${gameOn && st.showXP ? `<button class="stat-card" data-action="go" data-view="game">
            <span class="stat-icon" style="--c:#eab308">⭐</span>
            <strong>+${xpToday}</strong><span>XP hoje</span>
          </button>` : ''}
        </section>

        <div class="grid dash-grid">
          <section class="card progress-card">
            <div class="card-head"><h3>📈 Progresso do dia</h3></div>
            <div class="progress-wrap">
              <svg viewBox="0 0 100 100" class="ring">
                <circle cx="50" cy="50" r="42" class="ring-track"/>
                <circle cx="50" cy="50" r="42" class="ring-bar" style="stroke-dasharray:${ringC};stroke-dashoffset:${ringC * (1 - pct / 100)}"/>
                <text x="50" y="50" class="ring-text">${pct}%</text>
              </svg>
              <div>
                <p class="big"><strong>${done} de ${todays.length}</strong> tarefas concluídas</p>
                <div class="progress lg"><span style="width:${pct}%"></span></div>
                <p class="muted small mt">${progressMsg}</p>
              </div>
            </div>
            ${gameOn && st.showXP ? `
            <div class="level-strip" data-action="go" data-view="game" role="button" tabindex="0">
              <span class="level-badge">${li.emoji}</span>
              <div class="grow">
                <div class="row between small"><strong>Nível ${li.level} · ${li.title}</strong><span class="muted">${li.current}/${li.needed} XP</span></div>
                <div class="progress sm xp"><span style="width:${li.pct}%"></span></div>
              </div>
              <span class="pill">🪙 ${Math.max(0, s.game.coins)}</span>
            </div>` : ''}
          </section>

          <section class="card next-card">
            <div class="card-head">
              <h3>🎯 Próximas de hoje</h3>
              <button class="link-btn" data-action="go" data-view="tasks">ver todas</button>
            </div>
            <div class="task-list">
              ${upcoming.length ? upcoming.map((t) => Tasks.itemHtml(t, { showDate: t.date !== today, compact: true })).join('') : `
                <div class="empty-state small">
                  <div class="empty-emoji">${todays.length ? '🏖️' : '🌱'}</div>
                  <p class="muted">${todays.length ? 'Tudo feito por hoje. Aproveite!' : 'Sem tarefas pendentes para hoje.'}</p>
                </div>`}
            </div>
            <form class="quick-add mini" data-form="dash-quick">
              <input class="input" name="q" placeholder="Adicionar rapidinho para hoje..." autocomplete="off" aria-label="Adicionar tarefa para hoje">
              <button class="btn btn-primary" type="submit">＋</button>
            </form>
          </section>

          ${gameOn && st.missions ? `<section class="card">
            <div class="card-head"><h3>🎯 Missões do dia</h3><button class="link-btn" data-action="go" data-view="game">conquistas</button></div>
            ${Game.missionsHtml()}
          </section>` : ''}

          <section class="card">
            <div class="card-head"><h3>📊 Últimos 7 dias</h3><span class="muted small">${week.reduce((a, w) => a + w.n, 0)} concluídas</span></div>
            <div class="bars">
              ${week.map((w) => `<div class="bar ${w.k === today ? 'today' : ''}" title="${w.n} tarefas"><span class="bar-n">${w.n || ''}</span><i style="height:${(w.n / maxW) * 100}%"></i><small>${w.label}</small></div>`).join('')}
            </div>
          </section>

          <section class="card">
            <div class="card-head"><h3>🗂️ Por categoria</h3><button class="link-btn" data-action="go" data-view="categories">gerenciar</button></div>
            ${catStats.length ? `<ul class="cat-stats">
              ${catStats.map(({ c, total, done: d }) => `
                <li data-action="open-category" data-id="${c.id}" role="button" tabindex="0">
                  <span class="cat-emoji sm" style="--c:${c.color}">${c.emoji}</span>
                  <div class="grow">
                    <div class="row between small"><span>${U.escape(c.name)}</span><span class="muted">${d}/${total}</span></div>
                    <div class="progress sm" style="--bar:${c.color}"><span style="width:${(d / total) * 100}%;background:${c.color}"></span></div>
                  </div>
                </li>`).join('')}
            </ul>` : '<p class="muted small">Quando houver tarefas para hoje, você verá o progresso de cada área aqui.</p>'}
          </section>
        </div>`;

      const form = view.querySelector('[data-form="dash-quick"]');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = form.q.value.trim();
        if (!v) return;
        form.q.value = '';
        Tasks.quickAdd(v, { date: today });
        setTimeout(() => document.querySelector('[data-form="dash-quick"] input')?.focus(), 30);
      });
    },
  };

  window.TU.Dashboard = Dashboard;
})();

</script>

/* =========================================================
   TaskUp — app.js
   Inicialização, navegação, tema, delegação de eventos,
   atalhos de teclado, onboarding e PWA.
   ========================================================= */
(function () {
  'use strict';

  const TU = window.TU;
  const { U, Bus, Store, UI, Tasks, Game, Pomodoro, Notify, Backup, Sound } = TU;
  const Actions = TU.Actions;
  const Changes = (TU.Changes = TU.Changes || {});

  const VIEWS = {
    dashboard: { title: 'Início', icon: '🏠', mod: () => TU.Dashboard },
    routine: { title: 'Minha Rotina', icon: '🕒', mod: () => TU.Routine },
    tasks: { title: 'Tarefas', icon: '✅', mod: () => TU.Tasks },
    calendar: { title: 'Calendário', icon: '📅', mod: () => TU.Calendar },
    pomodoro: { title: 'Pomodoro', icon: '🍅', mod: () => TU.Pomodoro },
    categories: { title: 'Categorias', icon: '🗂️', mod: () => TU.Categories },
    game: { title: 'Conquistas', icon: '🏆', mod: () => Game },
    shop: { title: 'Loja', icon: '🛍️', mod: () => TU.Shop },
    settings: { title: 'Configurações', icon: '⚙️', mod: () => TU.Settings },
  };
  const NAV_ORDER = Object.keys(VIEWS);

  let current = 'dashboard';
  let rendered = null; // última tela desenhada
  let renderQueued = false;
  let lastDay = U.today();
  let deferredInstall = null;

  const App = {
    VIEWS,

    get current() {
      return current;
    },

    go(view, opts = {}) {
      if (!VIEWS[view]) view = 'dashboard';
      if (view === 'routine' && opts.resetDate) TU.Routine.date = U.today();
      current = view;
      // o endereço (#/tela) é só um bônus: em visualizadores restritos pode ser bloqueado
      try {
        if (location.hash !== '#/' + view) history.pushState(null, '', '#/' + view);
      } catch (_) {}
      App.render(true);
      document.body.classList.remove('menu-open');
    },

    fromHash() {
      const v = (location.hash.match(/^#\/(\w+)/) || [])[1];
      return VIEWS[v] ? v : 'dashboard';
    },

    render(scrollTop = false) {
      const view = document.getElementById('view');
      const changed = rendered !== current;
      rendered = current;
      const keepScroll = !changed && !scrollTop ? window.scrollY : 0;
      const def = VIEWS[current];
      if (changed && current === 'routine') TU.Routine._scrollNow = true;
      view.dataset.view = current;
      // preserva o que o usuário está digitando quando a tela é redesenhada em segundo plano
      const typing = !changed && App.captureFocus(view);
      try {
        def.mod().render(view);
        if (typing) App.restoreFocus(view, typing);
      } catch (e) {
        console.error(e);
        view.innerHTML = `<div class="card empty-state"><div class="empty-emoji">🐛</div><h3>Ops! Algo deu errado.</h3><p class="muted">${U.escape(e.message)}</p></div>`;
      }
      if (changed) {
        view.classList.remove('view-enter');
        void view.offsetWidth;
        view.classList.add('view-enter');
        window.scrollTo(0, 0);
      } else window.scrollTo(0, keepScroll);
      App.renderChrome();
    },

    /** Guarda campo focado (valor, cursor) para restaurar após redesenhar. */
    captureFocus(view) {
      const el = document.activeElement;
      if (!el || !view.contains(el) || !el.matches('input:not([type=checkbox]):not([type=radio]):not([type=file]), textarea')) return null;
      let sel = null;
      if (el.dataset.filter) sel = `[data-filter="${el.dataset.filter}"]`;
      else if (el.form && el.form.dataset.form && el.name) sel = `[data-form="${el.form.dataset.form}"] [name="${el.name}"]`;
      else if (el.id) sel = '#' + CSS.escape(el.id);
      if (!sel) return null;
      let start = null;
      let end = null;
      try {
        start = el.selectionStart;
        end = el.selectionEnd;
      } catch (_) {}
      return { sel, value: el.value, start, end };
    },

    restoreFocus(view, f) {
      const el = view.querySelector(f.sel);
      if (!el) return;
      el.value = f.value;
      el.focus({ preventScroll: true });
      try {
        if (f.start !== null) el.setSelectionRange(f.start, f.end);
      } catch (_) {}
    },

    queueRender() {
      if (renderQueued) return;
      renderQueued = true;
      requestAnimationFrame(() => {
        renderQueued = false;
        App.render();
      });
    },

    /** Cabeçalho, menu lateral e navegação inferior. */
    renderChrome() {
      const s = Store.state;
      const st = s.settings;
      const def = VIEWS[current];
      document.getElementById('page-title').innerHTML = `<span>${def.icon}</span> ${def.title}`;
      const today = U.today();
      const badge = {
        tasks: s.tasks.filter((t) => Tasks.isOverdue(t)).length,
        routine: s.tasks.filter((t) => t.date === today && !t.done && t.time).length,
        game: Game.enabled('missions') ? (Game.ensureMissions(), s.game.missions.list.filter((m) => !m.claimed && m.progress >= (Game.missionDef(m.id)?.target || 1)).length) : 0,
      };
      document.querySelectorAll('[data-nav]').forEach((b) => {
        const v = b.dataset.nav;
        b.classList.toggle('active', v === current);
        b.setAttribute('aria-current', v === current ? 'page' : 'false');
        const bd = b.querySelector('.nav-badge');
        if (bd) {
          const n = badge[v] || 0;
          bd.textContent = n;
          bd.hidden = !n;
          bd.classList.toggle('danger', v === 'tasks');
        }
      });

      // perfil no menu lateral
      const prof = document.getElementById('side-profile');
      if (prof) {
        if (st.gamification) {
          const li = Game.levelInfo();
          const streak = Game.computeStreak();
          prof.hidden = false;
          prof.innerHTML = `
            <div class="sp-top">
              <span class="sp-mascot">${st.mascot}</span>
              <div>
                <strong>${U.escape(st.name || 'Você')}</strong>
                <small>Nv. ${li.level} · ${li.title}</small>
                ${TU.Shop.titleText() ? `<span class="user-title">${U.escape(TU.Shop.titleText())}</span>` : ''}
              </div>
            </div>
            ${st.showXP ? `<div class="progress sm xp"><span style="width:${li.pct}%"></span></div>
            <div class="sp-stats"><span>⭐ ${li.xp} XP</span>${st.streaks ? `<span>🔥 ${streak}</span>` : ''}<span>🪙 ${Math.max(0, s.game.coins)}</span></div>` : ''}`;
        } else prof.hidden = true;
      }
      const xpChip = document.getElementById('xp-chip');
      if (xpChip) {
        xpChip.hidden = !(st.gamification && st.showXP);
        if (!xpChip.hidden) {
          const li = Game.levelInfo();
          xpChip.innerHTML = `<span class="xc-level">${li.level}</span><span class="xc-bar"><i style="width:${li.pct}%"></i></span>`;
          xpChip.title = `Nível ${li.level} · ${li.current}/${li.needed} XP${TU.Shop.boostActive() ? ' · ⚡ XP em dobro ativo' : ''}`;
          xpChip.classList.toggle('boost', TU.Shop.boostActive());
        }
      }
      Pomodoro.tick();
    },

    /* ---------- Tema ---------- */
    applyTheme() {
      const st = Store.state.settings;
      const root = document.documentElement;
      const dark = st.theme === 'dark' || (st.theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches);
      root.dataset.theme = dark ? 'dark' : 'light';
      const a = Game.ACCENTS[st.accent] || Game.ACCENTS.violeta;
      root.style.setProperty('--accent', a.color);
      root.style.setProperty('--accent-2', a.color2);
      root.style.setProperty('--accent-soft', U.hexToRgba(a.color, dark ? 0.22 : 0.12));
      root.classList.toggle('rainbow', !!a.rainbow);
      // fundo comprado na loja (só com a gamificação ligada)
      document.body.dataset.bg = st.gamification ? st.background || 'none' : 'none';
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', dark ? '#0f0f1a' : a.color);
      const tb = document.getElementById('theme-toggle');
      if (tb) tb.textContent = dark ? '☀️' : '🌙';
    },

    /* ---------- Onboarding ---------- */
    onboarding(force = false) {
      const st = Store.state.settings;
      if (st.onboarded && !force) return;
      UI.modal({
        size: 'md',
        className: 'modal-onboarding',
        body: `
          <div class="onb">
            <div class="onb-hero">🐣✨</div>
            <h2>Bem-vindo(a) ao TaskUp!</h2>
            <p class="muted">Seu organizador pessoal divertido: tarefas, rotina, lembretes, Pomodoro e muito XP. Tudo salvo só no seu dispositivo, funcionando offline. 🔒</p>
            <form class="form">
              <label class="field"><span>Como podemos te chamar?</span>
                <input class="input input-lg" name="name" value="${U.escape(st.name)}" placeholder="Seu nome" maxlength="40" autofocus>
              </label>
              <label class="switch-row"><span><strong>🎮 Modo divertido</strong><small class="muted">XP, níveis, conquistas, missões e confetes</small></span>
                <span class="switch"><input type="checkbox" name="game" ${st.gamification ? 'checked' : ''}><i></i></span></label>
              ${!Store.state.tasks.length ? `<label class="switch-row"><span><strong>📋 Começar com exemplos</strong><small class="muted">Cria uma rotina de exemplo para hoje (pode apagar depois)</small></span>
                <span class="switch"><input type="checkbox" name="samples" checked><i></i></span></label>` : ''}
              ${Notify.supported && Notify.permission() === 'default' ? `<button type="button" class="btn btn-block" data-notif>🔔 Permitir lembretes por notificação</button>` : ''}
              <button type="submit" class="btn btn-primary btn-block btn-xl">Começar 🚀</button>
            </form>
          </div>`,
        onMount(el, api) {
          const form = el.querySelector('form');
          const nb = el.querySelector('[data-notif]');
          if (nb)
            nb.onclick = async () => {
              const p = await Notify.request();
              nb.textContent = p === 'granted' ? '✅ Notificações permitidas' : '⛔ Notificações não permitidas';
              nb.disabled = true;
            };
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const samples = form.samples && form.samples.checked;
            Store.update((s) => {
              s.settings.name = form.name.value.trim();
              s.settings.gamification = form.game.checked;
              s.settings.onboarded = true;
            });
            if (samples) App.createSamples();
            api.close();
            if (form.game.checked) Game.celebrate({ big: true });
            Sound.play('levelup');
          });
        },
        onClose() {
          if (!Store.state.settings.onboarded) Store.update((s) => (s.settings.onboarded = true));
        },
      });
    },

    createSamples() {
      const today = U.today();
      const rem = Store.state.settings.defaultReminder;
      const samples = [
        { title: 'Estudar', emoji: '📚', time: '08:00', duration: 60, categoryId: 'cat-escola', priority: 'medium' },
        { title: 'Reunião de equipe', emoji: '💼', time: '09:30', duration: 60, categoryId: 'cat-trabalho', priority: 'high' },
        { title: 'Almoço', emoji: '🍽️', time: '12:00', duration: 60, categoryId: 'cat-pessoal', priority: 'low' },
        {
          title: 'Projeto pessoal',
          emoji: '💻',
          time: '14:00',
          duration: 120,
          categoryId: 'cat-projetos',
          priority: 'medium',
          subtasks: [
            { id: U.uid(), title: 'Definir objetivo', done: false },
            { id: U.uid(), title: 'Rascunhar ideias', done: false },
            { id: U.uid(), title: 'Revisar', done: false },
          ],
        },
        { title: 'Exercício', emoji: '🏃', time: '18:00', duration: 45, categoryId: 'cat-saude', priority: 'medium', recurrence: 'daily' },
        { title: 'Comprar frutas', emoji: '🛒', time: null, categoryId: 'cat-compras', priority: 'low' },
        { title: 'Pagar conta de luz', emoji: '💡', time: null, categoryId: 'cat-financeiro', priority: 'high', dateOffset: 1 },
      ];
      Store.update((s) => {
        samples.forEach((x) => {
          const { dateOffset, ...rest } = x;
          s.tasks.push(Store.normalizeTask({ id: U.uid(), ...rest, date: U.addDays(today, dateOffset || 0), reminder: x.time ? rem : null, createdAt: new Date().toISOString() }));
        });
      });
    },

    /* ---------- Inicialização ---------- */
    init() {
      Store.load();
      App.applyTheme();
      Game.ensureMissions();
      TU.Shop.applyFreezes();

      // links de navegação
      const navHtml = NAV_ORDER.map(
        (k) => `<button class="nav-item" data-nav="${k}" data-action="go" data-view="${k}"><span class="nav-icon">${VIEWS[k].icon}</span><span class="nav-label">${VIEWS[k].title}</span><span class="nav-badge" hidden></span></button>`
      ).join('');
      document.getElementById('side-nav').innerHTML = navHtml;
      document.getElementById('bottom-nav').innerHTML =
        ['dashboard', 'routine', 'tasks', 'calendar', 'pomodoro']
          .map((k) => `<button class="bn-item" data-nav="${k}" data-action="go" data-view="${k}"><span>${VIEWS[k].icon}</span><small>${VIEWS[k].title.replace('Minha ', '')}</small><span class="nav-badge" hidden></span></button>`)
          .join('');

      Bus.on('change', App.queueRender);
      Bus.on('rerender', App.queueRender);
      Bus.on('game', App.queueRender);
      Bus.on('header', App.renderChrome);
      Bus.on('theme', () => {
        App.applyTheme();
        App.queueRender();
      });
      const onHash = () => {
        const v = App.fromHash();
        if (v !== current) {
          current = v;
          App.render(true);
        }
      };
      window.addEventListener('hashchange', onHash);
      window.addEventListener('popstate', onHash);
      current = App.fromHash();
      window.matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', App.applyTheme);

      App.bindEvents();
      App.render(true);

      // laços de atualização
      setInterval(Pomodoro.tick, 500);
      setInterval(App.minuteTick, 30000);
      Notify.start();
      Backup.autoSnapshot();

      // Pomodoro que terminou com o app fechado
      const p = Store.state.pomodoro;
      if (p.running && p.endAt && p.endAt <= Date.now()) Pomodoro.finish(true);

      setTimeout(() => App.onboarding(), 400);
      App.protectData();
      if (Store.recoveredFrom) UI.toast(`Os dados salvos estavam danificados e foram recuperados automaticamente da ${Store.recoveredFrom}.`, { type: 'error', icon: '🛟', duration: 12000 });
      if (!Store.storageOk) UI.toast('Modo de visualização: o armazenamento está bloqueado aqui, então os dados não serão salvos. Baixe o arquivo e abra no navegador para salvar.', { type: 'error', duration: 10000 });
      App.registerSW();
    },

    /** Pede armazenamento persistente e lembra de fazer backup periodicamente. */
    protectData() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persisted().then((p) => p || navigator.storage.persist()).catch(() => {});
        }
      } catch (_) {}
      const st = Store.state.settings;
      if (!Store.storageOk || !st.onboarded || Store.state.tasks.length < 5) return;
      const week = 7 * 86400000;
      const last = st.lastBackup ? new Date(st.lastBackup).getTime() : new Date(Store.state.createdAt).getTime();
      const nag = st.lastBackupNag ? new Date(st.lastBackupNag).getTime() : 0;
      if (Date.now() - last > week && Date.now() - nag > week) {
        Store.update((s) => (s.settings.lastBackupNag = new Date().toISOString()), { silent: true });
        setTimeout(() => UI.toast(st.lastBackup ? 'Faz mais de uma semana desde o último backup.' : 'Que tal fazer um backup dos seus dados?', { icon: '💾', duration: 12000, action: { label: 'Fazer backup', fn: () => Backup.exportJSON() } }), 3000);
      }
    },

    showShortcuts() {
      const rows = [
        ['N', 'Nova tarefa'],
        ['/', 'Buscar tarefas'],
        ['1 – 9', 'Ir para Início, Rotina, Tarefas, Calendário, Pomodoro, Categorias, Conquistas, Loja, Configurações'],
        ['P', 'Iniciar / pausar o Pomodoro'],
        ['T', 'Alternar tema claro / escuro'],
        ['?', 'Mostrar esta ajuda'],
        ['Esc', 'Fechar janelas'],
        ['Enter', 'Salvar formulários / adicionar rapidamente'],
      ];
      UI.modal({
        title: '⌨️ Atalhos de teclado',
        size: 'sm',
        body: `<table class="shortcuts">${rows.map(([k, d]) => `<tr><td><kbd>${k}</kbd></td><td>${d}</td></tr>`).join('')}</table>`,
      });
    },

    minuteTick() {
      const today = U.today();
      if (today !== lastDay) {
        if (TU.Routine.date === lastDay) TU.Routine.date = today;
        if (TU.Calendar.selected === lastDay) {
          TU.Calendar.selected = today;
          TU.Calendar.month = today.slice(0, 8) + '01';
        }
        lastDay = today;
        TU.Dashboard._motivation = null;
        Game.ensureMissions();
        TU.Shop.applyFreezes();
        Backup.autoSnapshot();
        App.queueRender();
        return;
      }
      // atualiza indicadores de horário sem atrapalhar o usuário
      const busy = document.querySelector('.modal-backdrop') || ['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName);
      if (!busy && ['routine', 'dashboard', 'tasks'].includes(current) && document.visibilityState === 'visible') App.render();
    },

    bindEvents() {
      // Formulários: dispara "submit" manualmente. Alguns visualizadores
      // (iframes restritos) bloqueiam o envio nativo de formulários.
      const fakeSubmit = (form) => {
        if (form.closest('.modal-backdrop.closing')) return; // janela já fechando
        const now = Date.now();
        if (form._lastSubmit && now - form._lastSubmit < 400) return; // clique duplo
        form._lastSubmit = now;
        form.dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      };
      document.addEventListener('click', (e) => {
        const btn = e.target.closest('button[type="submit"], input[type="submit"]');
        if (!btn || !btn.form || btn.disabled) return;
        e.preventDefault();
        fakeSubmit(btn.form);
      });
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.defaultPrevented || e.isComposing) return;
        const el = e.target;
        if (!el.form || el.tagName !== 'INPUT' || ['checkbox', 'radio', 'button', 'submit', 'file'].includes(el.type)) return;
        e.preventDefault();
        fakeSubmit(el.form);
      });

      // cliques com data-action
      document.addEventListener('click', (e) => {
        const el = e.target.closest('[data-action]');
        if (!el || el.disabled) return;
        const fn = Actions[el.dataset.action];
        if (fn) {
          e.preventDefault();
          fn(el, e);
        }
      });
      // Enter/Espaço em elementos role=button
      document.addEventListener('keydown', (e) => {
        if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-action]')) {
          e.preventDefault();
          e.target.click();
        }
      });
      // mudanças com data-change
      document.addEventListener('change', (e) => {
        const el = e.target.closest('[data-change]');
        if (!el) return;
        const fn = Changes[el.dataset.change];
        fn && fn(el, e);
      });
      document.addEventListener('input', (e) => {
        if (e.target.matches('input[type=range][data-change]')) Changes[e.target.dataset.change]?.(e.target, e);
      });

      // atalhos de teclado
      document.addEventListener('keydown', (e) => {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        const tag = document.activeElement?.tagName;
        if (['INPUT', 'TEXTAREA', 'SELECT'].includes(tag) || document.activeElement?.isContentEditable) return;
        if (document.querySelector('.modal-backdrop')) return;
        const k = e.key.toLowerCase();
        if (k === 'n') {
          e.preventDefault();
          Tasks.openForm({ defaults: current === 'routine' ? { date: TU.Routine.date, time: U.nextRoundHour() } : current === 'calendar' ? { date: TU.Calendar.selected } : {} });
        } else if (k === '/') {
          e.preventDefault();
          if (current !== 'tasks') App.go('tasks');
          setTimeout(() => document.querySelector('[data-filter="q"]')?.focus(), 60);
        } else if (k === 'p') {
          Pomodoro.toggle();
        } else if (e.key === '?') {
          e.preventDefault();
          App.showShortcuts();
        } else if (k === 't') {
          Actions['theme-toggle']();
        } else if (/^[1-9]$/.test(k)) {
          App.go(NAV_ORDER[+k - 1]);
        }
      });

      // menu mobile
      document.getElementById('menu-btn').addEventListener('click', () => document.body.classList.toggle('menu-open'));
      document.getElementById('scrim').addEventListener('click', () => document.body.classList.remove('menu-open'));

      // instalação PWA
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredInstall = e;
        document.getElementById('install-btn').hidden = false;
      });
      window.addEventListener('appinstalled', () => {
        document.getElementById('install-btn').hidden = true;
        UI.toast('TaskUp instalado! 🎉', { type: 'success' });
      });
    },

    registerSW() {
      if (!('serviceWorker' in navigator) || !/^https?:$/.test(location.protocol)) return;
      navigator.serviceWorker
        .register('service-worker.js')
        .then((reg) => {
          reg.addEventListener('updatefound', () => {
            const nw = reg.installing;
            nw &&
              nw.addEventListener('statechange', () => {
                if (nw.state === 'installed' && navigator.serviceWorker.controller) {
                  UI.toast('Nova versão disponível!', { icon: '✨', duration: 10000, action: { label: 'Atualizar', fn: () => location.reload() } });
                }
              });
          });
        })
        .catch((e) => console.warn('SW não registrado', e));
      navigator.serviceWorker.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'navigate') App.go(e.data.view);
      });
    },
  };

  /* ---------- Ações gerais ---------- */
  Actions['go'] = (el) => {
    if (el.dataset.anchor) TU.Settings._anchor = el.dataset.anchor;
    App.go(el.dataset.view, { resetDate: el.dataset.view === 'routine' && el.dataset.nav !== undefined });
  };
  Actions['goto-filter'] = (el) => {
    Object.assign(Tasks.filters, { status: el.dataset.status, priority: el.dataset.priority || 'all', category: 'all', q: '' });
    App.go('tasks');
  };
  Actions['shortcuts'] = () => App.showShortcuts();
  Actions['claim-mission'] = (el) => Game.claimMission(el.dataset.id);
  Actions['claim-weekly'] = () => Game.claimWeekly();
  Actions['enable-game'] = () => {
    Store.update((s) => (s.settings.gamification = true));
    Game.celebrate({ big: true });
  };
  Actions['theme-toggle'] = () => {
    const dark = document.documentElement.dataset.theme === 'dark';
    Store.update((s) => (s.settings.theme = dark ? 'light' : 'dark'));
    App.applyTheme();
  };
  Actions['quick-new'] = () =>
    Tasks.openForm({ defaults: current === 'routine' ? { date: TU.Routine.date, time: U.nextRoundHour() } : current === 'calendar' ? { date: TU.Calendar.selected } : {} });
  Actions['install'] = async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt();
    await deferredInstall.userChoice;
    deferredInstall = null;
    document.getElementById('install-btn').hidden = true;
  };

  TU.App = App;
  document.addEventListener('DOMContentLoaded', App.init);
})();

</script>
</body>
</html>
