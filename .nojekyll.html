            if (form.time.value && form.reminder.value === '') form.reminder.value = String(s.settings.defaultReminder ?? '');
            if (form.time.value && !form.date.value) form.date.value = U.today();
          });
          el.querySelector('[data-cancel]').onclick = () => api.close();
          const del = el.querySelector('[data-del]');
          if (del) {
            del.onclick = async () => {
              const ok = await UI.confirm({ title: 'Excluir tarefa?', text: U.escape(editing.title), okText: 'Excluir', danger: true, icon: '🗑️' });
              if (ok) {
                api.close();
                Tasks.remove(editing.id);
              }
            };
          }

          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const d = UI.formData(form);
            if (!d.title) return form.title.focus();
            const data = {
              title: d.title,
              emoji: d.emoji || '',
              priority: d.priority || 'medium',
              categoryId: d.categoryId,
              recurrence: d.recurrence,
              date: d.date || null,
              time: d.time || null,
              duration: +d.duration || 30,
              reminder: d.reminder === '' ? null : +d.reminder,
              notes: d.notes || '',
              subtasks: subtasks.filter((x) => x.title.trim()),
            };
            if (data.recurrence !== 'none' && !data.date) data.date = U.today();
            if (editing) {
              // subtarefas marcadas/desmarcadas pelo formulário também contam (XP e missão)
              if (!editing.done) {
                let delta = 0;
                data.subtasks.forEach((st) => {
                  const old = editing.subtasks.find((o) => o.id === st.id);
                  delta += (st.done ? 1 : 0) - (old && old.done ? 1 : 0);
                });
                editing.subtasks.forEach((o) => o.done && !data.subtasks.some((n) => n.id === o.id) && delta--);
                if (delta) Store.update((st) => Game.onSubtaskCompleted(st, delta), { silent: true });
              }
              Tasks.update(editing.id, data);
              UI.toast('Tarefa atualizada', { type: 'success', duration: 1800 });
            } else {
              Tasks.create(data);
              Sound.play('click');
              UI.toast(`Tarefa criada: ${data.title}`, { type: 'success', icon: '📝', duration: 2200 });
            }
            api.close();
          });
        },
      });
      return m;
    },

    openMenu(id, anchor) {
      const t = Tasks.get(id);
      if (!t) return;
      document.querySelectorAll('.popover').forEach((p) => p.remove());
      const pop = document.createElement('div');
      pop.className = 'popover';
      pop.innerHTML = `
        <button data-m="edit">✏️ Editar</button>
        ${!t.done ? '<button data-m="pomo">🍅 Iniciar Pomodoro</button>' : ''}
        <button data-m="today">📅 Mover para hoje</button>
        <button data-m="tomorrow">➡️ Adiar para amanhã</button>
        <button data-m="dup">📄 Duplicar</button>
        <button data-m="del" class="danger">🗑️ Excluir</button>`;
      document.body.appendChild(pop);
      const r = anchor.getBoundingClientRect();
      const pw = 210;
      pop.style.top = Math.min(r.bottom + 6, innerHeight - pop.offsetHeight - 10) + 'px';
      pop.style.left = Math.max(10, Math.min(r.right - pw, innerWidth - pw - 10)) + 'px';
      const close = () => {
        pop.remove();
        document.removeEventListener('mousedown', outside, true);
      };
      const outside = (e) => !pop.contains(e.target) && close();
      setTimeout(() => document.addEventListener('mousedown', outside, true));
      pop.addEventListener('click', (e) => {
        const b = e.target.closest('[data-m]');
        if (!b) return;
        close();
        const a = b.dataset.m;
        if (a === 'edit') Tasks.openForm({ id });
        if (a === 'pomo') window.TU.Pomodoro.startForTask(id);
        if (a === 'today') Tasks.update(id, { date: U.today() });
        if (a === 'tomorrow') {
          Tasks.update(id, { date: U.addDays(t.date && t.date > U.today() ? t.date : U.today(), 1) });
          UI.toast('Adiada para amanhã', { icon: '➡️', duration: 1800 });
        }
        if (a === 'dup') Tasks.duplicate(id);
        if (a === 'del') Tasks.remove(id);
      });
    },

    /* ---------------- Tela "Tarefas" ---------------- */
    render(view) {
      const s = Store.state;
      const f = Tasks.filters;
      const today = U.today();
      const q = U.normalize(f.q);

      let list = s.tasks.filter((t) => {
        if (f.category !== 'all' && t.categoryId !== f.category) return false;
        if (f.priority !== 'all' && t.priority !== f.priority) return false;
        if (q && !U.normalize(t.title + ' ' + t.notes + ' ' + t.subtasks.map((x) => x.title).join(' ')).includes(q)) return false;
        switch (f.status) {
          case 'pending':
            return !t.done;
          case 'today':
            return t.date === today;
          case 'upcoming':
            return !t.done && t.date && t.date > today;
          case 'overdue':
            return isOverdue(t);
          case 'done':
            return t.done;
          case 'nodate':
            return !t.date;
          default:
            return true;
        }
      });
      list = sortTasks(list, f.sort);

      const counts = {
        all: s.tasks.length,
        pending: s.tasks.filter((t) => !t.done).length,
        today: s.tasks.filter((t) => t.date === today).length,
        upcoming: s.tasks.filter((t) => !t.done && t.date && t.date > today).length,
        overdue: s.tasks.filter((t) => isOverdue(t)).length,
        nodate: s.tasks.filter((t) => !t.date).length,
        done: s.tasks.filter((t) => t.done).length,
      };
      const statusLabels = { pending: 'Pendentes', today: 'Hoje', upcoming: 'Próximas', overdue: 'Atrasadas', nodate: 'Sem data', done: 'Concluídas', all: 'Todas' };

      // agrupamento
      let groupsHtml = '';
      if (!list.length) {
        groupsHtml = `<div class="empty-state">
          <div class="empty-emoji">${f.status === 'overdue' ? '🎉' : '🪴'}</div>
          <h3>${f.status === 'overdue' ? 'Nada atrasado!' : q ? 'Nada encontrado' : 'Nenhuma tarefa aqui'}</h3>
          <p class="muted">${q ? 'Tente outra busca ou limpe os filtros.' : 'Use a barra acima para adicionar algo rapidinho.'}</p>
        </div>`;
      } else if (f.sort === 'date' && !['done'].includes(f.status)) {
        const groups = [
          ['⚠️ Atrasadas', (t) => isOverdue(t)],
          ['☀️ Hoje', (t) => t.date === today],
          ['🌤️ Amanhã', (t) => t.date === U.addDays(today, 1)],
          ['📆 Próximos dias', (t) => t.date && t.date > U.addDays(today, 1)],
          ['📭 Sem data', (t) => !t.date],
          ['🕰️ Anteriores', () => true],
        ];
        const used = new Set();
        groups.forEach(([label, fn]) => {
          const items = list.filter((t) => !used.has(t.id) && fn(t));
          items.forEach((t) => used.add(t.id));
          if (items.length) {
            const extra = label.includes('Atrasadas') && items.length > 1 ? '<button class="link-btn" data-action="reschedule-overdue">➡️ mover todas para hoje</button>' : '';
            groupsHtml += `<section class="task-group"><h4 class="group-title">${label} <span class="count">${items.length}</span>${extra}</h4>
              <div class="task-list">${items.map((t) => Tasks.itemHtml(t, { showDate: !label.includes('Hoje') })).join('')}</div></section>`;
          }
        });
      } else if (f.sort === 'category') {
        s.categories.forEach((c) => {
          const items = list.filter((t) => t.categoryId === c.id);
          if (items.length)
            groupsHtml += `<section class="task-group"><h4 class="group-title">${c.emoji} ${U.escape(c.name)} <span class="count">${items.length}</span></h4>
              <div class="task-list">${items.map((t) => Tasks.itemHtml(t)).join('')}</div></section>`;
        });
      } else {
        groupsHtml = `<div class="task-list">${list.map((t) => Tasks.itemHtml(t)).join('')}</div>`;
      }

      view.innerHTML = `
        <div class="card quick-add-card">
          <form class="quick-add" data-form="quick-add">
            <span class="qa-icon">✨</span>
            <input class="input" name="q" placeholder='Ex.: "Pagar conta amanhã 10h #financeiro !alta"' autocomplete="off" aria-label="Adicionar tarefa rápida">
            <button class="btn btn-primary" type="submit">Adicionar</button>
            <button class="btn" type="button" data-action="new-task" title="Formulário completo">⚙️ Detalhes</button>
          </form>
          <p class="muted small qa-hint">Dica: use <code>hoje</code>, <code>amanhã</code>, <code>sexta</code>, <code>25/12</code>, <code>14h</code>, <code>#categoria</code> e <code>!alta</code> / <code>!baixa</code>.</p>
        </div>

        <div class="filters">
          <div class="chips-scroll">
            ${Object.keys(statusLabels)
              .map((k) => `<button class="filter-chip ${f.status === k ? 'active' : ''}" data-action="filter-status" data-v="${k}">${statusLabels[k]} <span>${counts[k]}</span></button>`)
              .join('')}
          </div>
          <div class="filters-row">
            <div class="search">
              <span>🔎</span>
              <input type="search" class="input" data-filter="q" placeholder="Buscar tarefas..." value="${U.escape(f.q)}">
            </div>
            <select class="input" data-filter="category" aria-label="Categoria">
              <option value="all">Todas as categorias</option>
              ${s.categories.map((c) => `<option value="${c.id}" ${f.category === c.id ? 'selected' : ''}>${c.emoji} ${U.escape(c.name)}</option>`).join('')}
            </select>
            <select class="input" data-filter="priority" aria-label="Prioridade">
              <option value="all">Qualquer prioridade</option>
              ${Object.entries(PRIORITIES).map(([k, p]) => `<option value="${k}" ${f.priority === k ? 'selected' : ''}>${p.emoji} ${p.label}</option>`).join('')}
            </select>
            <select class="input" data-filter="sort" aria-label="Ordenar">
              <option value="date" ${f.sort === 'date' ? 'selected' : ''}>Ordenar: data</option>
              <option value="priority" ${f.sort === 'priority' ? 'selected' : ''}>Ordenar: prioridade</option>
              <option value="category" ${f.sort === 'category' ? 'selected' : ''}>Agrupar: categoria</option>
              <option value="created" ${f.sort === 'created' ? 'selected' : ''}>Ordenar: mais recentes</option>
              <option value="title" ${f.sort === 'title' ? 'selected' : ''}>Ordenar: A–Z</option>
            </select>
            ${f.category !== 'all' || f.priority !== 'all' || f.q ? '<button class="btn btn-ghost" data-action="clear-filters">Limpar filtros</button>' : ''}
          </div>
        </div>

        <div class="tasks-wrap">${groupsHtml}</div>
        ${f.status === 'done' && counts.done ? '<div class="center mt"><button class="btn btn-ghost danger" data-action="clear-done">🧹 Apagar todas as concluídas</button></div>' : ''}
      `;

      const qa = view.querySelector('[data-form="quick-add"]');
      qa.addEventListener('submit', (e) => {
        e.preventDefault();
        const v = qa.q.value.trim();
        if (!v) return;
        qa.q.value = '';
        Tasks.quickAdd(v, { categoryId: f.category !== 'all' ? f.category : undefined });
        setTimeout(() => {
          const inp = document.querySelector('[data-form="quick-add"] input');
          inp && inp.focus();
        }, 30);
      });
      view.querySelectorAll('[data-filter]').forEach((el) => {
        const key = el.dataset.filter;
        const handler = () => {
          f[key] = el.value;
          if (key === 'q') {
            Tasks.renderListOnly(view);
          } else Bus.emit('rerender');
        };
        el.addEventListener(key === 'q' ? 'input' : 'change', key === 'q' ? U.debounce(handler, 180) : handler);
      });
    },

    /** Re-renderiza preservando o foco no campo de busca. */
    renderListOnly(view) {
      const pos = view.querySelector('[data-filter="q"]')?.selectionStart;
      Tasks.render(view);
      const inp = view.querySelector('[data-filter="q"]');
      if (inp) {
        inp.focus();
        try {
          inp.setSelectionRange(pos, pos);
        } catch (_) {}
      }
    },
  };

  /* ---------------- Ações (delegação global) ---------------- */
  Actions['toggle-task'] = (el) => {
    const r = el.getBoundingClientRect();
    el.closest('.task-item')?.classList.add('just-toggled');
    Tasks.toggle(el.dataset.id, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
  };
  Actions['edit-task'] = (el) => Tasks.openForm({ id: el.dataset.id });
  Actions['new-task'] = (el) => {
    const d = {};
    if (el.dataset.date) d.date = el.dataset.date;
    if (el.dataset.time) d.time = el.dataset.time;
    if (el.dataset.category) d.categoryId = el.dataset.category;
    Tasks.openForm({ defaults: d });
  };
  Actions['task-menu'] = (el) => Tasks.openMenu(el.dataset.id, el);
  Actions['delete-task'] = (el) => Tasks.remove(el.dataset.id);
  Actions['toggle-sub'] = (el) => Tasks.toggleSubtask(el.dataset.task, el.dataset.sub);
  Actions['filter-status'] = (el) => {
    Tasks.filters.status = el.dataset.v;
    Bus.emit('rerender');
  };
  Actions['clear-filters'] = () => {
    Object.assign(Tasks.filters, { category: 'all', priority: 'all', q: '' });
    Bus.emit('rerender');
  };
  Actions['reschedule-overdue'] = async () => {
    const today = U.today();
    const list = Store.state.tasks.filter((t) => isOverdue(t) && t.date < today);
    const late = Store.state.tasks.filter((t) => isOverdue(t)).length;
    if (!list.length) {
      UI.toast(late ? 'As atrasadas já são de hoje — ajuste o horário delas na rotina.' : 'Nada atrasado! 🎉', { icon: '👌' });
      return;
    }
    const ok = await UI.confirm({ title: `Mover ${list.length} tarefa${list.length > 1 ? 's' : ''} para hoje?`, text: 'Os horários são mantidos.', okText: 'Mover', icon: '➡️' });
    if (!ok) return;
    const ids = new Set(list.map((t) => t.id));
    Store.update((s) => s.tasks.forEach((t) => ids.has(t.id) && (t.date = today)));
    UI.toast('Tarefas reagendadas para hoje', { type: 'success', icon: '📅' });
  };
  Actions['clear-done'] = async () => {
    const n = Store.state.tasks.filter((t) => t.done).length;
    const ok = await UI.confirm({ title: `Apagar ${n} tarefas concluídas?`, text: 'Seu XP e histórico continuam salvos.', okText: 'Apagar', danger: true, icon: '🧹' });
    if (ok) Store.update((s) => (s.tasks = s.tasks.filter((t) => !t.done)));
  };

  window.TU.Tasks = Tasks;
})();

</script>
  <script>
/* =========================================================
   TaskUp — routine.js
   "Minha Rotina": linha do tempo das atividades do dia.
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, UI, Tasks } = window.TU;
  const Actions = window.TU.Actions;

  const TEMPLATES = [
    { emoji: '📚', title: 'Estudar', time: '08:00', duration: 60, categoryId: 'cat-escola' },
    { emoji: '💼', title: 'Reunião', time: '09:30', duration: 60, categoryId: 'cat-trabalho' },
    { emoji: '🍽️', title: 'Almoço', time: '12:00', duration: 60, categoryId: 'cat-pessoal' },
    { emoji: '💻', title: 'Projeto', time: '14:00', duration: 120, categoryId: 'cat-projetos' },
    { emoji: '🏃', title: 'Exercício', time: '18:00', duration: 45, categoryId: 'cat-saude' },
    { emoji: '💧', title: 'Beber água', time: '10:00', duration: 5, categoryId: 'cat-saude' },
    { emoji: '🧘', title: 'Meditar', time: '07:00', duration: 10, categoryId: 'cat-saude' },
    { emoji: '📖', title: 'Leitura', time: '21:00', duration: 30, categoryId: 'cat-pessoal' },
    { emoji: '😴', title: 'Dormir', time: '23:00', duration: 5, categoryId: 'cat-pessoal' },
  ];

  const Routine = {
    date: null,

    render(view) {
      const s = Store.state;
      const date = (Routine.date = Routine.date || U.today());
      const isToday = date === U.today();
      const all = Tasks.forDate(date);
      const timed = all.filter((t) => t.time).sort((a, b) => a.time.localeCompare(b.time));
      const untimed = Tasks.sortTasks(all.filter((t) => !t.time), 'priority');
      const st = Tasks.dayStats(date);
      const now = U.nowMinutes();

      let rows = '';
      let nowPlaced = !isToday;
      const nowLine = `<div class="tl-now" id="tl-now"><span>${U.nowTime()}</span><i></i><b>agora</b></div>`;
      let prevEnd = null;

      timed.forEach((t) => {
        const start = U.timeToMinutes(t.time);
        const end = start + (+t.duration || 0);
        if (!nowPlaced && now < start) {
          rows += nowLine;
          nowPlaced = true;
        }
        // intervalo livre entre atividades
        if (prevEnd !== null && start - prevEnd >= 60) {
          rows += `<button class="tl-gap" data-action="new-task" data-date="${date}" data-time="${U.minutesToTime(prevEnd)}">☕ ${U.formatDuration(start - prevEnd)} livres — adicionar algo?</button>`;
        }
        const conflict = !t.done && prevEnd !== null && start < prevEnd;
        prevEnd = Math.max(prevEnd || 0, end);

        const cat = Store.category(t.categoryId);
        const current = isToday && !t.done && now >= start && now < Math.max(end, start + 1);
        const past = isToday && !t.done && now >= end;
        rows += `
          <div class="tl-item ${t.done ? 'done' : ''} ${current ? 'current' : ''} ${past ? 'late' : ''}" style="--cat:${cat.color}" data-id="${t.id}">
            <div class="tl-time">
              <button class="time-label" data-action="edit-time" data-id="${t.id}" title="Alterar horário">${t.time}</button>
              ${t.duration ? `<span class="tl-end">até ${U.minutesToTime(end)}</span>` : ''}
            </div>
            <div class="tl-dot"><span>${t.emoji || cat.emoji}</span></div>
            <div class="tl-card">
              <div class="tl-main" data-action="edit-task" data-id="${t.id}" role="button" tabindex="0">
                <div class="tl-title">${U.escape(t.title)} ${current ? '<span class="pill pill-live">● Agora</span>' : ''}${past ? '<span class="pill pill-danger">Atrasada</span>' : ''}${conflict ? '<span class="pill pill-warn" title="Começa antes de a atividade anterior terminar">⚠️ Conflito</span>' : ''}</div>
                <div class="tl-meta">
                  <span class="chip" style="--c:${cat.color}">${cat.emoji} ${U.escape(cat.name)}</span>
                  ${t.duration ? `<span class="meta">⏱️ ${U.formatDuration(+t.duration)}</span>` : ''}
                  ${t.subtasks.length ? `<span class="meta">🧩 ${t.subtasks.filter((x) => x.done).length}/${t.subtasks.length}</span>` : ''}
                  ${t.recurrence !== 'none' ? '<span class="meta">🔁</span>' : ''}
                  ${t.pomodoros ? `<span class="meta">🍅 ${t.pomodoros}</span>` : ''}
                </div>
              </div>
              <div class="tl-actions">
                <button class="btn btn-sm ${t.done ? '' : 'btn-success'}" data-action="toggle-task" data-id="${t.id}">${t.done ? '↩️ Desfazer' : '✓ Concluir'}</button>
                ${!t.done ? `<button class="btn btn-sm" data-action="pomo-task" data-id="${t.id}">🍅 Pomodoro</button>` : ''}
                <button class="icon-btn" data-action="task-menu" data-id="${t.id}" title="Mais opções">⋯</button>
              </div>
            </div>
          </div>`;
      });
      if (!nowPlaced) rows += nowLine;

      view.innerHTML = `
        <div class="routine-head card">
          <div class="date-nav">
            <button class="icon-btn" data-action="routine-day" data-d="-1" aria-label="Dia anterior">‹</button>
            <div class="date-nav-label">
              <strong>${isToday ? 'Hoje' : U.formatDateHuman(date)}</strong>
              <span class="muted small">${U.formatDateLong(date)}</span>
            </div>
            <button class="icon-btn" data-action="routine-day" data-d="1" aria-label="Próximo dia">›</button>
            ${!isToday ? '<button class="btn btn-sm" data-action="routine-day" data-d="0">Hoje</button>' : ''}
            <input type="date" class="input input-sm" value="${date}" data-change="routine-date" aria-label="Escolher data">
          </div>
          <div class="routine-progress">
            <div class="row between"><span>${st.done} de ${st.total} atividades concluídas</span><strong>${st.pct}%</strong></div>
            <div class="progress"><span style="width:${st.pct}%"></span></div>
          </div>
          <button class="btn btn-primary" data-action="new-task" data-date="${date}" data-time="${isToday ? U.nextRoundHour() : '08:00'}">＋ Adicionar à rotina</button>
        </div>

        <div class="grid routine-grid">
          <div class="card timeline-card">
            <div class="card-head"><h3>🕒 Linha do tempo</h3><span class="muted small">${timed.length} com horário</span></div>
            ${timed.length ? `<div class="timeline">${rows}</div>` : `
              <div class="empty-state">
                <div class="empty-emoji">🗓️</div>
                <h3>Sua rotina está vazia</h3>
                <p class="muted">Crie atividades com horário ou use um dos modelos rápidos ao lado.</p>
              </div>`}
          </div>

          <div class="routine-side">
            <div class="card">
              <div class="card-head"><h3>📥 Sem horário</h3><span class="muted small">${untimed.length}</span></div>
              ${untimed.length ? `<div class="untimed">
                ${untimed.map((t) => {
                  const cat = Store.category(t.categoryId);
                  return `<div class="untimed-item ${t.done ? 'done' : ''}" style="--cat:${cat.color}">
                    <button class="check sm" data-action="toggle-task" data-id="${t.id}" aria-label="Concluir"><svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
                    <span class="untimed-title" data-action="edit-task" data-id="${t.id}">${t.emoji || cat.emoji} ${U.escape(t.title)}</span>
                    <input type="time" class="time-input sm" data-change="routine-time" data-id="${t.id}" title="Definir horário" aria-label="Definir horário">
                  </div>`;
                }).join('')}
              </div><p class="muted small">Defina um horário para colocar na linha do tempo.</p>` : '<p class="muted small">Tudo com horário definido. 👌</p>'}
            </div>

            <div class="card">
              <div class="card-head"><h3>⚡ Modelos rápidos</h3></div>
              <p class="muted small">Toque para adicionar em ${isToday ? 'hoje' : U.formatDateHuman(date).toLowerCase()}. Segure Shift para repetir todo dia.</p>
              <div class="templates">
                ${TEMPLATES.map((tp, i) => `<button class="template" data-action="routine-template" data-i="${i}">${tp.emoji} ${tp.title} <span>${tp.time}</span></button>`).join('')}
              </div>
            </div>
          </div>
        </div>`;

      // rola até "agora"
      if (isToday && Routine._scrollNow) {
        Routine._scrollNow = false;
        const n = view.querySelector('#tl-now');
        n && setTimeout(() => n.scrollIntoView({ block: 'center', behavior: 'smooth' }), 120);
      }
    },
  };

  Actions['routine-day'] = (el) => {
    const d = +el.dataset.d;
    Routine.date = d === 0 ? U.today() : U.addDays(Routine.date || U.today(), d);
    Bus.emit('rerender');
  };
  Actions['routine-template'] = (el, e) => {
    const tp = TEMPLATES[+el.dataset.i];
    const date = Routine.date || U.today();
    const catId = Store.state.categories.some((c) => c.id === tp.categoryId) ? tp.categoryId : 'cat-outros';
    Tasks.create({
      title: tp.title,
      emoji: tp.emoji,
      time: tp.time,
      duration: tp.duration,
      categoryId: catId,
      date,
      reminder: Store.state.settings.defaultReminder,
      recurrence: e && e.shiftKey ? 'daily' : 'none',
    });
    UI.toast(`${tp.emoji} ${tp.title} às ${tp.time} adicionado${e && e.shiftKey ? ' (todo dia)' : ''}`, { type: 'success', duration: 2000 });
  };

  Actions['edit-time'] = (el) => {
    const t = Tasks.get(el.dataset.id);
    if (!t) return;
    const inp = document.createElement('input');
    inp.type = 'time';
    inp.className = 'time-input';
    inp.value = t.time || '';
    inp.setAttribute('aria-label', 'Alterar horário');
    el.replaceWith(inp);
    inp.focus();
    try {
      inp.showPicker && inp.showPicker();
    } catch (_) {}
    let saved = false;
    inp.addEventListener('change', () => {
      if (!inp.value || inp.value === t.time) return;
      saved = true;
      Tasks.update(t.id, { time: inp.value });
      UI.toast(`Horário alterado para ${inp.value}`, { icon: '🕒', duration: 1600 });
    });
    inp.addEventListener('keydown', (e) => e.key === 'Enter' && inp.blur());
    inp.addEventListener('blur', () => !saved && Bus.emit('rerender'));
  };

  window.TU.Changes = window.TU.Changes || {};
  window.TU.Changes['routine-time'] = (el) => {
    if (!el.value) return;
    Tasks.update(el.dataset.id, { time: el.value });
    UI.toast(`Horário alterado para ${el.value}`, { icon: '🕒', duration: 1600 });
  };
  window.TU.Changes['routine-date'] = (el) => {
    if (!el.value) return;
    Routine.date = el.value;
    Bus.emit('rerender');
  };

  window.TU.Routine = Routine;
})();

</script>
  <script>
/* =========================================================
   TaskUp — calendar.js
   Calendário mensal com tarefas por dia.
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, Tasks } = window.TU;
  const Actions = window.TU.Actions;

  const Calendar = {
    month: null, // 'YYYY-MM-01'
    selected: null,

    render(view) {
      const s = Store.state;
      const today = U.today();
      Calendar.selected = Calendar.selected || today;
      Calendar.month = Calendar.month || Calendar.selected.slice(0, 8) + '01';

      const first = U.parseDateKey(Calendar.month);
      const y = first.getFullYear();
      const m = first.getMonth();
      const offset = (first.getDay() + 6) % 7; // semana começa na segunda
      const gridStart = U.addDays(Calendar.month, -offset);
      const daysInMonth = new Date(y, m + 1, 0).getDate();
      const weeks = Math.ceil((offset + daysInMonth) / 7);

      // indexa tarefas por data
      const byDate = {};
      s.tasks.forEach((t) => {
        if (t.date) (byDate[t.date] = byDate[t.date] || []).push(t);
      });

      let cells = '';
      for (let i = 0; i < weeks * 7; i++) {
        const key = U.addDays(gridStart, i);
        const d = U.parseDateKey(key);
        const list = byDate[key] || [];
        const pending = list.filter((t) => !t.done);
        const allDone = list.length && !pending.length;
        const overdue = list.some((t) => Tasks.isOverdue(t));
        const dots = list
          .slice(0, 4)
          .map((t) => `<i style="background:${Store.category(t.categoryId).color}" class="${t.done ? 'faded' : ''}"></i>`)
          .join('');
        cells += `
          <button class="cal-cell ${d.getMonth() !== m ? 'other' : ''} ${key === today ? 'today' : ''} ${key === Calendar.selected ? 'selected' : ''} ${overdue ? 'has-overdue' : ''} ${allDone ? 'all-done' : ''}"
            data-action="cal-select" data-date="${key}" aria-label="${U.formatDateLong(key)}, ${list.length} tarefas">
            <span class="cal-num">${d.getDate()}</span>
            ${list.length ? `<span class="cal-dots">${dots}${list.length > 4 ? `<b>+${list.length - 4}</b>` : ''}</span>` : ''}
            ${list.length ? `<span class="cal-count">${allDone ? '✓' : pending.length}</span>` : ''}
          </button>`;
      }

      const sel = Calendar.selected;
      const selTasks = Tasks.sortTasks(byDate[sel] || [], 'date');
      const st = Tasks.dayStats(sel);

      view.innerHTML = `
        <div class="grid cal-grid">
          <div class="card calendar-card">
            <div class="cal-head">
              <button class="icon-btn" data-action="cal-month" data-d="-1" aria-label="Mês anterior">‹</button>
              <h3>${U.MONTHS[m]} <span class="muted">${y}</span></h3>
              <button class="icon-btn" data-action="cal-month" data-d="1" aria-label="Próximo mês">›</button>
              <button class="btn btn-sm" data-action="cal-today">Hoje</button>
            </div>
            <div class="cal-weekdays">${['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'].map((w) => `<span>${w}</span>`).join('')}</div>
            <div class="cal-days">${cells}</div>
            <div class="cal-legend muted small">
              <span><i class="lg today"></i> hoje</span>
              <span><i class="lg overdue"></i> com atrasos</span>
              <span><i class="lg done"></i> tudo concluído</span>
            </div>
          </div>

          <div class="card day-panel">
            <div class="card-head">
              <div>
                <h3>${U.formatDateHuman(sel)}</h3>
                <span class="muted small">${U.formatDateLong(sel)}</span>
              </div>
              <button class="btn btn-sm btn-primary" data-action="new-task" data-date="${sel}">＋ Tarefa</button>
            </div>
            ${st.total ? `<div class="routine-progress"><div class="row between small"><span>${st.done} de ${st.total} concluídas</span><strong>${st.pct}%</strong></div><div class="progress"><span style="width:${st.pct}%"></span></div></div>` : ''}
            <div class="task-list">
              ${selTasks.length ? selTasks.map((t) => Tasks.itemHtml(t, { showDate: false, compact: true })).join('') : `
                <div class="empty-state small">
                  <div class="empty-emoji">🌤️</div>
                  <p class="muted">Nada planejado para este dia.</p>
                </div>`}
            </div>
            <button class="btn btn-ghost btn-block mt" data-action="open-routine-day" data-date="${sel}">🕒 Ver como rotina</button>
          </div>
        </div>`;
    },
  };

  Actions['cal-select'] = (el) => {
    Calendar.selected = el.dataset.date;
    if (Calendar.selected.slice(0, 7) !== Calendar.month.slice(0, 7)) Calendar.month = Calendar.selected.slice(0, 8) + '01';
    Bus.emit('rerender');
  };
  Actions['cal-month'] = (el) => {
    Calendar.month = U.addMonths(Calendar.month, +el.dataset.d);
    Bus.emit('rerender');
  };
  Actions['cal-today'] = () => {
    Calendar.selected = U.today();
    Calendar.month = U.today().slice(0, 8) + '01';
    Bus.emit('rerender');
  };
  Actions['open-routine-day'] = (el) => {
    window.TU.Routine.date = el.dataset.date;
    window.TU.App.go('routine');
  };

  window.TU.Calendar = Calendar;
})();

  <script>
/* =========================================================
   TaskUp — pomodoro.js
   Timer Pomodoro persistente (continua após recarregar).
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, UI, Game, Sound } = window.TU;
  const Actions = window.TU.Actions;

  const MODES = {
    focus: { label: 'Foco', emoji: '🍅', color: 'var(--accent)' },
    short: { label: 'Pausa curta', emoji: '☕', color: '#10b981' },
    long: { label: 'Pausa longa', emoji: '🌴', color: '#0ea5e9' },
  };
  const R = 110;
  const CIRC = 2 * Math.PI * R;
  const BASE_TITLE = document.title || 'TaskUp';

  const P = () => Store.state.pomodoro;
  const cfg = () => Store.state.settings.pomodoro;

  const Pomodoro = {
    MODES,

    duration(mode = P().mode) {
      return Math.max(1, +cfg()[mode] || 25) * 60;
    },

    remaining() {
      const p = P();
      if (p.running && p.endAt) return Math.max(0, Math.round((p.endAt - Date.now()) / 1000));
      return p.remaining ?? Pomodoro.duration();
    },

    start() {
      const fresh = P().remaining === null || P().remaining === undefined;
      const rem = Pomodoro.remaining();
      Store.update((s) => {
        // guarda a duração real da sessão (mudar as configurações depois não altera a contagem)
        if (fresh || !s.pomodoro.length) s.pomodoro.length = rem / 60;
        s.pomodoro.running = true;
        s.pomodoro.endAt = Date.now() + rem * 1000;
        s.pomodoro.remaining = null;
      });
      Sound.play('click');
      window.TU.Notify && window.TU.Notify.schedulePomodoro();
    },

    pause() {
      const rem = Pomodoro.remaining();
      Store.update((s) => {
        s.pomodoro.running = false;
        s.pomodoro.endAt = null;
        s.pomodoro.remaining = rem;
      });
      Sound.play('click');
    },

    toggle() {
      P().running ? Pomodoro.pause() : Pomodoro.start();
    },

    reset() {
      Store.update((s) => {
        s.pomodoro.running = false;
        s.pomodoro.endAt = null;
        s.pomodoro.remaining = null;
        s.pomodoro.length = null;
      });
    },

    setMode(mode, autostart = false) {
      Store.update((s) => {
        s.pomodoro.mode = mode;
        s.pomodoro.running = false;
        s.pomodoro.endAt = null;
        s.pomodoro.remaining = null;
        s.pomodoro.length = null;
      });
      if (autostart) Pomodoro.start();
    },

    setTask(id) {
      Store.update((s) => (s.pomodoro.taskId = id || null));
    },

    startForTask(id) {
      const p = P();
      if (p.running && p.mode === 'focus' && p.taskId && p.taskId !== id) {
        // já existe foco em andamento: apenas troca a tarefa vinculada
        Pomodoro.setTask(id);
        UI.toast('Tarefa vinculada ao Pomodoro em andamento', { icon: '🍅' });
      } else {
        Store.update((s) => {
          s.pomodoro.taskId = id;
          if (!(s.pomodoro.running && s.pomodoro.mode === 'focus')) {
            s.pomodoro.mode = 'focus';
            s.pomodoro.remaining = null;
            s.pomodoro.running = false;
            s.pomodoro.endAt = null;
          }
        });
        if (!P().running) Pomodoro.start();
      }
      window.TU.App.go('pomodoro');
    },

    skip() {
      Pomodoro.finish(false);
    },

    /** Encerra a sessão atual e prepara a próxima. */
    finish(completed) {
      const p = P();
      const mode = p.mode;
      const levelBefore = Game.levelFromXp(Store.state.game.xp);
      let next = 'focus';
      let reward = null;
      const task = p.taskId ? Store.state.tasks.find((t) => t.id === p.taskId) : null;

      Store.update((s) => {
        if (mode === 'focus') {
          if (completed) {
            reward = Game.onPomodoro(s, Math.round(s.pomodoro.length || +cfg().focus));
            if (task) {
              const t = s.tasks.find((x) => x.id === task.id);
              if (t) t.pomodoros = (t.pomodoros || 0) + 1;
            }
          }
          s.pomodoro.cycle = (s.pomodoro.cycle || 0) + (completed ? 1 : 0);
          next = completed && s.pomodoro.cycle % Math.max(1, +cfg().longEvery) === 0 ? 'long' : 'short';
        }
        s.pomodoro.length = null;
        s.pomodoro.mode = next;
        s.pomodoro.running = false;
        s.pomodoro.endAt = null;
        s.pomodoro.remaining = null;
      });

      if (completed) {
        Sound.play('pomodoro');
        const title = mode === 'focus' ? '🍅 Pomodoro concluído!' : '⏰ Pausa encerrada!';
        const body = mode === 'focus' ? `Hora de uma ${MODES[next].label.toLowerCase()}. ${task ? `Foco em "${task.title}" registrado.` : ''}` : 'Bora voltar ao foco? 💪';
        window.TU.Notify && window.TU.Notify.show(title, body, { tag: 'pomodoro', toast: false });
        UI.toast(`${title} ${reward && Game.enabled('showXP') ? `+${reward.xp} XP` : ''}`, { type: mode === 'focus' ? 'xp' : 'info', icon: mode === 'focus' ? '🍅' : '⏰', duration: 5000 });
        if (mode === 'focus') {
          Game.celebrate({});
          Game.checkAchievements();
          if (task && !task.done) {
            UI.toast(`Concluiu "${task.title}"?`, { icon: '✅', duration: 8000, action: { label: 'Marcar feita', fn: () => window.TU.Tasks.get(task.id) && !window.TU.Tasks.get(task.id).done && window.TU.Tasks.toggle(task.id) } });
          }
        }
        Game.afterXp(levelBefore);
        const auto = next === 'focus' ? cfg().autoStartFocus : cfg().autoStartBreaks;
        if (auto) setTimeout(() => Pomodoro.start(), 800);
      }
    },

    /* ---------- Atualização contínua ---------- */
    tick() {
      const p = P();
      if (!p) return;
      const rem = Pomodoro.remaining();
      if (p.running && rem <= 0) {
        Pomodoro.finish(true);
        return;
      }
      const mm = U.pad(Math.floor(rem / 60));
      const ss = U.pad(rem % 60);
      const text = `${mm}:${ss}`;
      const timeEl = document.getElementById('pomo-time');
      if (timeEl && timeEl.textContent !== text) timeEl.textContent = text;
      const ring = document.getElementById('pomo-ring');
      if (ring) {
        const total = p.length ? p.length * 60 : Pomodoro.duration();
        const frac = Math.min(1, rem / total);
        ring.style.strokeDashoffset = String(CIRC * (1 - frac));
      }
      // mini chip no topo
      const chip = document.getElementById('pomo-chip');
      if (chip) {
        const show = p.running || (p.remaining !== null && p.remaining !== undefined);
        chip.hidden = !show;
        if (show) {
          chip.querySelector('.pc-time').textContent = text;
          chip.querySelector('.pc-emoji').textContent = MODES[p.mode].emoji;
          chip.classList.toggle('paused', !p.running);
        }
      }
      document.title = p.running ? `${text} · ${MODES[p.mode].label} — TaskUp` : BASE_TITLE;
    },

    /* ---------- Tela ---------- */
    render(view) {
      const s = Store.state;
      const p = P();
      const mode = MODES[p.mode];
      const today = U.today();
      const todayPomos = s.game.pomodorosByDate[today] || 0;
      const pendingTasks = Tasks().sortTasks(
        s.tasks.filter((t) => !t.done && (!t.date || t.date <= U.addDays(today, 1))),
        'date'
      );
      const task = p.taskId ? s.tasks.find((t) => t.id === p.taskId) : null;
      const every = Math.max(1, +cfg().longEvery);
      const inCycle = (p.cycle || 0) % every;

      view.innerHTML = `
        <div class="grid pomo-grid">
          <div class="card pomo-card mode-${p.mode}">
            <div class="segmented pomo-modes">
              ${Object.entries(MODES).map(([k, md]) => `<label><input type="radio" name="pmode" value="${k}" ${p.mode === k ? 'checked' : ''} data-change="pomo-mode"><span>${md.emoji} ${md.label}</span></label>`).join('')}
            </div>

            <div class="pomo-ring-wrap ${p.running ? 'running' : ''}">
              <svg viewBox="0 0 260 260" class="pomo-svg" aria-hidden="true">
                <circle cx="130" cy="130" r="${R}" class="pomo-track"/>
                <circle cx="130" cy="130" r="${R}" class="pomo-progress" id="pomo-ring" style="stroke-dasharray:${CIRC};stroke-dashoffset:0"/>
              </svg>
              <div class="pomo-center">
                <span class="pomo-mode-label">${mode.emoji} ${mode.label}</span>
                <span class="pomo-time" id="pomo-time">--:--</span>
                <span class="pomo-task-label">${task ? `${task.emoji || '🎯'} ${U.escape(task.title)}` : 'Foco livre'}</span>
              </div>
            </div>

            <div class="pomo-controls">
              <button class="icon-btn lg" data-action="pomo-reset" title="Reiniciar">↺</button>
              <button class="btn btn-primary btn-xl" data-action="pomo-toggle">${p.running ? '⏸ Pausar' : '▶ Iniciar'}</button>
              <button class="icon-btn lg" data-action="pomo-skip" title="Pular">⏭</button>
            </div>

            <div class="pomo-cycle" title="Ciclo até a pausa longa">
              ${Array.from({ length: every }, (_, i) => `<span class="${i < inCycle ? 'on' : ''}">🍅</span>`).join('')}
              <small class="muted">${inCycle}/${every} até a pausa longa</small>
            </div>
          </div>

          <div class="pomo-side">
            <div class="card">
              <div class="card-head"><h3>🎯 Focar em</h3></div>
              <select class="input" data-change="pomo-task">
                <option value="">— Foco livre (sem tarefa) —</option>
                ${pendingTasks.map((t) => `<option value="${t.id}" ${t.id === p.taskId ? 'selected' : ''}>${t.emoji || Store.category(t.categoryId).emoji} ${U.escape(t.title)}${t.time ? ' · ' + t.time : ''}</option>`).join('')}
                ${task && !pendingTasks.includes(task) ? `<option value="${task.id}" selected>${U.escape(task.title)}</option>` : ''}
              </select>
              ${task ? `<div class="row between mt"><span class="muted small">🍅 ${task.pomodoros || 0} pomodoros nesta tarefa</span>${!task.done ? `<button class="btn btn-sm btn-success" data-action="toggle-task" data-id="${task.id}">✓ Concluir tarefa</button>` : '<span class="pill pill-success">Concluída</span>'}</div>` : ''}
            </div>

            <div class="card">
              <div class="card-head"><h3>📊 Hoje</h3></div>
              <div class="stat-row">
                <div><strong>${todayPomos}</strong><span class="muted small">pomodoros</span></div>
                <div><strong>${U.formatDuration((s.game.focusByDate || {})[today] || 0) || '0 min'}</strong><span class="muted small">de foco</span></div>
                <div><strong>${s.game.totalPomodoros}</strong><span class="muted small">no total</span></div>
              </div>
            </div>

            <div class="card">
              <div class="card-head"><h3>⚙️ Durações</h3><button class="link-btn" data-action="go" data-view="settings" data-anchor="pomodoro">editar</button></div>
              <p class="muted small">Foco ${cfg().focus} min · Pausa curta ${cfg().short} min · Pausa longa ${cfg().long} min a cada ${every} focos.</p>
              <ul class="tips">
                <li>📵 Silencie o celular e feche abas que distraem.</li>
                <li>💧 Use as pausas para beber água e alongar.</li>
                <li>🧠 Uma tarefa por vez — multitarefa é ilusão!</li>
              </ul>
            </div>
          </div>
        </div>`;
      Pomodoro.tick();
    },
  };

  const Tasks = () => window.TU.Tasks;

  Actions['pomo-toggle'] = () => Pomodoro.toggle();
  Actions['pomo-reset'] = () => Pomodoro.reset();
  Actions['pomo-skip'] = async () => {
    const p = P();
    if (p.running || p.remaining !== null) {
      const ok = await UI.confirm({ title: 'Pular esta sessão?', text: 'Ela não contará como concluída.', okText: 'Pular', icon: '⏭' });
      if (!ok) return;
    }
    Pomodoro.skip();
  };
  Actions['pomo-task'] = (el) => Pomodoro.startForTask(el.dataset.id);
  Actions['pomo-chip'] = () => window.TU.App.go('pomodoro');

  window.TU.Changes = window.TU.Changes || {};
  window.TU.Changes['pomo-mode'] = async (el) => {
    const p = P();
    if (p.running) {
      const ok = await UI.confirm({ title: 'Trocar de modo?', text: 'Isso interrompe o timer atual.', okText: 'Trocar', icon: '🍅' });
      if (!ok) {
        Bus.emit('rerender');
        return;
      }
    }
    Pomodoro.setMode(el.value);
  };
  window.TU.Changes['pomo-task'] = (el) => Pomodoro.setTask(el.value);

  window.TU.Pomodoro = Pomodoro;
})();

  <script>
/* =========================================================
   TaskUp — notifications.js
   Lembretes locais via Notification API (+ Service Worker
   quando disponível), resumo diário e badge do app.
   Observação: navegadores só disparam lembretes enquanto o
   app estiver aberto (ou em segundo plano). Onde houver
   suporte a Notification Triggers, agendamos no sistema.
   ========================================================= */
(function () {
  'use strict';

  const { U, Store, UI, Sound } = window.TU;

  const supported = 'Notification' in window;
  const LATE = 15 * 60000; // lembretes perdidos há mais de 15 min não são disparados
  const triggersSupported = supported && 'showTrigger' in Notification.prototype && 'TimestampTrigger' in window;

  async function swReg() {
    if (!('serviceWorker' in navigator) || !navigator.serviceWorker.controller) return null;
    try {
      return await Promise.race([navigator.serviceWorker.ready, new Promise((r) => setTimeout(() => r(null), 800))]);
    } catch (_) {
      return null;
    }
  }

  const Notify = {
    supported,
    triggersSupported,

    permission() {
      return supported ? Notification.permission : 'unsupported';
    },

    async request() {
      if (!supported) {
        UI.toast('Seu navegador não suporta notificações.', { type: 'error' });
        return 'unsupported';
      }
      let p = Notification.permission;
      if (p === 'default') {
        try {
          p = await Notification.requestPermission();
        } catch (_) {
          p = Notification.permission;
        }
      }
      if (p === 'granted') UI.toast('Notificações ativadas! 🔔', { type: 'success' });
      else if (p === 'denied') UI.toast('Notificações bloqueadas. Libere nas configurações do navegador.', { type: 'error', duration: 6000 });
      return p;
    },

    /** Exibe uma notificação do sistema (se permitido) e/ou um toast. */
    async show(title, body = '', { tag, toast = true, onlyHidden = false, sound = null, data = {}, action = null } = {}) {
      const s = Store.state.settings;
      if (sound) Sound.play(sound);
      if (toast) {
        const m = title.match(/^(\p{Extended_Pictographic}\uFE0F?)\s*/u);
        UI.toast(`${m ? title.slice(m[0].length) : title}${body ? ' — ' + body : ''}`, { icon: m ? m[1] : '🔔', duration: action ? 12000 : 7000, action });
      }
      if (!s.notifications || !supported || Notification.permission !== 'granted') return;
      if (onlyHidden && document.visibilityState === 'visible') return;
      const opts = {
        body,
        tag: tag || 'taskup-' + Date.now(),
        icon: 'assets/icons/icon-192.png',
        badge: 'assets/icons/icon-192.png',
        renotify: !!tag,
        data,
      };
      try {
        const reg = await swReg();
        if (reg && reg.showNotification) return reg.showNotification(title, opts);
        const n = new Notification(title, opts);
        n.onclick = () => {
          window.focus();
          if (data.view) window.TU.App.go(data.view);
          n.close();
        };
      } catch (e) {
        console.warn('Falha ao notificar', e);
      }
    },

    /** Agenda uma notificação no sistema (somente navegadores com Notification Triggers). */
    async scheduleAt(ts, title, body, tag) {
      if (!triggersSupported || Notification.permission !== 'granted' || !Store.state.settings.notifications) return;
      try {
        const reg = await swReg();
        if (!reg) return;
        // eslint-disable-next-line no-undef
        await reg.showNotification(title, { body, tag, icon: 'assets/icons/icon-192.png', showTrigger: new TimestampTrigger(ts) });
      } catch (_) {}
    },

    schedulePomodoro() {
      const p = Store.state.pomodoro;
      if (p.running && p.endAt) Notify.scheduleAt(p.endAt, '🍅 Tempo esgotado!', 'Sua sessão terminou.', 'pomodoro');
    },

    /** Adia o lembrete de uma tarefa por alguns minutos. */
    snooze(id, minutes = 10) {
      Store.update((s) => {
        const t = s.tasks.find((x) => x.id === id);
        if (!t) return;
        t.snoozeUntil = Date.now() + minutes * 60000;
        // o lembrete adiado substitui o aviso "Agora" do horário exato
        if (t.date && t.time) s.notified[`${t.id}|${t.date}|${t.time}|d`] = Date.now();
      }, { silent: true });
      UI.toast(`Ok! Lembro de novo em ${minutes} min.`, { icon: '😴', duration: 2500 });
    },

    /** Verifica lembretes pendentes. Executado periodicamente. */
    check() {
      const s = Store.state;
      if (!s) return;
      const now = Date.now();
      const notified = s.notified;
      let changed = false;

      s.tasks.forEach((t) => {
        if (t.done || !t.date || !t.time) return;
        const due = U.dueDate(t).getTime();
        const base = `${t.id}|${t.date}|${t.time}`;
        const created = new Date(t.createdAt).getTime();
        const snooze = { label: 'Adiar 10 min', fn: () => Notify.snooze(t.id, 10) };
        // lembrete adiado ("soneca")
        const snoozed = !!t.snoozeUntil;
        if (t.snoozeUntil && now >= t.snoozeUntil) {
          Store.update((st) => {
            const x = st.tasks.find((y) => y.id === t.id);
            if (x) x.snoozeUntil = null;
          }, { silent: true });
          Notify.show(`🔔 ${t.emoji ? t.emoji + ' ' : ''}${t.title}`, `Lembrete adiado · ${t.time}`, { tag: base + 's', sound: 'reminder', data: { view: 'routine' }, action: snooze });
        }
        if (t.reminder !== null && t.reminder !== undefined) {
          const fireAt = due - t.reminder * 60000;
          const key = base + '|r';
          if (now >= fireAt && now <= due + LATE && created <= due - 60000 && !notified[key]) {
            notified[key] = now;
            changed = true;
            const mins = Math.round((due - now) / 60000);
            const when = mins > 1 ? `Começa às ${t.time} (em ${mins >= 60 ? U.formatDuration(mins) : mins + ' min'})` : `Está na hora! (${t.time})`;
            Notify.show(`🔔 ${t.emoji ? t.emoji + ' ' : ''}${t.title}`, when, { tag: base, sound: 'reminder', data: { view: 'routine' }, action: snooze });
          }
          // aviso no horário exato, se o lembrete foi antecipado
          const keyDue = base + '|d';
          if (t.reminder > 0 && now >= due && now - due < LATE && created <= due && !notified[keyDue] && !snoozed) {
            notified[keyDue] = now;
            changed = true;
            Notify.show(`⏰ Agora: ${t.emoji ? t.emoji + ' ' : ''}${t.title}`, 'Bora fazer acontecer!', { tag: base + 'd', sound: 'reminder', data: { view: 'routine' }, action: snooze });
          }
        }
      });

      // resumo diário
      const today = U.today();
      if (s.settings.dailySummary && s.settings.dailySummaryTime) {
        const at = U.parseDateKey(today);
        const [h, m] = s.settings.dailySummaryTime.split(':').map(Number);
        at.setHours(h, m, 0, 0);
        const key = 'summary|' + today;
        if (now >= at.getTime() && now - at.getTime() < 4 * 3600000 && !notified[key]) {
          notified[key] = now;
          changed = true;
          const list = s.tasks.filter((t) => t.date === today && !t.done);
          const overdue = s.tasks.filter((t) => window.TU.Tasks.isOverdue(t) && t.date < today).length;
          if (list.length || overdue) {
            const g = U.greeting();
            Notify.show(`${g.text}! ${g.emoji}`, `Você tem ${list.length} tarefa${list.length === 1 ? '' : 's'} para hoje${overdue ? ` e ${overdue} atrasada${overdue === 1 ? '' : 's'}` : ''}.`, { tag: 'summary', toast: false, data: { view: 'dashboard' } });
          }
        }
      }

      // limpeza de chaves antigas
      Object.keys(notified).forEach((k) => {
        if (now - notified[k] > 8 * 86400000) {
          delete notified[k];
          changed = true;
        }
      });
      if (changed) Store.save();
      Notify.updateBadge();
    },

    updateBadge() {
      if (!('setAppBadge' in navigator)) return;
      const s = Store.state;
      const today = U.today();
      const n = s.tasks.filter((t) => !t.done && t.date && t.date <= today).length;
      try {
        n ? navigator.setAppBadge(n) : navigator.clearAppBadge();
      } catch (_) {}
    },

    /** Agenda (quando suportado) os lembretes das próximas 24h no sistema. */
    async scheduleUpcoming() {
      if (!triggersSupported) return;
      const s = Store.state;
      const now = Date.now();
      for (const t of s.tasks) {
        if (t.done || !t.time || !t.date || t.reminder === null) continue;
        const fireAt = U.dueDate(t).getTime() - t.reminder * 60000;
        if (fireAt > now && fireAt - now < 86400000) {
          await Notify.scheduleAt(fireAt, `🔔 ${t.title}`, `Às ${t.time}`, `${t.id}|${t.date}|${t.time}`);
        }
      }
    },

    start() {
      Notify.check();
      setInterval(Notify.check, 20000);
      document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && Notify.check());
      Notify.scheduleUpcoming();
    },
  };

  window.TU.Notify = Notify;
})();

  <script>
/* =========================================================
   TaskUp — backup.js
   Exportar / importar dados (JSON), exportar CSV,
   cópias automáticas locais e reset.
   ========================================================= */
(function () {
  'use strict';

  const { U, Store, UI } = window.TU;
  const SNAP_PREFIX = 'taskup:snapshot:';
  const MAX_SNAPSHOTS = 5;

  const Backup = {
    /** Pergunta se o arquivo deve ser protegido por senha e exporta. */
    async exportJSON() {
      const Sec = window.TU.Security;
      let password = null;
      if (Sec && window.TU.Crypto.available) {
        password = await Sec.askPassword({
          title: '💾 Exportar backup',
          text: 'Opcional: proteja <strong>só o arquivo de backup</strong> com senha (criptografia AES-256), útil se for guardá-lo na nuvem, e-mail ou pen drive. <strong>Deixe em branco para exportar sem senha.</strong> O app continua abrindo normalmente, sem senha.',
          confirm: true,
          optional: true,
          okText: 'Exportar',
        });
        if (password === undefined) return; // cancelou
      }
      const { notified, ...rest } = Store.state;
      void notified;
      const json = JSON.stringify({ ...rest, exportedAt: new Date().toISOString() }, null, 2);
      let content = json;
      let name = `taskup-backup-${U.today()}.json`;
      if (password) {
        content = JSON.stringify(await window.TU.Crypto.encryptWithPassword(password, json, 'backup'));
        name = `taskup-backup-protegido-${U.today()}.json`;
      }
      U.download(name, content, 'application/json');
      Store.update((s) => (s.settings.lastBackup = new Date().toISOString()));
      UI.toast(password ? 'Backup protegido por senha exportado! 🔐' : 'Backup exportado! Guarde o arquivo em local seguro.', { type: 'success', icon: '💾' });
    },

    exportCSV() {
      const s = Store.state;
      const head = ['Título', 'Categoria', 'Prioridade', 'Data', 'Horário', 'Duração (min)', 'Repetição', 'Concluída', 'Concluída em', 'Subtarefas', 'Pomodoros', 'Notas'];
      const esc = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
      const rows = s.tasks.map((t) =>
        [
          t.title,
          Store.category(t.categoryId).name,
          window.TU.Tasks.PRIORITIES[t.priority].label,
          t.date || '',
          t.time || '',
          t.duration,
          window.TU.Tasks.RECURRENCE[t.recurrence],
          t.done ? 'Sim' : 'Não',
          t.completedAt ? new Date(t.completedAt).toLocaleString('pt-BR') : '',
          t.subtasks.map((x) => (x.done ? '[x] ' : '[ ] ') + x.title).join(' | '),
          t.pomodoros,
          t.notes,
        ]
          .map(esc)
          .join(';')
      );
      U.download(`taskup-tarefas-${U.today()}.csv`, '﻿' + [head.map(esc).join(';'), ...rows].join('\r\n'), 'text/csv;charset=utf-8');
      UI.toast('Planilha CSV exportada!', { type: 'success', icon: '📊' });
    },

    importFile(file) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = async () => {
        let data;
        try {
          data = JSON.parse(reader.result);
          if (window.TU.Crypto && window.TU.Crypto.isEnvelope(data)) {
            data = await Backup.openProtected(data);
            if (!data) return;
          }
          if (data.app !== 'TaskUp' || !Array.isArray(data.tasks)) throw new Error('Arquivo não é um backup do TaskUp');
        } catch (e) {
          UI.toast('Arquivo inválido: ' + e.message, { type: 'error', duration: 6000 });
          return;
        }
        const ok = await UI.confirm({
          title: 'Restaurar backup?',
          text: `O arquivo contém <strong>${data.tasks.length} tarefas</strong> e ${data.categories?.length || 0} categorias${data.exportedAt ? `, exportado em ${new Date(data.exportedAt).toLocaleString('pt-BR')}` : ''}.<br>Seus dados atuais serão substituídos (uma cópia de segurança automática será criada antes).`,
          okText: 'Restaurar',
          icon: '📦',
        });
        if (!ok) return;
        Backup.snapshot('antes-da-importacao');
        try {
          delete data.exportedAt;
          Store.replace(data);
          window.TU.App.applyTheme();
          UI.toast('Backup restaurado com sucesso!', { type: 'success', icon: '✅' });
        } catch (e) {
          UI.toast('Falha ao restaurar: ' + e.message, { type: 'error' });
        }
      };
      reader.readAsText(file);
    },

    /** Pede a senha de um backup protegido (até acertar ou cancelar). */
    async openProtected(envelope) {
      let error = '';
      for (;;) {
        const pw = await window.TU.Security.askPassword({ title: '🔐 Backup protegido', text: 'Este arquivo está protegido por senha. Digite a senha usada ao exportar.', error, okText: 'Abrir' });
        if (!pw) return null;
        try {
          const { text } = await window.TU.Crypto.decryptWithPassword(pw, envelope);
          return JSON.parse(text);
        } catch (_) {
          error = 'Senha incorreta (ou arquivo alterado). Tente de novo.';
        }
      }
    },

    /* ---------- Cópias automáticas no próprio navegador ----------
       Também servem para a recuperação automática se os dados se corromperem. */
    snapshot(label = U.today()) {
      try {
        U.storage.setItem(SNAP_PREFIX + label, JSON.stringify({ ...Store.state, snapshotAt: new Date().toISOString() }));
        Backup.pruneSnapshots();
      } catch (e) {
        console.warn('Snapshot falhou', e);
      }
    },

    listSnapshots() {
      const out = [];
      try {
        U.storage.keys().forEach((k) => {
          if (k && k.startsWith(SNAP_PREFIX)) out.push(k.slice(SNAP_PREFIX.length));
        });
      } catch (_) {}
      return out.sort().reverse();
    },

    pruneSnapshots() {
      const daily = Backup.listSnapshots().filter((k) => /^\d{4}-\d{2}-\d{2}$/.test(k));
      daily.slice(MAX_SNAPSHOTS).forEach((k) => U.storage.removeItem(SNAP_PREFIX + k));
      const other = Backup.listSnapshots().filter((k) => !/^\d{4}-\d{2}-\d{2}$/.test(k));
      other.slice(2).forEach((k) => U.storage.removeItem(SNAP_PREFIX + k));
    },

    autoSnapshot() {
      const today = U.today();
      if (!Backup.listSnapshots().includes(today) && Store.state.tasks.length) Backup.snapshot(today);
    },

    async restoreSnapshot(label) {
      const raw = U.storage.getItem(SNAP_PREFIX + label);
      if (!raw) return;
      const ok = await UI.confirm({ title: 'Restaurar cópia automática?', text: `Cópia: <strong>${U.escape(label)}</strong>. Os dados atuais serão substituídos.`, okText: 'Restaurar', icon: '🕰️' });
      if (!ok) return;
      try {
        const obj = JSON.parse(raw);
        delete obj.snapshotAt;
        Store.replace(obj);
        window.TU.App.applyTheme();
        UI.toast('Cópia restaurada!', { type: 'success' });
      } catch (e) {
        UI.toast('Não foi possível abrir a cópia: ' + e.message, { type: 'error' });
      }
    },

    async resetAll() {
      const ok = await UI.confirm({
        title: 'Apagar TODOS os dados?',
        text: 'Tarefas, categorias, XP, conquistas e configurações serão apagados deste dispositivo. Essa ação não pode ser desfeita.',
        okText: 'Apagar tudo',
        danger: true,
        icon: '💣',
      });
      if (!ok) return;
      Backup.snapshot('antes-do-reset');
      Store.reset();
      window.TU.App.applyTheme();
      UI.toast('Tudo limpo. Recomeçando do zero! 🌱', { type: 'success' });
      window.TU.App.onboarding();
    },
  };

  window.TU.Backup = Backup;
})();

</script>
  <script>
/* =========================================================
   TaskUp — security.js
   Segurança e privacidade dos dados locais (sem senha para
   entrar no app):
   - janela de senha usada SÓ para proteger arquivos de backup
   - seção "Segurança e privacidade" das Configurações
   A proteção principal fica em: index.html (política de segurança
   que proíbe rede e scripts externos), storage.js (validação e
   recuperação automática) e crypto.js (cifra dos backups).
   ========================================================= */
(function () {
  'use strict';

  const { U, UI, Crypto } = window.TU;
  const MIN_LENGTH = 6;
  const STRENGTH = [
    ['Muito fraca', '#ef4444'],
    ['Fraca', '#f97316'],
    ['Razoável', '#eab308'],
    ['Boa', '#22c55e'],
    ['Forte', '#10b981'],
  ];

  const Security = {
    MIN_LENGTH,

    /* ---------- Janela de senha reutilizável ----------
       Resolve com a senha, '' (opcional e em branco) ou undefined (cancelado). */
    askPassword({ title = '🔐 Senha', text = '', confirm = false, optional = false, strength = false, okText = 'Continuar', error = '', autocomplete = 'current-password' } = {}) {
      return new Promise((resolve) => {
        let done = false;
        UI.modal({
          title,
          size: 'sm',
          body: `
            <div class="form pw-form">
              ${text ? `<p class="muted small">${text}</p>` : ''}
              <label class="field"><span>Senha</span>
                <div class="pw-field">
                  <input type="password" class="input input-lg" data-pw1 autocomplete="${confirm ? 'new-password' : autocomplete}" maxlength="128" autofocus>
                  <button type="button" class="icon-btn" data-toggle-pw aria-label="Mostrar senha">👁️</button>
                </div>
              </label>
              ${strength ? `<div class="pw-meter"><i></i><i></i><i></i><i></i></div><span class="pw-meter-label muted small"></span>` : ''}
              ${confirm ? `<label class="field"><span>Repita a senha</span><input type="password" class="input input-lg" data-pw2 autocomplete="new-password" maxlength="128"></label>` : ''}
              <p class="pw-error" role="alert">${U.escape(error)}</p>
              <div class="form-actions">
                <span></span>
                <div class="row gap">
                  <button type="button" class="btn btn-ghost" data-cancel>Cancelar</button>
                  <button type="button" class="btn btn-primary" data-ok>${U.escape(okText)}</button>
                </div>
              </div>
            </div>`,
          onMount(el, api) {
            const p1 = el.querySelector('[data-pw1]');
            const p2 = el.querySelector('[data-pw2]');
            const err = el.querySelector('.pw-error');
            const meter = el.querySelector('.pw-meter');
            const label = el.querySelector('.pw-meter-label');
            el.querySelector('[data-toggle-pw]').onclick = () => {
              p1.type = p1.type === 'password' ? 'text' : 'password';
              if (p2) p2.type = p1.type;
            };
            if (meter) {
              p1.addEventListener('input', () => {
                const sc = p1.value ? Crypto.strength(p1.value) : -1;
                meter.querySelectorAll('i').forEach((b, i) => (b.style.background = i < sc ? STRENGTH[sc][1] : ''));
                label.textContent = sc < 0 ? '' : `Força: ${STRENGTH[sc][0]}`;
              });
            }
            const submit = () => {
              const a = p1.value;
              if (optional && !a && (!p2 || !p2.value)) {
                done = true;
                api.close();
                return resolve('');
              }
              if (!a) return (err.textContent = 'Digite a senha.');
              if (confirm && a.length < MIN_LENGTH) return (err.textContent = `Use pelo menos ${MIN_LENGTH} caracteres.`);
              if (confirm && a !== p2.value) return (err.textContent = 'As senhas não conferem.');
              done = true;
              api.close();
              resolve(a);
            };
            el.querySelector('[data-ok]').onclick = submit;
            el.querySelector('[data-cancel]').onclick = () => api.close();
            el.addEventListener('keydown', (e) => {
              if (e.key === 'Enter') {
                e.preventDefault();
                submit();
              }
            });
          },
          onClose() {
            if (!done) resolve(undefined);
          },
        });
      });
    },

    /* ---------- Seção nas Configurações ---------- */
    settingsHtml() {
      const snaps = window.TU.Backup.listSnapshots().length;
      return `<section class="card" id="sec-security">
        <h3>🛡️ Segurança e privacidade</h3>
        <p class="muted small">O app abre direto, sem senha. Mesmo assim, seus dados contam com estas proteções:</p>
        ${Security.privacyList(snaps)}
      </section>`;
    },

    privacyList(snaps = 0) {
      return `<ul class="privacy-list">
        <li>📵 <strong>Sem rede:</strong> o app é proibido de fazer qualquer conexão (política de segurança de conteúdo), então nenhum dado sai do aparelho.</li>
        <li>🧱 <strong>Sem código externo:</strong> só os arquivos do próprio app podem ser executados.</li>
        <li>🧼 <strong>Dados validados:</strong> backups importados são verificados e limpos antes de entrar no app.</li>
        <li>🛟 <strong>Recuperação automática:</strong> cada salvamento grava também uma cópia espelho, e uma cópia por dia fica guardada no aparelho (${snaps} agora). Se os dados se corromperem, o app restaura sozinho a cópia mais recente.</li>
        <li>🔐 <strong>Backup com senha (opcional):</strong> ao exportar, você pode proteger só o arquivo com criptografia AES-256 — ou deixar sem senha.</li>
      </ul>`;
    },
  };

  window.TU.Security = Security;
})();

</script>
  <script>
/* =========================================================
   TaskUp — categories.js
   Criar, editar, excluir e visualizar categorias.
   ========================================================= */
(function () {
  'use strict';

  const { U, Bus, Store, UI, Tasks, Game } = window.TU;
  const Actions = window.TU.Actions;

  const Categories = {
    openForm(id = null) {
      const editing = id ? Store.state.categories.find((c) => c.id === id) : null;
      const c = editing || { name: '', emoji: '📌', color: U.pick(U.COLORS) };
      UI.modal({
        title: editing ? 'Editar categoria' : 'Nova categoria',
        size: 'sm',
        body: `
          <form class="form" autocomplete="off">
            <div class="field-row title-row">
              ${UI.emojiPicker(c.emoji)}
              <input class="input input-lg" name="name" placeholder="Nome da categoria" value="${U.escape(c.name)}" required maxlength="40" autofocus>
            </div>
            <div class="field">
              <label>Cor</label>
              ${UI.colorPicker(c.color)}
            </div>
            <div class="cat-preview"></div>
            <div class="form-actions">
              <span></span>
              <div class="row gap">
                <button type="button" class="btn btn-ghost" data-cancel>Cancelar</button>
                <button type="submit" class="btn btn-primary">${editing ? 'Salvar' : 'Criar'}</button>
              </div>
            </div>
          </form>`,
        onMount(el, api) {
          UI.bindEmojiPicker(el);
          const form = el.querySelector('form');
          const preview = el.querySelector('.cat-preview');
          const custom = form.querySelector('[name="color-custom"]');
          const color = () => form.querySelector('[name="color"]:checked')?.value || custom.value;
          const upd = () => {
            preview.innerHTML = `<span class="chip lg" style="--c:${color()}">${form.emoji.value || '📌'} ${U.escape(form.name.value || 'Prévia')}</span>`;
          };
          custom.addEventListener('input', () => {
            form.querySelectorAll('[name="color"]').forEach((r) => (r.checked = false));
            upd();
          });
          form.addEventListener('input', upd);
          el.querySelector('.emoji-grid').addEventListener('click', () => setTimeout(upd));
          upd();
          el.querySelector('[data-cancel]').onclick = () => api.close();
          form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = form.name.value.trim();
            if (!name) return;
            const { name: n, emoji: em, color: co } = Store.sanitizeCategory({ name, emoji: form.emoji.value || '📌', color: color() });
            const data = { name: n, emoji: em, color: co };
            if (editing) {
              Store.update((s) => Object.assign(s.categories.find((x) => x.id === editing.id), data));
              UI.toast('Categoria atualizada', { type: 'success' });
            } else {
              Store.update((s) => s.categories.push({ id: 'c-' + U.uid(), ...data }));
              UI.toast(`Categoria ${data.emoji} ${data.name} criada!`, { type: 'success' });
              Game.checkAchievements();
            }
            api.close();
          });
        },
      });
    },

    async remove(id) {
      const s = Store.state;
      const cat = s.categories.find((c) => c.id === id);
      if (!cat) return;
      if (id === 'cat-outros') {
        UI.toast('A categoria "Outros" é usada como padrão e não pode ser excluída.', { type: 'error' });
        return;
      }
      const count = s.tasks.filter((t) => t.categoryId === id).length;
      if (!count) {
        const ok = await UI.confirm({ title: `Excluir "${cat.name}"?`, okText: 'Excluir', danger: true, icon: cat.emoji });
        if (ok) Store.update((st) => (st.categories = st.categories.filter((c) => c.id !== id)));
        return;
      }
      UI.modal({
        size: 'sm',
        className: 'modal-confirm',
        body: `
          <div class="confirm-icon">${cat.emoji}</div>
          <h3>Excluir "${U.escape(cat.name)}"?</h3>
          <p class="muted">Ela possui ${count} tarefa${count > 1 ? 's' : ''}. O que fazer com elas?</p>
          <div class="field">
            <select class="input" data-move>
              ${s.categories.filter((c) => c.id !== id).map((c) => `<option value="${c.id}" ${c.id === 'cat-outros' ? 'selected' : ''}>Mover para ${c.emoji} ${U.escape(c.name)}</option>`).join('')}
              <option value="__delete">🗑️ Excluir as tarefas também</option>
            </select>
          </div>
          <div class="confirm-actions">
            <button class="btn btn-ghost" data-cancel>Cancelar</button>
            <button class="btn btn-danger" data-ok>Excluir categoria</button>
          </div>`,
        onMount(el, api) {
          el.querySelector('[data-cancel]').onclick = () => api.close();
          el.querySelector('[data-ok]').onclick = () => {
            const target = el.querySelector('[data-move]').value;
            Store.update((st) => {
              if (target === '__delete') st.tasks = st.tasks.filter((t) => t.categoryId !== id);
              else st.tasks.forEach((t) => t.categoryId === id && (t.categoryId = target));
              st.categories = st.categories.filter((c) => c.id !== id);
            });
            api.close();
            UI.toast('Categoria excluída', { icon: '🗑️' });
          };
        },
      });
    },

    move(id, dir) {
      Store.update((s) => {
        const i = s.categories.findIndex((c) => c.id === id);
        const j = i + dir;
        if (i < 0 || j < 0 || j >= s.categories.length) return;
        [s.categories[i], s.categories[j]] = [s.categories[j], s.categories[i]];
      });
    },

    render(view) {
      const s = Store.state;
      const today = U.today();
      view.innerHTML = `
        <div class="row between mb">
          <p class="muted">Organize suas atividades por áreas da vida. Clique em uma categoria para ver suas tarefas.</p>
          <button class="btn btn-primary" data-action="new-category">＋ Nova categoria</button>
        </div>
        <div class="cat-cards">
          ${s.categories
            .map((c, i) => {
              const list = s.tasks.filter((t) => t.categoryId === c.id);
              const done = list.filter((t) => t.done).length;
              const pending = list.length - done;
              const overdue = list.filter((t) => Tasks.isOverdue(t)).length;
              const todayN = list.filter((t) => t.date === today && !t.done).length;
              const pct = list.length ? Math.round((done / list.length) * 100) : 0;
              return `
              <div class="card cat-card" style="--c:${c.color}">
                <div class="cat-card-top" data-action="open-category" data-id="${c.id}" role="button" tabindex="0">
                  <span class="cat-emoji">${c.emoji}</span>
                  <div>
                    <h3>${U.escape(c.name)}</h3>
                    <span class="muted small">${pending} pendente${pending === 1 ? '' : 's'}${todayN ? ` · ${todayN} hoje` : ''}${overdue ? ` · <span class="danger">${overdue} atrasada${overdue === 1 ? '' : 's'}</span>` : ''}</span>
                  </div>
                </div>
                <div class="progress sm cat-progress"><span style="width:${pct}%"></span></div>
                <div class="row between">
                  <span class="muted small">${done}/${list.length} concluídas</span>
                  <div class="cat-actions">
                    <button class="icon-btn sm" data-action="cat-move" data-id="${c.id}" data-d="-1" ${i === 0 ? 'disabled' : ''} title="Mover para cima">↑</button>
                    <button class="icon-btn sm" data-action="cat-move" data-id="${c.id}" data-d="1" ${i === s.categories.length - 1 ? 'disabled' : ''} title="Mover para baixo">↓</button>
                    <button class="icon-btn sm" data-action="new-task" data-category="${c.id}" title="Nova tarefa nesta categoria">＋</button>
                    <button class="icon-btn sm" data-action="edit-category" data-id="${c.id}" title="Editar">✏️</button>
                    ${c.id !== 'cat-outros' ? `<button class="icon-btn sm" data-action="delete-category" data-id="${c.id}" title="Excluir">🗑️</button>` : ''}
                  </div>
                </div>
              </div>`;
            })
            .join('')}
          <button class="card cat-card cat-new" data-action="new-category"><span>＋</span>Criar categoria</button>
        </div>`;
    },
  };

  Actions['new-category'] = () => Categories.openForm();
  Actions['edit-category'] = (el) => Categories.openForm(el.dataset.id);
  Actions['delete-category'] = (el) => Categories.remove(el.dataset.id);
  Actions['cat-move'] = (el) => Categories.move(el.dataset.id, +el.dataset.d);
  Actions['open-category'] = (el) => {
    Object.assign(Tasks.filters, { category: el.dataset.id, status: 'pending', q: '' });
    window.TU.App.go('tasks');
  };

  window.TU.Categories = Categories;
  void Bus;
})();

</script>

/* =========================================================
   TaskUp — settings.js
   Tela de configurações: perfil, aparência, gamificação,
   sons, notificações, Pomodoro e dados.
